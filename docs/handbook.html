t of the weights, 5–40 s; cloud: whether the key and model are accepted); if it\n  fails, nothing is saved. Leaving the page with unsaved changes asks first. The <em>Advanced<\/em> section edits\n  <code>local.yaml<\/code> and the instructions as raw text (both also applied right away).<\/li>\n<li><strong>Personality:<\/strong> Assistant → Personality picks how it sounds: <em>Calm<\/em> (warm, steady, the default),\n  <em>Sweet<\/em> (honest, close, a little whimsical), <em>Tsundere<\/em> (teasing and prickly outside, caring\n  inside), <em>Genki<\/em> (upbeat, attentive, offers the next step). The panel below the cards edits the\n  chosen one's name, description and words; <em>Save as new…<\/em> keeps the words as another personality,\n  <em>Restore original<\/em> undoes your edits to a shipped one, <em>Delete<\/em> removes one of your own. What it may\n  do, the shape of its replies and the confirmations are in the instructions and stay the same for\n  every personality.<\/li>\n<li><strong>Listening to voices:<\/strong> ▶ next to a Kokoro voice speaks a sample sentence, and ▶ next to a\n  Chatterbox voice plays the recording it copies, both on the assistant's speaker (in the browser when\n  there is no speaker, e.g. <code>alveus api<\/code>). Kokoro previews need Kokoro to be the running engine.<\/li>\n<\/ul>\n<p><strong>On another machine.<\/strong> After <code>./install.sh<\/code> there, the GUI is available the same way at\n<code>http://127.0.0.1:8765/<\/code> whenever <code>systemctl --user start alveus<\/code>, <code>alveus talk<\/code>, or <code>alveus api<\/code>\n(GUI without microphone) is running; <code>alveus ui<\/code> opens it in the default browser. To reach a remote\nmachine's GUI from your laptop, tunnel the port rather than exposing it:\n<code>ssh -L 8765:127.0.0.1:8765 user@that-machine<\/code>, then browse to <code>http://127.0.0.1:8765/<\/code> locally.<\/p>\n<h2 id=\"text-mode\">Text mode<\/h2>\n<pre><code class=\"language-bash\">conda activate alveus\nalveus chat                  # REPL with tools; /tools lists them, /reset clears history, /quit exits\nalveus chat --speak          # replies are also spoken\nalveus chat --show-thinking  # print the model's reasoning stream in grey\nalveus chat --no-tools       # pure conversation\nalveus chat --profile bonsai-ternary\n<\/code><\/pre>\n<p>In text mode destructive confirmations are terminal <code>[y/N]<\/code> prompts.<\/p>\n<h2 id=\"cli-reference\">CLI reference<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>command<\/th>\n<th>purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>alveus talk [-v] [--no-api] [--profile P]<\/code><\/td>\n<td>full voice assistant + HTTP API<\/td>\n<\/tr>\n<tr>\n<td><code>alveus chat [--speak] [--no-tools] [--show-thinking] [--profile P]<\/code><\/td>\n<td>text REPL<\/td>\n<\/tr>\n<tr>\n<td><code>alveus api<\/code><\/td>\n<td>HTTP API only (no microphone), for other frontends<\/td>\n<\/tr>\n<tr>\n<td><code>alveus ui<\/code><\/td>\n<td>open the browser GUI of the running assistant<\/td>\n<\/tr>\n<tr>\n<td><code>alveus handbook [--rebuild]<\/code><\/td>\n<td>open the offline documentation (<code>docs/handbook.html<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus trigger<\/code><\/td>\n<td>make the running assistant listen now (bind to a keyboard shortcut)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus say \"text\"<\/code><\/td>\n<td>speak through the running assistant (falls back to local synthesis)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus tools<\/code><\/td>\n<td>connect every MCP server and list tools (destructive ones marked)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus devices<\/code><\/td>\n<td>audio devices (<code>wpctl status<\/code> on PipeWire)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus doctor [--warm]<\/code><\/td>\n<td>environment health check; <code>--warm<\/code> also loads STT/TTS/wake word<\/td>\n<\/tr>\n<tr>\n<td><code>alveus wakeword-test [--seconds N]<\/code><\/td>\n<td>live openWakeWord scores<\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm profiles<\/code><\/td>\n<td>table of LLM profiles: provider, protocol, local/cloud, and whether the weights or the API key are present<\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm key NAME [--remove]<\/code><\/td>\n<td>store an API key (asked without echo) in <code>~/.config/alveus/secrets.env<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm serve [--profile P] [--host H] [--port N] [--extra \"…\"]<\/code><\/td>\n<td>launch llama-server for a profile (what the service runs); exits 0 for profiles without a local server<\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm test [--prompt \"…\"] [--profile P] [--show-thinking] [--thinking/--no-thinking]<\/code><\/td>\n<td>stream a quick reply (one paid request for a cloud profile)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus tts say \"text\" [--out file.wav]<\/code><\/td>\n<td>synthesize and play / save<\/td>\n<\/tr>\n<tr>\n<td><code>alveus tts voices<\/code><\/td>\n<td>list voices of the active TTS backend<\/td>\n<\/tr>\n<tr>\n<td><code>alveus stt test [--seconds N] [--file x.wav]<\/code><\/td>\n<td>record (or read a WAV) and transcribe<\/td>\n<\/tr>\n<tr>\n<td><code>alveus version<\/code><\/td>\n<td>version and repo path<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>All commands read the same configuration; <code>-v<\/code> on <code>talk<\/code>/<code>chat<\/code>/<code>api<\/code> enables debug logging.<\/p>\n<h2 id=\"starting-and-stopping\">Starting and stopping<\/h2>\n<p>Both services are <strong>enabled<\/strong>, so after a reboot (or logging in) they start by themselves: the LLM\nserver first, then the assistant with its GUI at <code>http://127.0.0.1:8765/<\/code>. Allow about a minute for\nthe models to load. Nothing needs to be typed.<\/p>\n<pre><code class=\"language-bash\">systemctl --user stop alveus alveus-llm      # stop everything\nsystemctl --user start alveus-llm alveus     # start everything\nsystemctl --user restart alveus              # restart only the assistant (after config changes)\nsystemctl --user status alveus alveus-llm    # current state\njournalctl --user -u alveus -f               # live log\nsystemctl --user disable alveus alveus-llm   # turn off autostart (enable to turn it back on)\n<\/code><\/pre>\n<h2 id=\"running-as-a-service-vs-by-hand\">Running as a service vs. by hand<\/h2>\n<p>The systemd units start both the LLM server and the assistant at login. To iterate manually,\nstop the assistant unit first so two instances do not both answer the microphone:<\/p>\n<pre><code class=\"language-bash\">systemctl --user stop alveus\nalveus talk -v\nsystemctl --user start alveus\n<\/code><\/pre>\n<p>The LLM unit can stay running; <code>alveus talk<\/code>, <code>alveus chat<\/code> and opencode all share it.<\/p>\n<h2 id=\"switching-the-model\">Switching the model<\/h2>\n<pre><code class=\"language-bash\"># one-off\nALVEUS_LLM_PROFILE=bonsai-ternary alveus llm serve      # in one terminal\nALVEUS_LLM_PROFILE=bonsai-ternary alveus chat            # in another\n\n# permanent: config/local.yaml\nllm:\n  profile: bonsai-ternary\n# then: systemctl --user restart alveus-llm alveus\n<\/code><\/pre>\n<p>The Ternary model is ~7 GB (vs 3.8 GB), keeps ~95 % of full-precision quality (vs ~90 %) and\nscores higher on tool use; generation is somewhat slower.<\/p>\n<p>Cloud models work the same way: <code>ALVEUS_LLM_PROFILE=claude alveus chat<\/code> for a try (the key must\nbe set first, see <a href=\"#backends/api-keys\">backends.md<\/a>), or choose <code>claude<\/code>, <code>chatgpt<\/code> or <code>deepseek<\/code>\nin Settings → Language model → Model profile, where the key fields are right below. Saving checks\nthe key and model, then restarts both services; <code>alveus-llm<\/code> stops by itself because a cloud\nprofile needs no local server, and the assistant keeps it stopped at every start until you choose\na local profile again. The last chosen profile is what starts after a reboot. Everything said in the conversation, and what the tools read for\nit, then goes to that provider. To add your own (another model, OpenRouter, a vLLM box on the\nnetwork), add a profile; the keys are described in <a href=\"#configuration/llm\">configuration.md<\/a>.<\/p>\n<h2 id=\"changing-the-voice-and-the-name\">Changing the voice (and the name)<\/h2>\n<pre><code class=\"language-yaml\">tts:\n  kokoro:\n    voice: am_michael     # a male voice -&gt; the assistant calls itself Alveus\n<\/code><\/pre>\n<p><code>alveus tts voices<\/code> lists the 28 Kokoro voices; <code>alveus tts say \"…\"<\/code> previews one after editing\nthe config. For a cloned voice, switch <code>tts.backend<\/code> to <code>chatterbox<\/code> (or <code>qwen3<\/code>) and set\n<code>chatterbox.voice_ref<\/code> (<code>qwen3.voice_ref<\/code>) to a clean 5–15 s WAV of the speaker.<\/p>\n<p><strong>Voices that come ready to copy<\/strong> (this machine's <code>voices/<\/code>, details and terms in <code>voices/SOURCES.md<\/code>),\nall female, each with its words in a <code>.txt<\/code> file:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>file<\/th>\n<th>voice<\/th>\n<th>from<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>f_ayaka_ja<\/code><\/td>\n<td>Ayaka (朱花), Japanese; cheeky, tsundere-style<\/td>\n<td>AI声優-朱花 official sample (free use; credit \"AI声優-朱花\" if you publish)<\/td>\n<\/tr>\n<tr>\n<td><code>f_hina_ja<\/code><\/td>\n<td>Hina, Japanese; high, soft, a little wistful<\/td>\n<td>japanese-anime-speech (CC0)<\/td>\n<\/tr>\n<tr>\n<td><code>f_yuzu_ja<\/code><\/td>\n<td>Yuzu, Japanese; high and playful<\/td>\n<td>japanese-anime-speech (CC0)<\/td>\n<\/tr>\n<tr>\n<td><code>f_mio_ja<\/code><\/td>\n<td>Mio, Japanese; gentle, mid pitch<\/td>\n<td>japanese-anime-speech (CC0)<\/td>\n<\/tr>\n<tr>\n<td><code>f_shiori_ja<\/code><\/td>\n<td>Shiori, Japanese; lower, calm, polite<\/td>\n<td>japanese-anime-speech (CC0)<\/td>\n<\/tr>\n<tr>\n<td><code>f_feiyu_zh<\/code><\/td>\n<td>Feiyu (大肥鱼), Chinese; young, warm, caring<\/td>\n<td>da-fei-yu-girl-voice-zh (CC-BY-NC 4.0)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>They copy best with Qwen3-TTS, which speaks all of them in English too; Chatterbox Multilingual\ncopies them as well. With your own recording, <em>Write it down<\/em> (Settings → Voice → Qwen3-TTS → Its\nwords) saves what it says so Qwen3-TTS can copy it closely.<\/p>\n<h2 id=\"speaking-other-languages\">Speaking other languages<\/h2>\n<ol>\n<li>Settings → Voice: engine <em>Qwen3-TTS<\/em> (10 languages) or <em>Chatterbox<\/em> → <em>Multilingual<\/em> (23), spoken\n   language <em>automatic<\/em> (or fix one, e.g. <code>zh<\/code>).<\/li>\n<li>Settings → Speech: clear <em>Spoken language<\/em> so Whisper detects the language you speak.<\/li>\n<li>Save, restart. Speak Chinese (or German, Japanese…) and the assistant hears, thinks and answers in\n   that language; each sentence is voiced in the language it is written in, so mixed replies work.\n   The wake names still have to be said as \"Alveus\"/\"Aurea\" (add local spellings to <em>Name aliases<\/em>\n   if Whisper writes them differently in your language).<\/li>\n<\/ol>\n<h2 id=\"using-alveus-from-other-programs\">Using Alveus from other programs<\/h2>\n<p>Everything the voice loop can do is reachable over HTTP on <code>127.0.0.1:8765<\/code> while\n<code>alveus talk<\/code> (or <code>alveus api<\/code>) runs — see <a href=\"#api\">api.md<\/a>. Examples:<\/p>\n<pre><code class=\"language-bash\">curl -s localhost:8765/chat -H 'content-type: application/json' -d '{&quot;text&quot;:&quot;what time is it?&quot;}'\ncurl -s localhost:8765/speak -H 'content-type: application/json' -d '{&quot;text&quot;:&quot;Dinner is ready&quot;,&quot;play&quot;:true}'\ncurl -s -X POST localhost:8765/trigger        # start listening (Wayland shortcut, phone, Stream Deck…)\n<\/code><\/pre>", "headings": [{"id": "talking-to-alveus-aurea", "text": "Talking to Alveus / Aurea", "level": 2}, {"id": "example-requests-by-tool-group", "text": "Example requests by tool group", "level": 3}, {"id": "browser-gui", "text": "Browser GUI", "level": 2}, {"id": "text-mode", "text": "Text mode", "level": 2}, {"id": "cli-reference", "text": "CLI reference", "level": 2}, {"id": "starting-and-stopping", "text": "Starting and stopping", "level": 2}, {"id": "running-as-a-service-vs-by-hand", "text": "Running as a service vs. by hand", "level": 2}, {"id": "switching-the-model", "text": "Switching the model", "level": 2}, {"id": "changing-the-voice-and-the-name", "text": "Changing the voice (and the name)", "level": 2}, {"id": "speaking-other-languages", "text": "Speaking other languages", "level": 2}, {"id": "using-alveus-from-other-programs", "text": "Using Alveus from other programs", "level": 2}], "source": "docs/usage.md"}, {"slug": "tools", "title": "Tools (MCP)", "group": "Use", "html": "<h1 id=\"tools-mcp\">Tools (MCP)<\/h1>\n<p>Alveus gives the model tools through the <strong>Model Context Protocol<\/strong>. Each tool group is a\nseparate MCP server process started over stdio by <code>ToolHub<\/code> when the assistant starts (HTTP/SSE\nservers are also supported). Tools are shown to the model as <code>server__tool<\/code> and executed with a\n120 s timeout; results are returned as text (JSON from the built-in servers).<\/p>\n<p><code>alveus tools<\/code> prints the live list. Destructive tools (marked <strong>!<\/strong> below) require confirmation\nwhen <code>tools.confirm_destructive<\/code> is on. <code>run_command<\/code> is additionally screened by a regex for\ndangerous shell commands (<code>rm<\/code>, <code>kill<\/code>, <code>shutdown<\/code>, <code>dd<\/code>, <code>mkfs<\/code>, <code>git push --force<\/code>, …).\nAny <code>run_command<\/code> that uses <code>sudo<\/code> always asks (regardless of <code>confirm_destructive<\/code>): the GUI card\ntakes the password for an \"allow once\", passes it to the tool as <code>sudo_password<\/code>, and the tool\nrewrites the first <code>sudo<\/code> to <code>sudo -S -p ''<\/code> fed from stdin. The model cannot supply that argument\nitself (it is stripped before the confirmation) and the password never enters the conversation\nhistory or logs.<\/p>\n<h2 id=\"files-mcp_serversfiles_shellpy\"><code>files<\/code> — <code>mcp_servers/files_shell.py<\/code><\/h2>\n<p>Access is restricted to <code>ALVEUS_FS_ROOTS<\/code> (colon-separated; default <code>~<\/code>). Paths outside raise\n<code>PermissionError<\/code>, which the model sees as an error message.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>list_dir<\/code><\/td>\n<td><code>path=\"~\"<\/code>, <code>show_hidden=false<\/code><\/td>\n<td>folders first, sizes, max 400 entries<\/td>\n<\/tr>\n<tr>\n<td><code>read_file<\/code><\/td>\n<td><code>path<\/code>, <code>start_line=1<\/code>, <code>max_lines=400<\/code><\/td>\n<td>text with line range; 60 kB cap<\/td>\n<\/tr>\n<tr>\n<td><code>write_file<\/code><\/td>\n<td><code>path<\/code>, <code>content<\/code>, <code>append=false<\/code><\/td>\n<td>creates parent folders<\/td>\n<\/tr>\n<tr>\n<td><code>find_files<\/code><\/td>\n<td><code>pattern<\/code>, <code>path=\"~\"<\/code>, <code>max_results=100<\/code><\/td>\n<td>recursive glob (<code>*.pdf<\/code>), skips dot-dirs/node_modules<\/td>\n<\/tr>\n<tr>\n<td><code>search_text<\/code><\/td>\n<td><code>query<\/code>, <code>path=\"~\"<\/code>, <code>file_glob=\"*\"<\/code>, <code>max_results=50<\/code>, <code>regex=false<\/code><\/td>\n<td>grep-like, case-insensitive, skips files &gt; 5 MB<\/td>\n<\/tr>\n<tr>\n<td><code>move_path<\/code><\/td>\n<td><code>src<\/code>, <code>dst<\/code>, <code>overwrite=false<\/code><\/td>\n<td>rename/move; refuses to replace an existing file unless <code>overwrite<\/code>, which asks first<\/td>\n<\/tr>\n<tr>\n<td><code>delete_path<\/code> <strong>!<\/strong><\/td>\n<td><code>path<\/code><\/td>\n<td>unlink file or remove empty dir<\/td>\n<\/tr>\n<tr>\n<td><code>run_command<\/code><\/td>\n<td><code>command<\/code>, <code>cwd=\"~\"<\/code>, <code>timeout_s=60<\/code><\/td>\n<td>bash, stdout/stderr/exit code; dangerous commands confirmed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"desktop-mcp_serversdesktoppy\"><code>desktop<\/code> — <code>mcp_servers/desktop.py<\/code><\/h2>\n<p>Uses stock GNOME/freedesktop tooling (<code>gio<\/code>, <code>gdbus<\/code>, <code>notify-send<\/code>, <code>wpctl<\/code>, <code>xdg-open<\/code>,\n<code>gsettings<\/code>, <code>loginctl<\/code>). Window and input tools need <code>wmctrl<\/code>/<code>xdotool<\/code> (X11) and report what is\nmissing otherwise; <code>playerctl<\/code> improves media control but D-Bus MPRIS is used as fallback.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>list_apps<\/code><\/td>\n<td><code>filter=\"\"<\/code><\/td>\n<td>installed <code>.desktop<\/code> apps (system, user, snap, flatpak)<\/td>\n<\/tr>\n<tr>\n<td><code>launch_app<\/code><\/td>\n<td><code>app<\/code>, <code>args=\"\"<\/code><\/td>\n<td>match by desktop id or name, <code>gio launch<\/code>; falls back to a binary on PATH<\/td>\n<\/tr>\n<tr>\n<td><code>open_target<\/code><\/td>\n<td><code>target<\/code><\/td>\n<td><code>xdg-open<\/code> a URL, file or folder<\/td>\n<\/tr>\n<tr>\n<td><code>notify<\/code><\/td>\n<td><code>title<\/code>, <code>body=\"\"<\/code>, <code>urgency=\"normal\"<\/code><\/td>\n<td>desktop notification<\/td>\n<\/tr>\n<tr>\n<td><code>clipboard_get<\/code> / <code>clipboard_set<\/code><\/td>\n<td>— / <code>text<\/code><\/td>\n<td>via <code>wl-paste<\/code>/<code>xclip<\/code>/<code>xsel<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>volume_get<\/code><\/td>\n<td><\/td>\n<td><code>{volume 0-100, muted}<\/code> from <code>wpctl<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>volume_set<\/code><\/td>\n<td><code>level<\/code>, <code>delta<\/code>, <code>mute<\/code> (all optional)<\/td>\n<td>absolute, relative (±%), or mute toggle; capped at 100 %<\/td>\n<\/tr>\n<tr>\n<td><code>media_control<\/code><\/td>\n<td><code>action<\/code> = play/pause/play_pause/next/previous/stop/status<\/td>\n<td>MPRIS via playerctl or gdbus<\/td>\n<\/tr>\n<tr>\n<td><code>list_windows<\/code><\/td>\n<td><\/td>\n<td><code>wmctrl -l<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>focus_window<\/code><\/td>\n<td><code>title_substring<\/code><\/td>\n<td>raise window<\/td>\n<\/tr>\n<tr>\n<td><code>close_window<\/code><\/td>\n<td><code>title_substring<\/code><\/td>\n<td>graceful close (apps with unsaved work ask themselves); no confirmation<\/td>\n<\/tr>\n<tr>\n<td><code>type_text<\/code><\/td>\n<td><code>text<\/code><\/td>\n<td><code>xdotool type<\/code> (X11 only)<\/td>\n<\/tr>\n<tr>\n<td><code>press_keys<\/code><\/td>\n<td><code>keys<\/code> (xdotool syntax, e.g. <code>ctrl+s<\/code>)<\/td>\n<td><code>xdotool key<\/code> (X11 only)<\/td>\n<\/tr>\n<tr>\n<td><code>screenshot<\/code><\/td>\n<td><code>path=\"\"<\/code><\/td>\n<td>PNG via gnome-screenshot, GNOME Shell D-Bus, or ImageMagick <code>import<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>set_dark_mode<\/code><\/td>\n<td><code>enabled<\/code><\/td>\n<td>GNOME colour scheme + Yaru theme<\/td>\n<\/tr>\n<tr>\n<td><code>do_not_disturb<\/code><\/td>\n<td><code>enabled<\/code><\/td>\n<td>GNOME <code>show-banners<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>lock_screen<\/code><\/td>\n<td><\/td>\n<td><code>loginctl lock-session<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"system-mcp_serverssystempy\"><code>system<\/code> — <code>mcp_servers/system.py<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>system_status<\/code><\/td>\n<td><\/td>\n<td>host, OS, time, uptime, CPU %, load, CPU temp, RAM, root disk, GPUs, battery<\/td>\n<\/tr>\n<tr>\n<td><code>gpu_status<\/code><\/td>\n<td><\/td>\n<td>per-GPU name, temperature, utilisation, memory, power (NVML)<\/td>\n<\/tr>\n<tr>\n<td><code>top_processes<\/code><\/td>\n<td><code>sort_by=\"cpu\"|\"memory\"<\/code>, <code>limit=10<\/code><\/td>\n<td>heaviest processes<\/td>\n<\/tr>\n<tr>\n<td><code>find_process<\/code><\/td>\n<td><code>name<\/code><\/td>\n<td>match on name or command line<\/td>\n<\/tr>\n<tr>\n<td><code>kill_process<\/code> <strong>!<\/strong><\/td>\n<td><code>pid<\/code>, <code>force=false<\/code><\/td>\n<td>SIGTERM / SIGKILL<\/td>\n<\/tr>\n<tr>\n<td><code>list_services<\/code><\/td>\n<td><code>scope=\"user\"|\"system\"<\/code>, <code>state=\"running\"|\"failed\"|\"all\"<\/code><\/td>\n<td>systemd units<\/td>\n<\/tr>\n<tr>\n<td><code>control_service<\/code><\/td>\n<td><code>name<\/code>, <code>action<\/code> (start/stop/restart/enable/disable/status), <code>scope=\"user\"<\/code><\/td>\n<td>systemctl; asks first only for stop/disable or system scope (which may also prompt polkit)<\/td>\n<\/tr>\n<tr>\n<td><code>network_info<\/code><\/td>\n<td><\/td>\n<td>IPv4 per interface, internet reachability (ping 1.1.1.1)<\/td>\n<\/tr>\n<tr>\n<td><code>power<\/code> <strong>!<\/strong><\/td>\n<td><code>action<\/code> = suspend/hibernate/reboot/poweroff/lock<\/td>\n<td>systemctl / loginctl<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"web-mcp_serverswebpy\"><code>web<\/code> — <code>mcp_servers/web.py<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>web_search<\/code><\/td>\n<td><code>query<\/code>, <code>max_results=6<\/code>, <code>kind=\"text\"|\"news\"<\/code><\/td>\n<td>DuckDuckGo via <code>ddgs<\/code> (title, url, snippet)<\/td>\n<\/tr>\n<tr>\n<td><code>fetch_page<\/code><\/td>\n<td><code>url<\/code>, <code>max_chars=6000<\/code><\/td>\n<td>HTTP GET + <code>trafilatura<\/code> readable-text extraction (HTML-strip fallback); JSON passthrough<\/td>\n<\/tr>\n<tr>\n<td><code>weather<\/code><\/td>\n<td><code>location=\"\"<\/code><\/td>\n<td>wttr.in current conditions + 3-day forecast; empty = geo-IP<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>These are the only tools that contact the internet.<\/p>\n<h2 id=\"coder-mcp_serverscoderpy\"><code>coder<\/code> — <code>mcp_servers/coder.py<\/code><\/h2>\n<p>Delegates programming work to <strong>opencode<\/strong> (<code>opencode run --format json<\/code>, headless; the desktop app\nis not involved, but it shares opencode's config and credentials). Which model opencode uses is set by\n<code>tools.servers.coder.env.ALVEUS_OPENCODE_MODEL<\/code> (GUI: Tools &amp; safety → Coding model):\n<code>auto<\/code> (default) requests the same model the assistant is running, so it follows <code>llm.profile<\/code>: for a\nlocal profile via the <code>bonsai<\/code> provider in <code>~/.config/opencode/opencode.jsonc<\/code> (a new local model's id,\ne.g. <code>qwen3.8-27b<\/code>, must be listed under that provider too), for a cloud profile as\n<code>&lt;opencode provider&gt;/&lt;model&gt;<\/code> (e.g. <code>anthropic/claude-opus-5-5<\/code>; opencode must be signed in to that\nprovider with <code>opencode auth login<\/code>, or the profile sets <code>opencode_model<\/code>); <code>opencode-default<\/code> leaves\nthe choice to opencode; any <code>provider/model<\/code> id from <code>opencode models<\/code> (e.g. <code>deepseek/deepseek-v4-flash<\/code>)\nsends the work to that model instead. The files/shell tools refuse the folder holding the API keys (<code>~/.config/alveus/<\/code>: reading,\nlisting, searching into it, and shell commands naming it); a casual-leak guard, not a sandbox.\nThe coder is the only tool server that sees API-key variables\nfrom the environment (<code>inherit_api_keys: true<\/code>), since opencode may use them to sign in. <code>ALVEUS_CODE_DIR<\/code> is the coding folder: the tools' descriptions quote it so the model knows it, and\n<code>directory<\/code> is resolved against it: empty, <code>~<\/code>, <code>.<\/code> or <code>default<\/code> mean the folder itself; a bare name\n(<code>repo<\/code>, <code>repo/foo<\/code>) is looked up inside it (then under <code>~<\/code>); absolute and <code>~/…<\/code> paths are used as given.\nAn unknown name returns an error listing the folder's subdirectories so the model can pick one.<\/p>\n<p>Note on the local server: llama-server loads one model and answers to whatever model id a client\nsends, so a client that asks for <code>bonsai-27b-1bit<\/code> while the ternary profile is running silently gets\nthe ternary model under the wrong label. <code>auto<\/code> avoids this for the coder by always requesting the\nrunning profile's id.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>code_task<\/code><\/td>\n<td><code>task<\/code>, <code>directory=\"\"<\/code>, <code>continue_last=false<\/code>, <code>timeout_s=900<\/code><\/td>\n<td>full agentic coding run in that directory (reads, edits, runs); returns opencode's final message, tools used, session id. <code>continue_last<\/code> resumes the previous session in the same directory<\/td>\n<\/tr>\n<tr>\n<td><code>code_question<\/code><\/td>\n<td><code>question<\/code>, <code>directory=\"\"<\/code>, <code>timeout_s=300<\/code><\/td>\n<td>read-only analysis with opencode's <code>plan<\/code> agent<\/td>\n<\/tr>\n<tr>\n<td><code>git_status<\/code><\/td>\n<td><code>directory=\"\"<\/code><\/td>\n<td><code>git status --short --branch<\/code> + last 5 commits<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"adding-third-party-mcp-servers\">Adding third-party MCP servers<\/h2>\n<p>Anything that speaks MCP works. In <code>config/local.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">tools:\n  servers:\n    home-assistant:                     # remote SSE server\n      url: http://homeassistant.local:8123/mcp_server/sse\n      headers: { Authorization: &quot;Bearer ${HASS_TOKEN}&quot; }\n    github:                             # stdio server from npm\n      command: [npx, -y, &quot;@modelcontextprotocol/server-github&quot;]\n      env: { GITHUB_PERSONAL_ACCESS_TOKEN: &quot;${GITHUB_TOKEN}&quot; }\n    obsidian:\n      command: [uvx, mcp-obsidian]\n      env: { OBSIDIAN_API_KEY: &quot;${OBSIDIAN_KEY}&quot; }\n      enabled: false\n<\/code><\/pre>\n<p><code>${VAR}<\/code> values are taken from the environment of the <code>alveus<\/code> process (add\n<code>Environment=<\/code> lines to the systemd unit or export before <code>alveus talk<\/code>). Restart the assistant\nand run <code>alveus tools<\/code> to confirm the new tools appear. Keep the total tool count reasonable\n(the schemas are sent with every request; ~40–60 tools is fine for a 32k context).<\/p>\n<h2 id=\"writing-your-own-server\">Writing your own server<\/h2>\n<p>Copy any file in <code>mcp_servers/<\/code>, e.g.:<\/p>\n<pre><code class=\"language-python\">from .common import FastMCP, annot, j, run\n\nmcp = FastMCP(&quot;lights&quot;)\n\n@mcp.tool(annotations=annot(read_only=True))\ndef light_status(room: str) -&gt; str:\n    &quot;&quot;&quot;Report whether the lights in a room are on.&quot;&quot;&quot;\n    return j({&quot;room&quot;: room, &quot;on&quot;: True})\n\n@mcp.tool(annotations=annot(destructive=True))\ndef all_off() -&gt; str:\n    &quot;&quot;&quot;Turn every light off. (Confirmed with the user.)&quot;&quot;&quot;\n    return j(run([&quot;my-lights&quot;, &quot;off&quot;]))\n\nif __name__ == &quot;__main__&quot;:\n    mcp.run()\n<\/code><\/pre>\n<p>Register it: <code>tools.servers.lights.command: [python, -m, mcp_servers.lights]<\/code>.\nGuidelines: keep docstrings short and concrete (the model reads them), return JSON text, mark\nirreversible tools destructive, never block for long without a timeout, and prefer\nparameters with defaults so the model can call tools with few arguments. <code>common.py<\/code>\nwraps <code>MCPServer<\/code>/<code>FastMCP<\/code> and <code>ToolAnnotations<\/code> so the same code runs on mcp 1.x and 2.x.<\/p>", "headings": [{"id": "files-mcp_serversfiles_shellpy", "text": "files — mcp_servers/files_shell.py", "level": 2}, {"id": "desktop-mcp_serversdesktoppy", "text": "desktop — mcp_servers/desktop.py", "level": 2}, {"id": "system-mcp_serverssystempy", "text": "system — mcp_servers/system.py", "level": 2}, {"id": "web-mcp_serverswebpy", "text": "web — mcp_servers/web.py", "level": 2}, {"id": "coder-mcp_serverscoderpy", "text": "coder — mcp_servers/coder.py", "level": 2}, {"id": "adding-third-party-mcp-servers", "text": "Adding third-party MCP servers", "level": 2}, {"id": "writing-your-own-server", "text": "Writing your own server", "level": 2}], "source": "docs/tools.md"}, {"slug": "backends", "title": "Backends", "group": "Use", "html": "<h1 id=\"backends-llm-stt-tts-audio\">Backends: LLM, STT, TTS, audio<\/h1>\n<p>Every stage of the pipeline is a backend chosen in configuration. This page lists what exists,\nhow each performed on the reference machine (RTX 4090), how to switch, and how to add more.<\/p>\n<h2 id=\"llm\">LLM<\/h2>\n<h3 id=\"interface\">Interface<\/h3>\n<p><code>alveus/llm/base.py<\/code>: <code>LLMBackend.stream(messages, tools, thinking) -&gt; AsyncIterator[LLMEvent]<\/code>\nwith events <code>reasoning<\/code>, <code>content<\/code>, <code>tool_call<\/code>, <code>done<\/code>, plus <code>health()<\/code>.<\/p>\n<p>The agent keeps one provider-neutral conversation (OpenAI-style <code>system<\/code>/<code>user<\/code>/<code>assistant<\/code>/<code>tool<\/code>\nmessages) and every adapter translates it to its own wire format, so a conversation can move\nbetween providers. <code>done<\/code> carries a normalized <code>finish_reason<\/code> (<code>stop<\/code>, <code>tool_calls<\/code>, <code>length<\/code>,\n<code>refusal<\/code>), usage (<code>prompt_tokens<\/code>, <code>completion_tokens<\/code>, <code>cached_tokens<\/code>) and optional <code>replay<\/code>\ndata: the provider's own record of that message (Claude's signed thinking blocks, OpenAI's\nencrypted reasoning items). The agent stores it as <code>_replay<\/code> on the assistant message and only\nthe adapter of the same provider sends it back, verbatim; everyone else rebuilds the message from\nits text and tool calls. Failures raise <code>LLMError<\/code>, whose short message is spoken as is\n(\"DeepSeek rejected the API key\").<\/p>\n<h3 id=\"profiles-providers-protocols\">Profiles, providers, protocols<\/h3>\n<p>A profile (<code>llm.profiles.&lt;name&gt;<\/code>) is a <strong>provider<\/strong> plus a <strong>model<\/strong>. The provider preset in\n<code>alveus/llm/providers.py<\/code> supplies the protocol, address, API-key variable and quirks; the profile\ncan override any of it. Resolution: preset &lt; llm-level defaults (<code>temperature<\/code>, <code>top_p<\/code>,\n<code>max_tokens<\/code>, <code>effort<\/code>, <code>max_tool_rounds<\/code>) &lt; the profile. Parameters a provider rejects (its\n<code>unsupported<\/code> list, e.g. <code>temperature<\/code> for Claude and OpenAI) are dropped unless the profile itself\nsets them. A provider name that is not a preset works when the profile gives <code>api<\/code> and <code>base_url<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>provider<\/th>\n<th>protocol (<code>api<\/code>)<\/th>\n<th>address<\/th>\n<th>key variable<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>llama_server<\/code><\/td>\n<td><code>openai_chat<\/code><\/td>\n<td><code>127.0.0.1:8080/v1<\/code><\/td>\n<td>—<\/td>\n<td>started by <code>alveus-llm<\/code> from the profile's <code>serve:<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>vllm<\/code><\/td>\n<td><code>openai_chat<\/code><\/td>\n<td><code>127.0.0.1:8000/v1<\/code><\/td>\n<td>—<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>ollama<\/code><\/td>\n<td><code>openai_chat<\/code><\/td>\n<td><code>127.0.0.1:11434/v1<\/code><\/td>\n<td>—<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>openai_compat<\/code><\/td>\n<td><code>openai_chat<\/code><\/td>\n<td>your <code>base_url<\/code><\/td>\n<td>your <code>api_key_env<\/code><\/td>\n<td>LM Studio, SGLang, Groq, Together, Mistral, …<\/td>\n<\/tr>\n<tr>\n<td><code>openai<\/code><\/td>\n<td><code>openai_responses<\/code><\/td>\n<td><code>api.openai.com/v1<\/code><\/td>\n<td><code>OPENAI_API_KEY<\/code><\/td>\n<td>current OpenAI models call tools only through the Responses API<\/td>\n<\/tr>\n<tr>\n<td><code>anthropic<\/code><\/td>\n<td><code>anthropic_messages<\/code><\/td>\n<td>SDK default<\/td>\n<td><code>ANTHROPIC_API_KEY<\/code><\/td>\n<td>official <code>anthropic<\/code> SDK<\/td>\n<\/tr>\n<tr>\n<td><code>deepseek<\/code><\/td>\n<td><code>openai_chat<\/code><\/td>\n<td><code>api.deepseek.com<\/code><\/td>\n<td><code>DEEPSEEK_API_KEY<\/code><\/td>\n<td>reasoning sent back (DeepSeek requires it once tools are used)<\/td>\n<\/tr>\n<tr>\n<td><code>openrouter<\/code><\/td>\n<td><code>openai_chat<\/code><\/td>\n<td><code>openrouter.ai/api/v1<\/code><\/td>\n<td><code>OPENROUTER_API_KEY<\/code><\/td>\n<td>many vendors' models behind one key<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"openai_chat-chat-completions-alveusllmopenai_compatpy\"><code>openai_chat<\/code> — Chat Completions (<code>alveus/llm/openai_compat.py<\/code>)<\/h3>\n<p>Speaks <code>/chat/completions<\/code> with <code>stream: true<\/code> over server-sent events using plain <code>httpx<\/code> (no\nvendor SDK), accumulates streamed tool-call fragments by index, repairs truncated JSON arguments,\nand reads <code>reasoning_content<\/code> (llama.cpp, DeepSeek) or <code>reasoning<\/code> (vLLM, OpenRouter). Verified\nwith llama-server. Preset knobs: <code>thinking_param<\/code> (how <code>thinking: true|false<\/code> is sent:\n<code>chat_template_kwargs.enable_thinking<\/code> for Qwen-style templates, <code>thinking: {type}<\/code> for DeepSeek,\nor not at all), <code>reasoning_replay: all<\/code> (send each assistant message's reasoning back as\n<code>reasoning_content<\/code>), <code>max_tokens_field<\/code>. <code>effort<\/code> becomes <code>reasoning_effort<\/code>. Connection\nfailures and 429/5xx are retried twice before any output arrives.<\/p>\n<h3 id=\"openai_responses-openai-responses-alveusllmopenai_responsespy\"><code>openai_responses<\/code> — OpenAI Responses (<code>alveus/llm/openai_responses.py<\/code>)<\/h3>\n<p><code>/responses<\/code> with <code>store: false<\/code>: OpenAI keeps no copy, and every turn sends the whole\nconversation as <code>input<\/code> items (<code>function_call<\/code> / <code>function_call_output<\/code> for tools). Reasoning\nitems come back with <code>encrypted_content<\/code> and are replayed verbatim (same model only), so the\nmodel keeps its reasoning across tool calls. <code>effort<\/code> → <code>reasoning.effort<\/code>, reasoning summaries\n(<code>reasoning_summary: auto<\/code>) are shown in the GUI, <code>max_tokens<\/code> → <code>max_output_tokens<\/code>.<\/p>\n<h3 id=\"anthropic_messages-claude-alveusllmanthropic_messagespy\"><code>anthropic_messages<\/code> — Claude (<code>alveus/llm/anthropic_messages.py<\/code>)<\/h3>\n<p>Uses the official <code>anthropic<\/code> SDK (<code>client.messages.stream<\/code>). System messages become the\ntop-level <code>system<\/code>, tool calls <code>tool_use<\/code> blocks, consecutive tool results one <code>user<\/code> message of\n<code>tool_result<\/code> blocks. Thinking is adaptive (<code>thinking: {type: adaptive, display: summarized}<\/code>) and\nits depth is set with <code>effort<\/code> (<code>output_config.effort<\/code>; Claude Opus 5.5 always thinks and defaults\nto <code>medium<\/code>). Claude's thinking blocks are signed and bound to the conversation that produced\nthem, so each assistant message is replayed exactly as returned; when the agent trims old turns\nit drops that data (it is marked <code>prefix_bound<\/code>) and the message is rebuilt without thinking,\nwhich keeps the request valid. Top-level <code>cache_control<\/code> caches tools, system prompt and history,\nso a long conversation is mostly billed at the cache-read rate. <code>fallbacks: default<\/code> (server-side\nfallback, beta <code>server-side-fallback-2026-07-01<\/code>) lets Anthropic re-run a request its safety\nclassifier declined on another model instead of failing; a model that does not take the\nparameter gets it removed automatically. A refusal ends the turn with \"The model declined to\nanswer that request\". Without a key in Alveus' store, the SDK's own credential lookup\n(<code>ANTHROPIC_API_KEY<\/code>, <code>ant auth login<\/code>) applies.<\/p>\n<h3 id=\"shipped-profiles\">Shipped profiles<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>profile<\/th>\n<th>provider<\/th>\n<th>model<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>bonsai-1bit<\/code> (default)<\/td>\n<td><code>llama_server<\/code><\/td>\n<td><code>Bonsai-27B-Q1_0.gguf<\/code>, 3.8 GB<\/td>\n<td>~90 % of FP16 quality, 27B params, Qwen3.6 base, 262k ctx, native tool calling + thinking. ~60–95 tok/s<\/td>\n<\/tr>\n<tr>\n<td><code>bonsai-ternary<\/code><\/td>\n<td><code>llama_server<\/code><\/td>\n<td><code>Ternary-Bonsai-27B-PQ2_0.gguf<\/code>, 7.2 GB<\/td>\n<td>~95 %; better agentic/tool scores (BFCL, τ²-bench); same server flags<\/td>\n<\/tr>\n<tr>\n<td><code>qwen-local<\/code><\/td>\n<td><code>llama_server<\/code><\/td>\n<td><code>Qwen3.8-27B-Q4_K_M.gguf<\/code> (not downloaded)<\/td>\n<td>template for any standard GGUF; put the file at <code>serve.model_path<\/code> first<\/td>\n<\/tr>\n<tr>\n<td><code>claude<\/code><\/td>\n<td><code>anthropic<\/code><\/td>\n<td><code>claude-opus-5-5<\/code><\/td>\n<td><code>max_tokens: 16000<\/code> (thinking counts against it)<\/td>\n<\/tr>\n<tr>\n<td><code>chatgpt<\/code><\/td>\n<td><code>openai<\/code><\/td>\n<td><code>gpt-6.1-sol<\/code><\/td>\n<td>Responses API, <code>max_tokens: 16000<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>deepseek<\/code><\/td>\n<td><code>deepseek<\/code><\/td>\n<td><code>deepseek-v4-pro<\/code><\/td>\n<td>thinking on by default; <code>deepseek-flash<\/code> is the cheaper model<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The Bonsai files need the <strong>PrismML fork of llama.cpp<\/strong>, specifically its <code>prism<\/code> branch, for the\ncustom kernels (<code>Q1_0<\/code> = type 41 is also on the fork's master, but <code>PQ2_0<\/code> = type 142 only exists\non <code>prism<\/code>; upstream llama.cpp only runs the <code>Q2_g64<\/code> ternary variant). <code>scripts/build_llama.sh<\/code>\nclones/checks out <code>prism<\/code> and builds. A model architecture newer than the fork may need an\nupstream llama.cpp build; give that profile its own <code>serve.command<\/code>. Switching profiles in the GUI\nruns a check first and refuses the switch if the binary cannot read the file (local) or the\nprovider does not accept the key and model (cloud).<\/p>\n<p>Cloud latency and cost were not measured on the reference machine. Requirements for a good voice\nexperience are the same everywhere: tool calling, streaming, and a short time to the first\nsentence; lower <code>effort<\/code> shortens the thinking before the reply.<\/p>\n<h3 id=\"api-keys\">API keys<\/h3>\n<p>Cloud providers read their key from the environment or from <code>~/.config/alveus/secrets.env<\/code>\n(<code>ALVEUS_SECRETS<\/code> overrides the path): a <code>NAME=value<\/code> file outside the repository, mode 600.\nSet keys in the GUI (Settings → Language model → API keys; values are write-only) or with\n<code>alveus llm key ANTHROPIC_API_KEY<\/code>. Keys are read per request, so a new key works without a\nrestart. They are never written to <code>config/*.yaml<\/code>, never exported to <code>os.environ<\/code>, and API-key\nvariables are removed from the environment of the tool servers (the shell tool could print them),\nexcept for servers with <code>inherit_api_keys: true<\/code> (the coder, so opencode can sign in).<\/p>\n<p>With a cloud profile, everything in the conversation is sent to that provider: your transcribed\nwords, the system prompt, and whatever tools return (file contents, command output, web pages).\nSpeech recognition and synthesis stay local.<\/p>\n<h3 id=\"switching\">Switching<\/h3>\n<p>GUI: Settings → Language model: pick the provider, then the model, then save (check, then restart\nof both services). The model list comes from <code>GET /llm/models<\/code>: the GGUF files under\n<code>ALVEUS_MODELS<\/code> for this computer, the provider's live list for cloud APIs (once the key is in),\nsuggestions otherwise. A model without a profile gets one on save, named after the model id\n(<code>deepseek-flash<\/code>; a GGUF file gets <code>provider: llama_server<\/code> and a <code>serve:<\/code> block from\n<code>LOCAL_SERVE_TEMPLATE<\/code> with context length 32768), and its settings (thinking, effort, reply length,\ntemperature, context) are stored in that profile, so every model keeps its own.\nThe choice is stored as <code>llm.profile<\/code> in <code>config/local.yaml<\/code>, so every later start, including after\na reboot, uses the model chosen last. Choosing a cloud profile makes <code>alveus llm serve<\/code> exit at once,\nso <code>alveus-llm<\/code> stops and the GPU is free (ComfyUI, bigger speech models). On top of that the\nassistant checks the unit every time it starts (<code>alveus/llm/service.py<\/code>, <code>llm.manage_local_server<\/code>):\nit stops a local server that a cloud profile does not need, starts one a local profile needs, and\nrestarts it when it serves a different model, so a switch through the YAML editor or a hand edit\nfollowed by <code>systemctl --user restart alveus<\/code> ends in the same state. CLI: <code>alveus llm profiles<\/code> (provider, local/cloud, key\nor weights present), <code>alveus llm test --profile claude<\/code> (one request), <code>alveus chat --profile\ndeepseek<\/code> (text REPL with tools), <code>ALVEUS_LLM_PROFILE=chatgpt alveus talk<\/code>.<\/p>\n<h3 id=\"adding-a-profile-provider-or-protocol\">Adding a profile, provider or protocol<\/h3>\n<ul>\n<li><strong>Another model on a known provider:<\/strong> a new profile with <code>provider<\/code> and <code>model<\/code>.<\/li>\n<li><strong>Another OpenAI-compatible service:<\/strong> <code>provider: openai_compat<\/code>, <code>base_url<\/code>, <code>model<\/code>,\n  <code>api_key_env<\/code> (its key then appears in the GUI's key list); or add a preset to <code>PROVIDERS<\/code>.<\/li>\n<li><strong>Another protocol:<\/strong> one file under <code>alveus/llm/<\/code> implementing <code>stream()<\/code> / <code>health()<\/code> and the\n  conversion from the neutral messages, registered in <code>make_llm()<\/code> (<code>alveus/llm/__init__.py<\/code>) and\n  <code>APIS<\/code> (<code>providers.py<\/code>). The three existing adapters are 190–270 lines each.<\/li>\n<\/ul>\n<h2 id=\"speech-to-text\">Speech-to-text<\/h2>\n<h3 id=\"interface_1\">Interface<\/h3>\n<p><code>alveus/stt/base.py<\/code>: <code>load()<\/code> and <code>transcribe(float32_audio, sample_rate) -&gt; str<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>backend<\/th>\n<th>engine<\/th>\n<th>VRAM<\/th>\n<th>latency (4090)<\/th>\n<th>strengths<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>faster_whisper<\/code> (default)<\/td>\n<td>CTranslate2 Whisper <code>large-v3-turbo<\/code>, fp16<\/td>\n<td>~1.5 GB<\/td>\n<td>0.06–0.2 s per utterance<\/td>\n<td>robust, multilingual, punctuation<\/td>\n<td>imports torch first so ctranslate2 finds cuDNN 9<\/td>\n<\/tr>\n<tr>\n<td><code>parakeet<\/code><\/td>\n<td>NVIDIA Parakeet TDT 0.6B v3 via onnx-asr<\/td>\n<td>~1 GB (CPU works too)<\/td>\n<td>~0.3 s<\/td>\n<td>very fast, 25 European languages<\/td>\n<td>first load downloads ~2.5 GB; names slightly less accurate (\"Oria\")<\/td>\n<\/tr>\n<tr>\n<td><code>openai_http<\/code><\/td>\n<td>any <code>/v1/audio/transcriptions<\/code> server<\/td>\n<td>—<\/td>\n<td>network<\/td>\n<td>reuse whisper.cpp server, speaches, etc.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Switch: <code>stt.backend: parakeet<\/code> or <code>ALVEUS_STT_BACKEND=parakeet<\/code>. Test: <code>alveus stt test<\/code>.<\/p>\n<p>Both local engines run on whole utterances (not streaming); with the VAD-based segmenting the\ntranscript is ready ~0.1–0.3 s after you stop speaking, which is what gates the response time.<\/p>\n<h2 id=\"text-to-speech\">Text-to-speech<\/h2>\n<h3 id=\"interface_2\">Interface<\/h3>\n<p><code>alveus/tts/base.py<\/code>: <code>load()<\/code>, <code>synthesize(text) -&gt; float32 audio<\/code>, <code>sample_rate<\/code>, <code>voices()<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>backend<\/th>\n<th>engine<\/th>\n<th>VRAM<\/th>\n<th>speed (4090)<\/th>\n<th>strengths<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>kokoro<\/code> (default)<\/td>\n<td>Kokoro-82M (PyTorch)<\/td>\n<td>~0.6 GB<\/td>\n<td>~10× faster than real time after warm-up<\/td>\n<td>crisp, 28 voices, tiny<\/td>\n<td>no cloning; sample rate 24 kHz<\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox<\/code><\/td>\n<td>Resemble Chatterbox: <code>turbo<\/code> (English), <code>standard<\/code> (English), <code>multilingual<\/code> (23 languages)<\/td>\n<td>3–4 GB<\/td>\n<td>~0.2× real time (4 s of speech in 0.85 s)<\/td>\n<td>most natural, zero-shot voice cloning from a WAV; multilingual speaks zh, ja, ko, de, fr, es, it, pt, ru, ar, hi…<\/td>\n<td>multilingual picks the language per sentence (<code>tts.chatterbox.language: auto<\/code>): script detection for CJK/Cyrillic/Arabic/…, <code>langdetect<\/code> for Latin text, <code>fallback_language<\/code> otherwise<\/td>\n<\/tr>\n<tr>\n<td><code>qwen3<\/code><\/td>\n<td>Qwen3-TTS 12Hz Base (Alibaba Qwen, Apache-2.0): <code>1_7b<\/code> (1.7B), <code>0_6b<\/code> (0.6B)<\/td>\n<td>3.9 GB (1.7B)<\/td>\n<td>~0.55× real time without flash-attn (3.5 s of speech in 1.9 s; ~2 s per sentence)<\/td>\n<td>voice cloning in 10 languages (zh, en, ja, ko, de, fr, ru, pt, es, it); copies a recording closely in its own language and keeps the voice across languages<\/td>\n<td>no built-in voice (copies a recording; with none chosen, the folder's first). Runs in a worker process with its own environment (see below); 24 kHz<\/td>\n<\/tr>\n<tr>\n<td><code>openai_http<\/code><\/td>\n<td>any <code>/v1/audio/speech<\/code> server<\/td>\n<td>—<\/td>\n<td>network<\/td>\n<td>Kokoro-FastAPI, openedai-speech, …<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Switch: <code>tts.backend: chatterbox<\/code> (+ <code>chatterbox.voice_ref: ~/voices/me.wav<\/code> for cloning; <code>chatterbox.model:\nmultilingual<\/code> to speak other languages). For a bilingual conversation also clear\n<code>stt.faster_whisper.language<\/code> so Whisper auto-detects what you say; the LLM answers in the language\nyou used, and the streaming splitter understands Chinese/Japanese sentence punctuation (。！？).\nTest: <code>alveus tts say \"Hello there\"<\/code>. The chosen voice's gender decides the spoken name\n(<code>tts.voice_gender<\/code>, auto from Kokoro voice prefixes).<\/p>\n<p>Streaming: text is split into sentences (<code>SentenceBuffer<\/code>, min 24 chars, abbreviation- and\ndecimal-aware) and each sentence is synthesized while the model continues generating, so\ntime-to-first-word ≈ LLM thinking time + first sentence generation + ~0.2 s synthesis.<\/p>\n<h3 id=\"qwen3-tts-alveusttsqwen3_ttspy-qwen3_workerpy\">Qwen3-TTS (<code>alveus/tts/qwen3_tts.py<\/code>, <code>qwen3_worker.py<\/code>)<\/h3>\n<ul>\n<li><strong>Own environment, own process.<\/strong> <code>qwen-tts<\/code> 0.1.1 pins <code>transformers==4.57.3<\/code> and imports names\n  that transformers 5 removed (<code>check_model_inputs<\/code>), while Alveus runs on 5.x (Chatterbox and the\n  rest). <code>scripts/install_qwen3_tts.sh<\/code> makes <code>.venv-qwen3tts/<\/code>, a venv on top of the Alveus Python\n  (<code>--system-site-packages<\/code>: torch, numpy, librosa are shared) with only qwen-tts, transformers\n  4.57.3, accelerate 1.12 and huggingface_hub &lt; 1 added (139 MB). The engine starts\n  <code>qwen3_worker.py<\/code> with that Python (<code>tts.qwen3.python<\/code>) and talks to it over a pipe: one JSON line\n  per sentence, raw float32 samples back. Library output goes to stderr (kept for error messages).\n  The worker ends when its stdin closes, i.e. when Alveus exits or swaps the engine (<code>close()<\/code>\n  frees its 3.9 GB), and a crashed worker is restarted for the next sentence.<\/li>\n<li><strong>Weights.<\/strong> <code>tts.qwen3.weights_dir<\/code> holds one folder per model (<code>Qwen3-TTS-12Hz-1.7B-Base<\/code>, 4.5 GB\n  with its speech tokenizer); a missing one is downloaded there first. Unset: the Hugging Face cache.<\/li>\n<li><strong>Copying a voice.<\/strong> The Base models have no voice of their own. With the recording's words in\n  <code>NAME.txt<\/code> beside it (<code>GET /voices<\/code> lists which have them; <em>Write it down<\/em> in the GUI, <code>POST\n  /voices/transcribe<\/code>, makes one with the running speech recognizer), a sentence in the recording's\n  language is voiced by continuing the recording (in-context mode); a sentence in another language,\n  or a recording without words, uses the speaker embedding only (x-vector mode). Measured on the eight\n  curated voices with a speaker-embedding model (Chatterbox's voice encoder, cosine to the recording):\n  same language in-context 0.88–0.94; English from a Japanese/Chinese recording in-context 0.80–0.86\n  (worst take 0.70), x-vector 0.87–0.92 (worst 0.85), hence the rule. Whisper understood every test\n  sentence (character error 0–0.08).<\/li>\n<li><strong>Language<\/strong> per sentence like Chatterbox Multilingual (<code>language: auto<\/code>, script detection plus\n  <code>langdetect<\/code>, <code>fallback_language<\/code>), mapped to Qwen's names (<code>japanese<\/code>, …). Generation is capped at\n  about twice the slowest plausible reading of the sentence (<code>token_budget<\/code>), so a sentence the model\n  fails to end cannot run on; <code>temperature<\/code> (0.9) is the \"Variation\" setting.<\/li>\n<li>Not used: the CustomVoice (nine preset speakers with style instructions) and VoiceDesign (voice from a\n  description) variants, and streaming generation (the open-source package only simulates it).\n  flash-attn is not installed (sdpa attention); it would speed generation up.<\/li>\n<\/ul>\n<h3 id=\"per-model-settings-and-previews\">Per-model settings and previews<\/h3>\n<p>Each engine reads its options through <code>config.engine_opts()<\/code>: the engine block, overlaid with the\nselected model's own block (<code>tts.chatterbox.models.&lt;model&gt;<\/code>), with <code>tts.voices_dir<\/code> and\n<code>tts.voice_gender<\/code> as fallbacks. So Chatterbox Turbo and Multilingual can copy different voices, and\nthe gender (and with it the assistant's name) follows whichever model is active. Kokoro's accent\nfollows the chosen voice (<code>bf_…<\/code> → British) unless <code>lang_code<\/code> is set. In the GUI, ▶ next to a Kokoro\nvoice speaks a sample sentence through the running engine (<code>POST /tts/preview<\/code>; another accent\nreuses the loaded model), and ▶ next to a Chatterbox or Qwen3-TTS voice plays the recording itself.<\/p>\n<h2 id=\"voice-activity-wake-word\">Voice activity &amp; wake word<\/h2>\n<ul>\n<li><strong>Silero VAD<\/strong> (<code>silero-vad<\/code> PyTorch package) on 32 ms frames, CPU. Threshold <code>audio.vad.threshold<\/code>.<\/li>\n<li><strong>openWakeWord 0.6<\/strong> on ONNX runtime (the <code>tflite-runtime<\/code> dependency is dropped because it has\n  no Python 3.12 wheels). Feeds 80 ms int16 chunks; pretrained and custom models supported.<\/li>\n<li><strong>Name detection<\/strong> – no model; uses the STT transcript. See <a href=\"#wake-words\">wake-words.md<\/a>.<\/li>\n<\/ul>\n<h2 id=\"audio-io\">Audio I/O<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>backend<\/th>\n<th>how<\/th>\n<th>when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pipewire<\/code> (auto-selected when available)<\/td>\n<td><code>pw-record<\/code>/<code>pw-play<\/code> subprocesses, s16 in / f32 out, 32–64 ms latency<\/td>\n<td>any PipeWire desktop (Ubuntu ≥ 22.10, Fedora, Arch…)<\/td>\n<\/tr>\n<tr>\n<td><code>sounddevice<\/code><\/td>\n<td>PortAudio streams<\/td>\n<td>macOS, PulseAudio-only or headless ALSA setups; needs a PortAudio that can open the device<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Select devices with <code>audio.input_device<\/code> / <code>output_device<\/code> (PipeWire node name or serial from\n<code>wpctl status<\/code>; sounddevice index or name substring). Playback is a queue in a background thread,\ninterruptible via <code>AudioOut.stop()<\/code> (hotkey barge-in, <code>/stop<\/code>).<\/p>\n<h2 id=\"optional-server-side-variants\">Optional server-side variants<\/h2>\n<p>Instead of in-process STT/TTS you can run them as separate services and point the <code>openai_http<\/code>\nbackends at them — useful if you want the speech models shared with other apps, or on another\nmachine:<\/p>\n<ul>\n<li>STT: <code>speaches<\/code> (faster-whisper server), whisper.cpp <code>server<\/code>, Parakeet FastAPI wrappers.<\/li>\n<li>TTS: <code>Kokoro-FastAPI<\/code> (port 8880), <code>Chatterbox-TTS-Server<\/code>, <code>openedai-speech<\/code>.<\/li>\n<\/ul>", "headings": [{"id": "llm", "text": "LLM", "level": 2}, {"id": "interface", "text": "Interface", "level": 3}, {"id": "profiles-providers-protocols", "text": "Profiles, providers, protocols", "level": 3}, {"id": "openai_chat-chat-completions-alveusllmopenai_compatpy", "text": "openai_chat — Chat Completions (alveus/llm/openai_compat.py)", "level": 3}, {"id": "openai_responses-openai-responses-alveusllmopenai_responsespy", "text": "openai_responses — OpenAI Responses (alveus/llm/openai_responses.py)", "level": 3}, {"id": "anthropic_messages-claude-alveusllmanthropic_messagespy", "text": "anthropic_messages — Claude (alveus/llm/anthropic_messages.py)", "level": 3}, {"id": "shipped-profiles", "text": "Shipped profiles", "level": 3}, {"id": "api-keys", "text": "API keys", "level": 3}, {"id": "switching", "text": "Switching", "level": 3}, {"id": "adding-a-profile-provider-or-protocol", "text": "Adding a profile, provider or protocol", "level": 3}, {"id": "speech-to-text", "text": "Speech-to-text", "level": 2}, {"id": "interface_1", "text": "Interface", "level": 3}, {"id": "text-to-speech", "text": "Text-to-speech", "level": 2}, {"id": "interface_2", "text": "Interface", "level": 3}, {"id": "qwen3-tts-alveusttsqwen3_ttspy-qwen3_workerpy", "text": "Qwen3-TTS (alveus/tts/qwen3_tts.py, qwen3_worker.py)", "level": 3}, {"id": "per-model-settings-and-previews", "text": "Per-model settings and previews", "level": 3}, {"id": "voice-activity-wake-word", "text": "Voice activity &amp; wake word", "level": 2}, {"id": "audio-io", "text": "Audio I/O", "level": 2}, {"id": "optional-server-side-variants", "text": "Optional server-side variants", "level": 2}], "source": "docs/backends.md"}, {"slug": "api", "title": "GUI & HTTP API", "group": "Use", "html": "<h1 id=\"http-api-and-browser-gui\">HTTP API and browser GUI<\/h1>\n<p>Served by <code>alveus talk<\/code> (default) and <code>alveus api<\/code> on <code>http://127.0.0.1:8765<\/code>\n(<code>api.host<\/code> / <code>api.port<\/code>). The <strong>browser GUI<\/strong> lives at <code>/<\/code> (see <a href=\"#usage/browser-gui\">usage.md<\/a>);\ninteractive OpenAPI docs at <code>/docs<\/code>. No authentication: it binds to localhost only. To use it from\nanother device, tunnel instead of exposing the port: <code>ssh -L 8765:127.0.0.1:8765 &lt;host&gt;<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>method &amp; path<\/th>\n<th>body<\/th>\n<th>response<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>GET /health<\/code><\/td>\n<td><\/td>\n<td><code>{ok, llm, state, tools, stt, tts, profile, llm_provider, llm_model, llm_remote, llm_service, …}<\/code><\/td>\n<td><code>ok<\/code> = LLM endpoint reachable (local: serving the configured model; cloud: key and model accepted, checked at most once a minute, and a successful reply counts); <code>state<\/code> is idle/listening/thinking/speaking in talk mode; <code>llm_service<\/code> (alveus-llm unit status) only for profiles with a local server<\/td>\n<\/tr>\n<tr>\n<td><code>GET /tools<\/code><\/td>\n<td><\/td>\n<td><code>[{name, description, destructive}]<\/code><\/td>\n<td>namespaced tool names as the model sees them<\/td>\n<\/tr>\n<tr>\n<td><code>POST /chat<\/code><\/td>\n<td><code>{\"text\": str, \"speak\": bool=false, \"reset\": bool=false}<\/code><\/td>\n<td><code>{\"reply\": str}<\/code><\/td>\n<td>runs the agent with tools on the shared conversation history. <code>speak: true<\/code> (talk mode) also voices the reply through the speaker with sentence streaming. <code>reset<\/code> clears history first. Destructive tool calls are refused (no confirmer) unless <code>speak: true<\/code>, where confirmation is spoken<\/td>\n<\/tr>\n<tr>\n<td><code>POST /speak<\/code><\/td>\n<td><code>{\"text\": str, \"play\": bool=false}<\/code><\/td>\n<td>WAV bytes (<code>audio/wav<\/code>), or <code>{\"played\": true, \"seconds\": n}<\/code> when <code>play<\/code><\/td>\n<td>synthesize with the active TTS backend<\/td>\n<\/tr>\n<tr>\n<td><code>POST /transcribe<\/code><\/td>\n<td>multipart <code>file=@audio.wav<\/code><\/td>\n<td><code>{\"text\": str}<\/code><\/td>\n<td>any sample rate/channels; resampled to 16 kHz mono<\/td>\n<\/tr>\n<tr>\n<td><code>POST /trigger<\/code><\/td>\n<td><\/td>\n<td><code>{\"triggered\": bool}<\/code><\/td>\n<td>start listening now (equivalent to the hotkey); <code>false<\/code> in <code>alveus api<\/code> mode<\/td>\n<\/tr>\n<tr>\n<td><code>POST /stop<\/code><\/td>\n<td><\/td>\n<td><code>{\"stopped\": true}<\/code><\/td>\n<td>stop current speech output and drop the queue<\/td>\n<\/tr>\n<tr>\n<td><code>POST /interrupt<\/code><\/td>\n<td><\/td>\n<td><code>{\"interrupted\": true}<\/code><\/td>\n<td>abort the running turn (voice or GUI): stop generating, skip pending tool calls, cut speech, deny open confirmations; the stream then emits <code>interrupted<\/code> and <code>done<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>GET /<\/code><\/td>\n<td><\/td>\n<td>HTML<\/td>\n<td>the browser GUI (chat + settings)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /chat/stream<\/code><\/td>\n<td><code>{\"text\": str, \"speak\": bool=false, \"reset\": bool=false}<\/code><\/td>\n<td>SSE stream<\/td>\n<td>events: <code>reasoning<\/code>, <code>content<\/code>, <code>tool_start {tool,args}<\/code>, <code>tool_result {tool,text}<\/code>, <code>confirm {id,description,sudo}<\/code>, <code>interrupted<\/code>, <code>error<\/code>, <code>done {reply}<\/code>. Destructive and sudo tools wait for <code>POST /confirm<\/code> (120 s, then denied)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /confirm<\/code><\/td>\n<td><code>{\"id\": str, \"ok\": bool, \"password\"?: str}<\/code><\/td>\n<td><code>{\"resolved\": bool}<\/code><\/td>\n<td>answer a <code>confirm<\/code> event from <code>/chat/stream<\/code> or <code>/events<\/code>; when the event has <code>sudo: true<\/code>, <code>password<\/code> is the sudo password for that one command<\/td>\n<\/tr>\n<tr>\n<td><code>GET /history<\/code><\/td>\n<td><\/td>\n<td><code>[{role, text, tools:[{name,args,result}]}]<\/code><\/td>\n<td>the shared conversation (voice and GUI turns)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /history/reset<\/code><\/td>\n<td><\/td>\n<td><code>{\"reset\": true}<\/code><\/td>\n<td>clear the conversation<\/td>\n<\/tr>\n<tr>\n<td><code>GET /events<\/code><\/td>\n<td><\/td>\n<td>SSE stream<\/td>\n<td>live <code>state<\/code> (idle/listening/thinking/speaking), <code>transcript {who,text,source}<\/code>, <code>reset<\/code>, <code>config_saved<\/code>, <code>restarting<\/code>, <code>ping<\/code>; and the live progress of voice turns (<code>source: voice<\/code>): <code>assistant_start<\/code>, <code>assistant_delta {text}<\/code>, <code>tool_start {tool,args}<\/code>, <code>tool_result {tool,text}<\/code>, <code>voice_confirm {text}<\/code> (question asked aloud), <code>confirm {id,description,sudo}<\/code> (needs <code>POST /confirm<\/code>), then the final <code>transcript<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>GET /config<\/code><\/td>\n<td><\/td>\n<td><code>{effective, local, local_yaml, options, paths, env, managed_by_systemd, running_profile, llm_profile_info, llm_providers, secrets, running}<\/code><\/td>\n<td>merged configuration plus the machine overrides and option lists for the GUI; <code>llm_profile_info<\/code> = per profile its effective values <code>{label, provider, model, remote, local_server, model_path, file_exists, temperature, top_p, max_tokens, effort, thinking, context, top_k, base_url, api_key_env}<\/code>; <code>llm_providers<\/code> = per provider what the settings page offers (<code>group<\/code>, <code>title<\/code>, <code>blurb<\/code>, <code>effort_levels<\/code>, <code>thinking_switch<\/code>, <code>sampling<\/code>, suggested <code>models<\/code>, <code>key_source<\/code>, <code>defaults<\/code> for a new profile, <code>serve_template<\/code> for local files); <code>running<\/code> = the loaded voice engine (for previews); <code>secrets<\/code> as <code>GET /secrets<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>GET /llm/models?provider=P[&amp;base_url=…]<\/code><\/td>\n<td><\/td>\n<td><code>{models: [{id, name?, note?, file?, path?, portable?, size_gb?}], source, error?, dir?}<\/code><\/td>\n<td>the model picker: GGUF files under <code>ALVEUS_MODELS<\/code> for <code>llama_server<\/code> (<code>source: files<\/code>), else the provider's live list (<code>live<\/code>, needs the key; OpenRouter: tool-capable models only) or the suggested models when that fails (<code>suggested<\/code>, with the reason in <code>error<\/code>). Cached 10 min<\/td>\n<\/tr>\n<tr>\n<td><code>GET /audio/devices<\/code><\/td>\n<td><\/td>\n<td><code>{sources: [{name, label}], sinks: [...]}<\/code><\/td>\n<td>PipeWire microphones and speakers (<code>pw-dump<\/code>); <code>name<\/code> is what <code>audio.input_device<\/code> / <code>output_device<\/code> take<\/td>\n<\/tr>\n<tr>\n<td><code>POST /tts/preview<\/code><\/td>\n<td><code>{\"voice\": str, \"text\"?: str, \"play\"?: bool=true}<\/code><\/td>\n<td><code>{played, seconds}<\/code> or WAV<\/td>\n<td>speak a sample sentence with another Kokoro voice of the running engine (any accent; the model is shared), on the assistant's speaker, or as WAV with <code>play: false<\/code> or without a speaker; 409 when Kokoro is not the running engine<\/td>\n<\/tr>\n<tr>\n<td><code>GET /voices[?dir=D]<\/code><\/td>\n<td><\/td>\n<td><code>{dir, exists, files, texts}<\/code><\/td>\n<td>recordings in the voices folder (<code>.wav<\/code>, <code>.flac<\/code>, <code>.mp3<\/code>) and which of them have their words in <code>NAME.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>POST /voices/play<\/code><\/td>\n<td><code>{\"name\": str, \"dir\"?: str}<\/code><\/td>\n<td><code>{played, seconds}<\/code><\/td>\n<td>play one recording from the voices folder on the assistant's speaker<\/td>\n<\/tr>\n<tr>\n<td><code>POST /voices/transcribe<\/code><\/td>\n<td><code>{\"name\": str, \"dir\"?: str}<\/code><\/td>\n<td><code>{name, text}<\/code><\/td>\n<td>write down what a recording says with the running speech recognizer and save it as <code>NAME.txt<\/code> beside it (Qwen3-TTS copies the voice closely with it); 409 without speech recognition<\/td>\n<\/tr>\n<tr>\n<td><code>GET /voices/file?name=N[&amp;dir=D]<\/code><\/td>\n<td><\/td>\n<td>the WAV<\/td>\n<td>one recording from the voices folder (only names that folder lists), for listening in the browser<\/td>\n<\/tr>\n<tr>\n<td><code>GET /secrets<\/code><\/td>\n<td><\/td>\n<td><code>{path, keys: {NAME: {source, profiles, label}}}<\/code><\/td>\n<td>which API-key variables the profiles use and whether each is set (<code>source<\/code>: <code>env<\/code>, <code>file<\/code> or <code>null<\/code>); never the values<\/td>\n<\/tr>\n<tr>\n<td><code>PUT /secrets<\/code><\/td>\n<td><code>{\"name\": str, \"value\": str}<\/code><\/td>\n<td>same as <code>GET /secrets<\/code><\/td>\n<td>store an API key in <code>~/.config/alveus/secrets.env<\/code> (mode 600); empty <code>value<\/code> removes it. Only variables some profile or provider uses are accepted. Effective from the next request, no restart<\/td>\n<\/tr>\n<tr>\n<td><code>POST /llm/check<\/code><\/td>\n<td><code>{\"profile\": str, \"definition\"?: {…}}<\/code><\/td>\n<td><code>{ok, kind, seconds, error?, detail?}<\/code><\/td>\n<td>preflight before switching profiles. Local server profile: llama-server loads the file on the CPU (5–40 s). Cloud/external (<code>kind<\/code>: <code>cloud<\/code>/<code>external<\/code>): key present and accepted, model known; nothing is generated. <code>definition<\/code> checks a profile that is not saved yet (the settings page sends it for a newly picked model)<\/td>\n<\/tr>\n<tr>\n<td><code>PUT /config<\/code><\/td>\n<td><code>{\"patch\": {...}}<\/code> or <code>{\"yaml\": \"...\"}<\/code>, <code>\"apply\"?: bool<\/code><\/td>\n<td><code>{saved, local, local_yaml, applied, restart_required}<\/code><\/td>\n<td>deep-merge into <code>config/local.yaml<\/code> (a <code>null<\/code> leaf stores an explicit null, e.g. auto-detect language; a leaf <code>{\"$unset\": true}<\/code> removes the override so the default applies) or replace the file; validated before writing<\/td>\n<\/tr>\n<tr>\n<td><code>GET /instructions<\/code> / <code>PUT /instructions<\/code><\/td>\n<td>— / <code>{\"text\": str}<\/code><\/td>\n<td><code>{text, path}<\/code> / <code>{saved}<\/code><\/td>\n<td>read/write the instructions (<code>assistant.instructions_file<\/code>); used from the next request<\/td>\n<\/tr>\n<tr>\n<td><code>GET /personalities<\/code><\/td>\n<td><\/td>\n<td><code>{active, default, own_dir, items: [{id, label, description, text, shipped, edited, path, order}]}<\/code><\/td>\n<td>every personality, shipped ones first; <code>edited<\/code> = the owner's copy overrides a shipped one. Choosing one is <code>PUT /config {\"patch\": {\"assistant\": {\"personality\": ID}}, \"apply\": true}<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>PUT /personalities/{id}<\/code><\/td>\n<td><code>{\"label\"?: str, \"description\"?: str, \"text\": str}<\/code><\/td>\n<td><code>{saved, personality}<\/code><\/td>\n<td>create or change one in <code>assistant.personalities_dir<\/code> (a shipped id: an edited copy); id = lowercase letters, digits, <code>-<\/code>, <code>_<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>DELETE /personalities/{id}<\/code><\/td>\n<td><\/td>\n<td><code>{deleted: id}<\/code> or <code>{restored: id}<\/code><\/td>\n<td>delete your own (409 while it is the active one) or restore a shipped one's original words; 404 for an unedited shipped one<\/td>\n<\/tr>\n<tr>\n<td><code>POST /restart<\/code><\/td>\n<td><code>{\"what\": \"assistant\" \\| \"llm\" \\| \"both\"}<\/code><\/td>\n<td><code>{restarting: [...]}<\/code><\/td>\n<td>restarts the systemd user units; 409 when not running under systemd<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Examples:<\/p>\n<pre><code class=\"language-bash\">curl -s localhost:8765/health | jq\ncurl -s localhost:8765/chat -H 'content-type: application/json' \\\n     -d '{&quot;text&quot;: &quot;how much disk space is left?&quot;}'\ncurl -s localhost:8765/speak -H 'content-type: application/json' \\\n     -d '{&quot;text&quot;: &quot;Build finished.&quot;}' -o build.wav\ncurl -s localhost:8765/transcribe -F file=@memo.wav\n<\/code><\/pre>\n<p>Python:<\/p>\n<pre><code class=\"language-python\">import httpx\nr = httpx.post(&quot;http://127.0.0.1:8765/chat&quot;, json={&quot;text&quot;: &quot;what's my GPU temperature?&quot;}, timeout=120)\nprint(r.json()[&quot;reply&quot;])\n<\/code><\/pre>\n<p>Streaming from the shell:<\/p>\n<pre><code class=\"language-bash\">curl -sN localhost:8765/chat/stream -H 'content-type: application/json' -d '{&quot;text&quot;:&quot;what time is it?&quot;}'\n<\/code><\/pre>\n<p>Ideas: bind <code>alveus trigger<\/code> (which posts to <code>/trigger<\/code>) to a GNOME keyboard shortcut on Wayland;\nhave cron or a build script call <code>/speak<\/code> with <code>play: true<\/code> for spoken notifications; feed audio\nfrom a phone or another room's microphone to <code>/transcribe<\/code> + <code>/chat<\/code>.<\/p>", "headings": [], "source": "docs/api.md"}, {"slug": "wake-words", "title": "Wake words", "group": "Use", "html": "<h1 id=\"wake-words\">Wake words<\/h1>\n<p>Alveus can be activated three ways (all configurable under <code>activation:<\/code> in <code>config/alveus.yaml<\/code>):<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>mode<\/th>\n<th>how it works<\/th>\n<th>latency<\/th>\n<th>setup<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>names<\/code> (default)<\/td>\n<td>VAD detects speech, the segment is transcribed, and the transcript is checked for <strong>Alveus<\/strong> / <strong>Aurea<\/strong> (fuzzy: \"Alvius\", \"Aria\", \"Oria\"...). The rest of the sentence is executed directly: <em>\"Aurea, what's the weather?\"<\/em><\/td>\n<td>reply starts after you finish the sentence<\/td>\n<td>none<\/td>\n<\/tr>\n<tr>\n<td><code>oww<\/code><\/td>\n<td>an openWakeWord neural model listens for a fixed phrase, then Alveus chimes and records your request<\/td>\n<td>~0.2 s after the phrase<\/td>\n<td>pretrained phrase, or train your own<\/td>\n<\/tr>\n<tr>\n<td><code>both<\/code><\/td>\n<td>either of the above<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>In <code>both<\/code> mode the phrase is scored continuously, including while VAD is already recording a sentence, so\n\"hey Jarvis, what's the weather?\" works as one utterance (the phrase triggers the chime and the rest is recorded).<\/p>\n<p>Plus the global hotkey (<code>ctrl+alt+space<\/code> by default) and <code>POST /trigger<\/code> on the local API.<\/p>\n<h2 id=\"pretrained-openwakeword-phrases\">Pretrained openWakeWord phrases<\/h2>\n<p>openWakeWord ships six English models; set <code>activation.wake_word.oww_model<\/code> to one of:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>model id<\/th>\n<th>phrase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>hey_jarvis<\/code><\/td>\n<td>\"hey Jarvis\"<\/td>\n<\/tr>\n<tr>\n<td><code>alexa<\/code><\/td>\n<td>\"Alexa\"<\/td>\n<\/tr>\n<tr>\n<td><code>hey_mycroft<\/code><\/td>\n<td>\"hey Mycroft\"<\/td>\n<\/tr>\n<tr>\n<td><code>hey_rhasspy<\/code><\/td>\n<td>\"hey Rhasspy\"<\/td>\n<\/tr>\n<tr>\n<td><code>weather<\/code><\/td>\n<td>\"what's the weather\"<\/td>\n<\/tr>\n<tr>\n<td><code>timer<\/code><\/td>\n<td>\"set a … minute timer\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>More community-trained phrases: https://openwakeword.com/library (drop the <code>.onnx<\/code> into <code>$ALVEUS_MODELS/wakeword/<\/code> and set <code>oww_model<\/code> to the file stem).<\/p>\n<h2 id=\"training-your-own-alveus-aurea\">Training your own (\"Alveus\", \"Aurea\")<\/h2>\n<p>Yes. Two options, both fully local:<\/p>\n<h3 id=\"a-livekit-wakeword-recommended-2026\">A. livekit-wakeword (recommended, 2026)<\/h3>\n<p>One-command pipeline: synthesizes thousands of TTS samples of the phrase, augments them with noise/reverb, trains, and exports an <code>.onnx<\/code> that <strong>loads in openWakeWord unchanged<\/strong>. It reports ~100x fewer false positives than the classic openWakeWord training notebook.<\/p>\n<pre><code class=\"language-bash\">scripts/train_wakeword.sh alveus             # creates conda env 'alveus-wakeword', runs setup (~19 GB, once),\nscripts/train_wakeword.sh aurea              # trains, and installs $ALVEUS_MODELS/wakeword/&lt;name&gt;.onnx\nscripts/train_wakeword.sh &quot;hey aurea&quot; hey_aurea\n<\/code><\/pre>\n<p>What the script does, in order:<\/p>\n<ol>\n<li>Creates the conda env <code>alveus-wakeword<\/code> and installs <code>livekit-wakeword<\/code>. It stays separate from\n   <code>alveus<\/code> because it pins newer numpy/onnxruntime than the speech stack (~6 GB).<\/li>\n<li>Makes sure the <code>espeak-ng<\/code> command exists (Piper's phonemizer shells out to it). <code>sudo apt install\n   espeak-ng<\/code> is the normal way; without root, and if <code>libespeak-ng1<\/code> + <code>espeak-ng-data<\/code> are present\n   (Ubuntu pulls them in for other packages), the script compiles the small CLI into the env instead.<\/li>\n<li>Runs <code>livekit-wakeword setup<\/code> once into <code>$ALVEUS_MODELS/wakeword-train-data<\/code> (override with\n   <code>ALVEUS_WAKEWORD_DATA<\/code>): ACAV100M negative features (16 GB), MUSAN backgrounds (1.1 GB), MIT room\n   impulse responses, and the Piper LibriTTS voice. Keep 25 GB free the first time.<\/li>\n<li>Writes <code>.wakeword-train/&lt;name&gt;/configs/&lt;name&gt;.yaml<\/code> (10,000 synthetic positives, small\n   conv-attention model, 50,000 steps, target 0.2 false positives per hour) and runs the pipeline:\n   synthesize the phrase with many voices and speeds, augment with noise/reverb, train, evaluate,\n   export ONNX. 20–60 minutes per phrase on an RTX 4090; it shares the GPU with the running\n   assistant, so expect it to be slower while the LLM is loaded.<\/li>\n<li>Copies the model to <code>$ALVEUS_MODELS/wakeword/&lt;name&gt;.onnx<\/code>, where the GUI's wake-word model list\n   picks it up.<\/li>\n<\/ol>\n<p>Then in <code>config/local.yaml<\/code> (or GUI → Settings → Activation, tick both models):<\/p>\n<pre><code class=\"language-yaml\">activation:\n  wake_word:\n    mode: both                 # names + neural wake words\n    oww_model: [alveus, aurea] # several models listen at once\n<\/code><\/pre>\n<p>Training takes on the order of 20–60 minutes per phrase on the RTX 4090. Tips from the openWakeWord authors: 3+ syllables work best (both names qualify), and add a leading \"hey\" variant if you want \"hey Alveus\" too.<\/p>\n<h3 id=\"b-openwakewords-own-notebook\">B. openWakeWord's own notebook<\/h3>\n<p><code>notebooks/automatic_model_training.ipynb<\/code> in the openWakeWord repo (Colab or local Jupyter). Same idea (piper-sample-generator for positives, ~30k h of negative audio features), a bit more manual. Output <code>.onnx<\/code> goes in the same folder.<\/p>\n<h3 id=\"results-on-this-machine-2026-09-09\">Results on this machine (2026-09-09)<\/h3>\n<p>Both names trained in about 15 minutes each on the RTX 4090 while the assistant kept running. The\ntrainer's own validation (2,000 synthetic positives, 32,000 negatives, 480,000 background clips):\n<code>alveus<\/code> recall 99.2 %, <code>aurea<\/code> 99.6 %, 0 false positives per hour for both. With the assistant's Kokoro\nvoice, which the trainer never heard, the bare word scores 0.90 (<code>alveus<\/code>) and 0.66 (<code>aurea<\/code>); unrelated\nspeech, Mandarin and the pretrained phrases stay below 0.15, and neither model reacts to the other name.\n\"hey alveus\" scores only 0.19: the models expect the bare name. Threshold 0.5 is the starting point; the\nowner's own voice decides the final value.<\/p>\n<h2 id=\"tuning\">Tuning<\/h2>\n<ul>\n<li><code>alveus wakeword-test<\/code> prints live scores (per model) so you can set <code>activation.wake_word.threshold<\/code>.<\/li>\n<li>If Whisper hears your name oddly (<code>alveus stt test<\/code>), add the spelling to <code>name_aliases<\/code>.<\/li>\n<\/ul>", "headings": [{"id": "pretrained-openwakeword-phrases", "text": "Pretrained openWakeWord phrases", "level": 2}, {"id": "training-your-own-alveus-aurea", "text": "Training your own (\"Alveus\", \"Aurea\")", "level": 2}, {"id": "a-livekit-wakeword-recommended-2026", "text": "A. livekit-wakeword (recommended, 2026)", "level": 3}, {"id": "b-openwakewords-own-notebook", "text": "B. openWakeWord's own notebook", "level": 3}, {"id": "results-on-this-machine-2026-09-09", "text": "Results on this machine (2026-09-09)", "level": 3}, {"id": "tuning", "text": "Tuning", "level": 2}], "source": "docs/wake-words.md"}, {"slug": "troubleshooting", "title": "Troubleshooting", "group": "Maintain", "html": "<h1 id=\"troubleshooting\">Troubleshooting<\/h1>\n<p>Start with <code>alveus doctor --warm<\/code> and <code>journalctl --user -u alveus -n 200<\/code>.<\/p>\n<h2 id=\"startup-services\">Startup / services<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>After a reboot <code>alveus.service<\/code> is <code>inactive (dead)<\/code> while <code>alveus-llm<\/code> runs; journal shows <code>default.target: Found ordering cycle on alveus.service/start<\/code><\/td>\n<td>a unit both <code>WantedBy=default.target<\/code> and <code>After=default.target<\/code> is a cycle (a target is implicitly ordered after everything it wants); systemd broke it by dropping the assistant's start job<\/td>\n<td>remove the <code>After=default.target<\/code> line (fixed in <code>systemd/alveus-llm.service.in<\/code>; rerun <code>scripts/install_services.sh<\/code>), <code>systemctl --user daemon-reload<\/code>, <code>systemctl --user start alveus<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>alveus.service<\/code> restarts in a loop, log shows <code>ValueError: space<\/code><\/td>\n<td>hotkey combo uses a bare key name<\/td>\n<td>use pynput names in angle brackets: <code>&lt;ctrl&gt;+&lt;alt&gt;+&lt;space&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>hotkey disabled … Can't connect to display \":0\"<\/code><\/td>\n<td>unit had a hard-coded <code>DISPLAY<\/code>; or the systemd user env lacks <code>DISPLAY<\/code>/<code>XAUTHORITY<\/code><\/td>\n<td>current unit inherits them; if still missing: <code>systemctl --user import-environment DISPLAY XAUTHORITY<\/code> then restart<\/td>\n<\/tr>\n<tr>\n<td>GUI header says \"LLM service failed/activating\"<\/td>\n<td>llama-server not healthy on :8080<\/td>\n<td><code>systemctl --user status alveus-llm<\/code>, <code>journalctl --user -u alveus-llm<\/code>; check weights path in <code>alveus llm profiles<\/code><\/td>\n<\/tr>\n<tr>\n<td>Port 8080 in use<\/td>\n<td>a manual <code>llama-server<\/code> is still running<\/td>\n<td><code>pkill llama-server<\/code> (careful with <code>pkill -f<\/code> matching your own shell), then start the unit<\/td>\n<\/tr>\n<tr>\n<td>Two answers to every question<\/td>\n<td>service <strong>and<\/strong> manual <code>alveus talk<\/code> both running<\/td>\n<td><code>systemctl --user stop alveus<\/code> before running by hand<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"audio\">Audio<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>PortAudioError: Invalid sample rate<\/code> / no devices<\/td>\n<td>conda's PortAudio has no PipeWire/Pulse host API and PipeWire holds the ALSA devices<\/td>\n<td>use <code>audio.backend: pipewire<\/code> (auto when <code>pw-record<\/code> exists)<\/td>\n<\/tr>\n<tr>\n<td><code>pw-record exited unexpectedly<\/code><\/td>\n<td>no <code>XDG_RUNTIME_DIR<\/code>/PipeWire socket (e.g. run from ssh)<\/td>\n<td>run inside the desktop session (<code>systemd --user<\/code> service does)<\/td>\n<\/tr>\n<tr>\n<td>Nothing reacts (no name, no wake word, no <code>addressed as:<\/code> in the journal), yet <code>wpctl<\/code> shows the mic at full volume<\/td>\n<td>the microphone delivers silence: hardware mute button on the headset/speaker (the Panasonic SC-GN01 has one and exposes no software capture control), wrong default source, or device not re-enumerated after boot<\/td>\n<td><code>timeout 4 pw-record --rate 16000 --channels 1 --format s16 t.wav<\/code
