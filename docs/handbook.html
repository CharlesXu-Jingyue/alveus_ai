any file in <code>mcp_servers/<\/code>, e.g.:<\/p>\n<pre><code class=\"language-python\">from .common import FastMCP, annot, j, run\n\nmcp = FastMCP(&quot;lights&quot;)\n\n@mcp.tool(annotations=annot(read_only=True))\ndef light_status(room: str) -&gt; str:\n    &quot;&quot;&quot;Report whether the lights in a room are on.&quot;&quot;&quot;\n    return j({&quot;room&quot;: room, &quot;on&quot;: True})\n\n@mcp.tool(annotations=annot(destructive=True))\ndef all_off() -&gt; str:\n    &quot;&quot;&quot;Turn every light off. (Confirmed with the user.)&quot;&quot;&quot;\n    return j(run([&quot;my-lights&quot;, &quot;off&quot;]))\n\nif __name__ == &quot;__main__&quot;:\n    mcp.run()\n<\/code><\/pre>\n<p>Register it: <code>tools.servers.lights.command: [python, -m, mcp_servers.lights]<\/code>.\nGuidelines: keep docstrings short and concrete (the model reads them), return JSON text, mark\nirreversible tools destructive, never block for long without a timeout, and prefer\nparameters with defaults so the model can call tools with few arguments. <code>common.py<\/code>\nwraps <code>MCPServer<\/code>/<code>FastMCP<\/code> and <code>ToolAnnotations<\/code> so the same code runs on mcp 1.x and 2.x.<\/p>", "headings": [{"id": "files-mcp_serversfiles_shellpy", "text": "files — mcp_servers/files_shell.py", "level": 2}, {"id": "desktop-mcp_serversdesktoppy", "text": "desktop — mcp_servers/desktop.py", "level": 2}, {"id": "system-mcp_serverssystempy", "text": "system — mcp_servers/system.py", "level": 2}, {"id": "web-mcp_serverswebpy", "text": "web — mcp_servers/web.py", "level": 2}, {"id": "coder-mcp_serverscoderpy", "text": "coder — mcp_servers/coder.py", "level": 2}, {"id": "adding-third-party-mcp-servers", "text": "Adding third-party MCP servers", "level": 2}, {"id": "writing-your-own-server", "text": "Writing your own server", "level": 2}], "source": "docs/tools.md"}, {"slug": "backends", "title": "Backends", "group": "Use", "html": "<h1 id=\"backends-llm-stt-tts-audio\">Backends: LLM, STT, TTS, audio<\/h1>\n<p>Every stage of the pipeline is a backend chosen in configuration. This page lists what exists,\nhow each performed on the reference machine (RTX 4090), how to switch, and how to add more.<\/p>\n<h2 id=\"llm\">LLM<\/h2>\n<h3 id=\"interface\">Interface<\/h3>\n<p><code>alveus/llm/base.py<\/code>: <code>LLMBackend.stream(messages, tools, thinking) -&gt; AsyncIterator[LLMEvent]<\/code>\nwith events <code>reasoning<\/code>, <code>content<\/code>, <code>tool_call<\/code>, <code>done<\/code>, plus <code>health()<\/code>.<\/p>\n<h3 id=\"openai-any-openai-compatible-chat-endpoint-alveusllmopenai_compatpy\"><code>openai<\/code> — any OpenAI-compatible chat endpoint (<code>alveus/llm/openai_compat.py<\/code>)<\/h3>\n<p>Speaks <code>/v1/chat/completions<\/code> with <code>stream: true<\/code> over server-sent events using plain <code>httpx<\/code>\n(no vendor SDK), accumulates streamed tool-call fragments by index, repairs truncated JSON\narguments, and reads <code>reasoning_content<\/code> (llama.cpp) or <code>reasoning<\/code> (other servers). Verified\nwith llama-server; also works with vLLM, SGLang, Ollama (<code>/v1<\/code>), LM Studio, LocalAI, and hosted\nAPIs (set <code>api_key<\/code>).<\/p>\n<h3 id=\"shipped-profiles\">Shipped profiles<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>profile<\/th>\n<th>weights<\/th>\n<th>size<\/th>\n<th>quality vs FP16<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>bonsai-1bit<\/code> (default)<\/td>\n<td><code>Bonsai-27B-Q1_0.gguf<\/code><\/td>\n<td>3.8 GB<\/td>\n<td>~90 %<\/td>\n<td>27B params, Qwen3.6 base, 262k ctx, native tool calling + thinking. ~60–95 tok/s<\/td>\n<\/tr>\n<tr>\n<td><code>bonsai-ternary<\/code><\/td>\n<td><code>Ternary-Bonsai-27B-PQ2_0.gguf<\/code><\/td>\n<td>7.2 GB<\/td>\n<td>~95 %<\/td>\n<td>better agentic/tool scores (BFCL, τ²-bench); same server flags<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Both need the <strong>PrismML fork of llama.cpp<\/strong>, specifically its <code>prism<\/code> branch, for the custom\nkernels (<code>Q1_0<\/code> = type 41 is also on the fork's master, but <code>PQ2_0<\/code> = type 142 only exists on\n<code>prism<\/code>; upstream llama.cpp only runs the <code>Q2_g64<\/code> ternary variant). <code>scripts/build_llama.sh<\/code>\nclones/checks out <code>prism<\/code> and builds. Switching profiles in the GUI runs a load check first and\nrefuses the switch if the binary cannot read the file.<\/p>\n<h3 id=\"swapping-the-llm\">Swapping the LLM<\/h3>\n<p>Add a profile; nothing else changes:<\/p>\n<pre><code class=\"language-yaml\">llm:\n  profile: qwen-vllm\n  profiles:\n    qwen-vllm:\n      backend: openai\n      base_url: http://127.0.0.1:8000/v1\n      api_key: local\n      model: Qwen/Qwen3-32B-AWQ\n      reasoning: true\n      thinking: false          # optional: faster replies, weaker tool choice\n      extra_body: { top_k: 20 }\n      # optional, lets `alveus llm serve` start it:\n      # serve: { command: vllm, model_path: Qwen/Qwen3-32B-AWQ, args: [serve, --port, &quot;8000&quot;] }\n<\/code><\/pre>\n<p>Requirements for a good voice experience: tool calling (OpenAI <code>tools<\/code> format), streaming, and\n≥ 30 tok/s. For remote APIs, remember that requests (including tool results such as file\ncontents) leave the machine.<\/p>\n<h3 id=\"adding-a-non-openai-backend\">Adding a non-OpenAI backend<\/h3>\n<p>Implement the protocol in a new file under <code>alveus/llm/<\/code>, register it in <code>alveus/llm/__init__.py<\/code>\n(<code>make_llm<\/code>), and name it in the profile's <code>backend<\/code>. About 100 lines.<\/p>\n<h2 id=\"speech-to-text\">Speech-to-text<\/h2>\n<h3 id=\"interface_1\">Interface<\/h3>\n<p><code>alveus/stt/base.py<\/code>: <code>load()<\/code> and <code>transcribe(float32_audio, sample_rate) -&gt; str<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>backend<\/th>\n<th>engine<\/th>\n<th>VRAM<\/th>\n<th>latency (4090)<\/th>\n<th>strengths<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>faster_whisper<\/code> (default)<\/td>\n<td>CTranslate2 Whisper <code>large-v3-turbo<\/code>, fp16<\/td>\n<td>~1.5 GB<\/td>\n<td>0.06–0.2 s per utterance<\/td>\n<td>robust, multilingual, punctuation<\/td>\n<td>imports torch first so ctranslate2 finds cuDNN 9<\/td>\n<\/tr>\n<tr>\n<td><code>parakeet<\/code><\/td>\n<td>NVIDIA Parakeet TDT 0.6B v3 via onnx-asr<\/td>\n<td>~1 GB (CPU works too)<\/td>\n<td>~0.3 s<\/td>\n<td>very fast, 25 European languages<\/td>\n<td>first load downloads ~2.5 GB; names slightly less accurate (\"Oria\")<\/td>\n<\/tr>\n<tr>\n<td><code>openai_http<\/code><\/td>\n<td>any <code>/v1/audio/transcriptions<\/code> server<\/td>\n<td>—<\/td>\n<td>network<\/td>\n<td>reuse whisper.cpp server, speaches, etc.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Switch: <code>stt.backend: parakeet<\/code> or <code>ALVEUS_STT_BACKEND=parakeet<\/code>. Test: <code>alveus stt test<\/code>.<\/p>\n<p>Both local engines run on whole utterances (not streaming); with the VAD-based segmenting the\ntranscript is ready ~0.1–0.3 s after you stop speaking, which is what gates the response time.<\/p>\n<h2 id=\"text-to-speech\">Text-to-speech<\/h2>\n<h3 id=\"interface_2\">Interface<\/h3>\n<p><code>alveus/tts/base.py<\/code>: <code>load()<\/code>, <code>synthesize(text) -&gt; float32 audio<\/code>, <code>sample_rate<\/code>, <code>voices()<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>backend<\/th>\n<th>engine<\/th>\n<th>VRAM<\/th>\n<th>speed (4090)<\/th>\n<th>strengths<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>kokoro<\/code> (default)<\/td>\n<td>Kokoro-82M (PyTorch)<\/td>\n<td>~0.6 GB<\/td>\n<td>~10× faster than real time after warm-up<\/td>\n<td>crisp, 28 voices, tiny<\/td>\n<td>no cloning; sample rate 24 kHz<\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox<\/code><\/td>\n<td>Resemble Chatterbox: <code>turbo<\/code> (English), <code>standard<\/code> (English), <code>multilingual<\/code> (23 languages)<\/td>\n<td>3–4 GB<\/td>\n<td>~0.2× real time (4 s of speech in 0.85 s)<\/td>\n<td>most natural, zero-shot voice cloning from a WAV; multilingual speaks zh, ja, ko, de, fr, es, it, pt, ru, ar, hi…<\/td>\n<td>multilingual picks the language per sentence (<code>tts.chatterbox.language: auto<\/code>): script detection for CJK/Cyrillic/Arabic/…, <code>langdetect<\/code> for Latin text, <code>fallback_language<\/code> otherwise<\/td>\n<\/tr>\n<tr>\n<td><code>openai_http<\/code><\/td>\n<td>any <code>/v1/audio/speech<\/code> server<\/td>\n<td>—<\/td>\n<td>network<\/td>\n<td>Kokoro-FastAPI, openedai-speech, …<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Switch: <code>tts.backend: chatterbox<\/code> (+ <code>chatterbox.voice_ref: ~/voices/me.wav<\/code> for cloning; <code>chatterbox.model:\nmultilingual<\/code> to speak other languages). For a bilingual conversation also clear\n<code>stt.faster_whisper.language<\/code> so Whisper auto-detects what you say; the LLM answers in the language\nyou used, and the streaming splitter understands Chinese/Japanese sentence punctuation (。！？).\nTest: <code>alveus tts say \"Hello there\"<\/code>. The chosen voice's gender decides the spoken name\n(<code>tts.voice_gender<\/code>, auto from Kokoro voice prefixes).<\/p>\n<p>Streaming: text is split into sentences (<code>SentenceBuffer<\/code>, min 24 chars, abbreviation- and\ndecimal-aware) and each sentence is synthesized while the model continues generating, so\ntime-to-first-word ≈ LLM thinking time + first sentence generation + ~0.2 s synthesis.<\/p>\n<h2 id=\"voice-activity-wake-word\">Voice activity &amp; wake word<\/h2>\n<ul>\n<li><strong>Silero VAD<\/strong> (<code>silero-vad<\/code> PyTorch package) on 32 ms frames, CPU. Threshold <code>audio.vad.threshold<\/code>.<\/li>\n<li><strong>openWakeWord 0.6<\/strong> on ONNX runtime (the <code>tflite-runtime<\/code> dependency is dropped because it has\n  no Python 3.12 wheels). Feeds 80 ms int16 chunks; pretrained and custom models supported.<\/li>\n<li><strong>Name detection<\/strong> – no model; uses the STT transcript. See <a href=\"#wake-words\">wake-words.md<\/a>.<\/li>\n<\/ul>\n<h2 id=\"audio-io\">Audio I/O<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>backend<\/th>\n<th>how<\/th>\n<th>when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pipewire<\/code> (auto-selected when available)<\/td>\n<td><code>pw-record<\/code>/<code>pw-play<\/code> subprocesses, s16 in / f32 out, 32–64 ms latency<\/td>\n<td>any PipeWire desktop (Ubuntu ≥ 22.10, Fedora, Arch…)<\/td>\n<\/tr>\n<tr>\n<td><code>sounddevice<\/code><\/td>\n<td>PortAudio streams<\/td>\n<td>macOS, PulseAudio-only or headless ALSA setups; needs a PortAudio that can open the device<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Select devices with <code>audio.input_device<\/code> / <code>output_device<\/code> (PipeWire node name or serial from\n<code>wpctl status<\/code>; sounddevice index or name substring). Playback is a queue in a background thread,\ninterruptible via <code>AudioOut.stop()<\/code> (hotkey barge-in, <code>/stop<\/code>).<\/p>\n<h2 id=\"optional-server-side-variants\">Optional server-side variants<\/h2>\n<p>Instead of in-process STT/TTS you can run them as separate services and point the <code>openai_http<\/code>\nbackends at them — useful if you want the speech models shared with other apps, or on another\nmachine:<\/p>\n<ul>\n<li>STT: <code>speaches<\/code> (faster-whisper server), whisper.cpp <code>server<\/code>, Parakeet FastAPI wrappers.<\/li>\n<li>TTS: <code>Kokoro-FastAPI<\/code> (port 8880), <code>Chatterbox-TTS-Server<\/code>, <code>openedai-speech<\/code>.<\/li>\n<\/ul>", "headings": [{"id": "llm", "text": "LLM", "level": 2}, {"id": "interface", "text": "Interface", "level": 3}, {"id": "openai-any-openai-compatible-chat-endpoint-alveusllmopenai_compatpy", "text": "openai — any OpenAI-compatible chat endpoint (alveus/llm/openai_compat.py)", "level": 3}, {"id": "shipped-profiles", "text": "Shipped profiles", "level": 3}, {"id": "swapping-the-llm", "text": "Swapping the LLM", "level": 3}, {"id": "adding-a-non-openai-backend", "text": "Adding a non-OpenAI backend", "level": 3}, {"id": "speech-to-text", "text": "Speech-to-text", "level": 2}, {"id": "interface_1", "text": "Interface", "level": 3}, {"id": "text-to-speech", "text": "Text-to-speech", "level": 2}, {"id": "interface_2", "text": "Interface", "level": 3}, {"id": "voice-activity-wake-word", "text": "Voice activity &amp; wake word", "level": 2}, {"id": "audio-io", "text": "Audio I/O", "level": 2}, {"id": "optional-server-side-variants", "text": "Optional server-side variants", "level": 2}], "source": "docs/backends.md"}, {"slug": "api", "title": "GUI & HTTP API", "group": "Use", "html": "<h1 id=\"http-api-and-browser-gui\">HTTP API and browser GUI<\/h1>\n<p>Served by <code>alveus talk<\/code> (default) and <code>alveus api<\/code> on <code>http://127.0.0.1:8765<\/code>\n(<code>api.host<\/code> / <code>api.port<\/code>). The <strong>browser GUI<\/strong> lives at <code>/<\/code> (see <a href=\"#usage/browser-gui\">usage.md<\/a>);\ninteractive OpenAPI docs at <code>/docs<\/code>. No authentication: it binds to localhost only. To use it from\nanother device, tunnel instead of exposing the port: <code>ssh -L 8765:127.0.0.1:8765 &lt;host&gt;<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>method &amp; path<\/th>\n<th>body<\/th>\n<th>response<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>GET /health<\/code><\/td>\n<td><\/td>\n<td><code>{ok, llm, state, tools, stt, tts}<\/code><\/td>\n<td><code>ok<\/code> = LLM endpoint reachable and serving the configured model; <code>state<\/code> is idle/listening/thinking/speaking in talk mode<\/td>\n<\/tr>\n<tr>\n<td><code>GET /tools<\/code><\/td>\n<td><\/td>\n<td><code>[{name, description, destructive}]<\/code><\/td>\n<td>namespaced tool names as the model sees them<\/td>\n<\/tr>\n<tr>\n<td><code>POST /chat<\/code><\/td>\n<td><code>{\"text\": str, \"speak\": bool=false, \"reset\": bool=false}<\/code><\/td>\n<td><code>{\"reply\": str}<\/code><\/td>\n<td>runs the agent with tools on the shared conversation history. <code>speak: true<\/code> (talk mode) also voices the reply through the speaker with sentence streaming. <code>reset<\/code> clears history first. Destructive tool calls are refused (no confirmer) unless <code>speak: true<\/code>, where confirmation is spoken<\/td>\n<\/tr>\n<tr>\n<td><code>POST /speak<\/code><\/td>\n<td><code>{\"text\": str, \"play\": bool=false}<\/code><\/td>\n<td>WAV bytes (<code>audio/wav<\/code>), or <code>{\"played\": true, \"seconds\": n}<\/code> when <code>play<\/code><\/td>\n<td>synthesize with the active TTS backend<\/td>\n<\/tr>\n<tr>\n<td><code>POST /transcribe<\/code><\/td>\n<td>multipart <code>file=@audio.wav<\/code><\/td>\n<td><code>{\"text\": str}<\/code><\/td>\n<td>any sample rate/channels; resampled to 16 kHz mono<\/td>\n<\/tr>\n<tr>\n<td><code>POST /trigger<\/code><\/td>\n<td><\/td>\n<td><code>{\"triggered\": bool}<\/code><\/td>\n<td>start listening now (equivalent to the hotkey); <code>false<\/code> in <code>alveus api<\/code> mode<\/td>\n<\/tr>\n<tr>\n<td><code>POST /stop<\/code><\/td>\n<td><\/td>\n<td><code>{\"stopped\": true}<\/code><\/td>\n<td>stop current speech output and drop the queue<\/td>\n<\/tr>\n<tr>\n<td><code>POST /interrupt<\/code><\/td>\n<td><\/td>\n<td><code>{\"interrupted\": true}<\/code><\/td>\n<td>abort the running turn (voice or GUI): stop generating, skip pending tool calls, cut speech, deny open confirmations; the stream then emits <code>interrupted<\/code> and <code>done<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>GET /<\/code><\/td>\n<td><\/td>\n<td>HTML<\/td>\n<td>the browser GUI (chat + settings)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /chat/stream<\/code><\/td>\n<td><code>{\"text\": str, \"speak\": bool=false, \"reset\": bool=false}<\/code><\/td>\n<td>SSE stream<\/td>\n<td>events: <code>reasoning<\/code>, <code>content<\/code>, <code>tool_start {tool,args}<\/code>, <code>tool_result {tool,text}<\/code>, <code>confirm {id,description,sudo}<\/code>, <code>interrupted<\/code>, <code>error<\/code>, <code>done {reply}<\/code>. Destructive and sudo tools wait for <code>POST /confirm<\/code> (120 s, then denied)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /confirm<\/code><\/td>\n<td><code>{\"id\": str, \"ok\": bool, \"password\"?: str}<\/code><\/td>\n<td><code>{\"resolved\": bool}<\/code><\/td>\n<td>answer a <code>confirm<\/code> event from <code>/chat/stream<\/code> or <code>/events<\/code>; when the event has <code>sudo: true<\/code>, <code>password<\/code> is the sudo password for that one command<\/td>\n<\/tr>\n<tr>\n<td><code>GET /history<\/code><\/td>\n<td><\/td>\n<td><code>[{role, text, tools:[{name,args,result}]}]<\/code><\/td>\n<td>the shared conversation (voice and GUI turns)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /history/reset<\/code><\/td>\n<td><\/td>\n<td><code>{\"reset\": true}<\/code><\/td>\n<td>clear the conversation<\/td>\n<\/tr>\n<tr>\n<td><code>GET /events<\/code><\/td>\n<td><\/td>\n<td>SSE stream<\/td>\n<td>live <code>state<\/code> (idle/listening/thinking/speaking), <code>transcript {who,text,source}<\/code>, <code>reset<\/code>, <code>config_saved<\/code>, <code>restarting<\/code>, <code>ping<\/code>; and the live progress of voice turns (<code>source: voice<\/code>): <code>assistant_start<\/code>, <code>assistant_delta {text}<\/code>, <code>tool_start {tool,args}<\/code>, <code>tool_result {tool,text}<\/code>, <code>voice_confirm {text}<\/code> (question asked aloud), <code>confirm {id,description,sudo}<\/code> (needs <code>POST /confirm<\/code>), then the final <code>transcript<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>GET /config<\/code><\/td>\n<td><\/td>\n<td><code>{effective, local, local_yaml, options, paths, env, managed_by_systemd, running_profile}<\/code><\/td>\n<td>merged configuration plus the machine overrides and option lists for the GUI<\/td>\n<\/tr>\n<tr>\n<td><code>PUT /config<\/code><\/td>\n<td><code>{\"patch\": {...}}<\/code> or <code>{\"yaml\": \"...\"}<\/code><\/td>\n<td><code>{saved, local, local_yaml, restart_required}<\/code><\/td>\n<td>deep-merge into <code>config/local.yaml<\/code> (a <code>null<\/code> leaf stores an explicit null, e.g. auto-detect language; a leaf <code>{\"$unset\": true}<\/code> removes the override so the default applies) or replace the file; validated before writing<\/td>\n<\/tr>\n<tr>\n<td><code>GET /persona<\/code> / <code>PUT /persona<\/code><\/td>\n<td>— / <code>{\"text\": str}<\/code><\/td>\n<td><code>{text}<\/code> / <code>{saved}<\/code><\/td>\n<td>read/write <code>config/persona.md<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>POST /restart<\/code><\/td>\n<td><code>{\"what\": \"assistant\" \\| \"llm\" \\| \"both\"}<\/code><\/td>\n<td><code>{restarting: [...]}<\/code><\/td>\n<td>restarts the systemd user units; 409 when not running under systemd<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Examples:<\/p>\n<pre><code class=\"language-bash\">curl -s localhost:8765/health | jq\ncurl -s localhost:8765/chat -H 'content-type: application/json' \\\n     -d '{&quot;text&quot;: &quot;how much disk space is left?&quot;}'\ncurl -s localhost:8765/speak -H 'content-type: application/json' \\\n     -d '{&quot;text&quot;: &quot;Build finished.&quot;}' -o build.wav\ncurl -s localhost:8765/transcribe -F file=@memo.wav\n<\/code><\/pre>\n<p>Python:<\/p>\n<pre><code class=\"language-python\">import httpx\nr = httpx.post(&quot;http://127.0.0.1:8765/chat&quot;, json={&quot;text&quot;: &quot;what's my GPU temperature?&quot;}, timeout=120)\nprint(r.json()[&quot;reply&quot;])\n<\/code><\/pre>\n<p>Streaming from the shell:<\/p>\n<pre><code class=\"language-bash\">curl -sN localhost:8765/chat/stream -H 'content-type: application/json' -d '{&quot;text&quot;:&quot;what time is it?&quot;}'\n<\/code><\/pre>\n<p>Ideas: bind <code>alveus trigger<\/code> (which posts to <code>/trigger<\/code>) to a GNOME keyboard shortcut on Wayland;\nhave cron or a build script call <code>/speak<\/code> with <code>play: true<\/code> for spoken notifications; feed audio\nfrom a phone or another room's microphone to <code>/transcribe<\/code> + <code>/chat<\/code>.<\/p>", "headings": [], "source": "docs/api.md"}, {"slug": "wake-words", "title": "Wake words", "group": "Use", "html": "<h1 id=\"wake-words\">Wake words<\/h1>\n<p>Alveus can be activated three ways (all configurable under <code>activation:<\/code> in <code>config/alveus.yaml<\/code>):<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>mode<\/th>\n<th>how it works<\/th>\n<th>latency<\/th>\n<th>setup<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>names<\/code> (default)<\/td>\n<td>VAD detects speech, the segment is transcribed, and the transcript is checked for <strong>Alveus<\/strong> / <strong>Aurea<\/strong> (fuzzy: \"Alvius\", \"Aria\", \"Oria\"...). The rest of the sentence is executed directly: <em>\"Aurea, what's the weather?\"<\/em><\/td>\n<td>reply starts after you finish the sentence<\/td>\n<td>none<\/td>\n<\/tr>\n<tr>\n<td><code>oww<\/code><\/td>\n<td>an openWakeWord neural model listens for a fixed phrase, then Alveus chimes and records your request<\/td>\n<td>~0.2 s after the phrase<\/td>\n<td>pretrained phrase, or train your own<\/td>\n<\/tr>\n<tr>\n<td><code>both<\/code><\/td>\n<td>either of the above<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Plus the global hotkey (<code>ctrl+alt+space<\/code> by default) and <code>POST /trigger<\/code> on the local API.<\/p>\n<h2 id=\"pretrained-openwakeword-phrases\">Pretrained openWakeWord phrases<\/h2>\n<p>openWakeWord ships six English models; set <code>activation.wake_word.oww_model<\/code> to one of:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>model id<\/th>\n<th>phrase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>hey_jarvis<\/code><\/td>\n<td>\"hey Jarvis\"<\/td>\n<\/tr>\n<tr>\n<td><code>alexa<\/code><\/td>\n<td>\"Alexa\"<\/td>\n<\/tr>\n<tr>\n<td><code>hey_mycroft<\/code><\/td>\n<td>\"hey Mycroft\"<\/td>\n<\/tr>\n<tr>\n<td><code>hey_rhasspy<\/code><\/td>\n<td>\"hey Rhasspy\"<\/td>\n<\/tr>\n<tr>\n<td><code>weather<\/code><\/td>\n<td>\"what's the weather\"<\/td>\n<\/tr>\n<tr>\n<td><code>timer<\/code><\/td>\n<td>\"set a … minute timer\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>More community-trained phrases: https://openwakeword.com/library (drop the <code>.onnx<\/code> into <code>$ALVEUS_MODELS/wakeword/<\/code> and set <code>oww_model<\/code> to the file stem).<\/p>\n<h2 id=\"training-your-own-alveus-aurea\">Training your own (\"Alveus\", \"Aurea\")<\/h2>\n<p>Yes. Two options, both fully local:<\/p>\n<h3 id=\"a-livekit-wakeword-recommended-2026\">A. livekit-wakeword (recommended, 2026)<\/h3>\n<p>One-command pipeline: synthesizes thousands of TTS samples of the phrase, augments them with noise/reverb, trains, and exports an <code>.onnx<\/code> that <strong>loads in openWakeWord unchanged<\/strong>. It reports ~100x fewer false positives than the classic openWakeWord training notebook.<\/p>\n<pre><code class=\"language-bash\">scripts/train_wakeword.sh alveus             # creates conda env 'alveus-wakeword', runs setup (several GB, once),\nscripts/train_wakeword.sh aurea              # trains, and installs $ALVEUS_MODELS/wakeword/&lt;name&gt;.onnx\nscripts/train_wakeword.sh &quot;hey aurea&quot; hey_aurea\n<\/code><\/pre>\n<p>The trainer lives in its own conda env because it pins newer numpy/onnxruntime than the speech stack.<\/p>\n<p>Then in <code>config/local.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">activation:\n  wake_word:\n    mode: both            # names + neural wake word\n    oww_model: alveus     # or aurea; a second model can be listed later\n<\/code><\/pre>\n<p>Training takes on the order of 20–60 minutes per phrase on the RTX 4090. Tips from the openWakeWord authors: 3+ syllables work best (both names qualify), and add a leading \"hey\" variant if you want \"hey Alveus\" too.<\/p>\n<h3 id=\"b-openwakewords-own-notebook\">B. openWakeWord's own notebook<\/h3>\n<p><code>notebooks/automatic_model_training.ipynb<\/code> in the openWakeWord repo (Colab or local Jupyter). Same idea (piper-sample-generator for positives, ~30k h of negative audio features), a bit more manual. Output <code>.onnx<\/code> goes in the same folder.<\/p>\n<h2 id=\"tuning\">Tuning<\/h2>\n<ul>\n<li><code>alveus wakeword-test<\/code> prints live scores so you can set <code>activation.wake_word.threshold<\/code>.<\/li>\n<li>If Whisper hears your name oddly (<code>alveus stt test<\/code>), add the spelling to <code>name_aliases<\/code>.<\/li>\n<\/ul>", "headings": [{"id": "pretrained-openwakeword-phrases", "text": "Pretrained openWakeWord phrases", "level": 2}, {"id": "training-your-own-alveus-aurea", "text": "Training your own (\"Alveus\", \"Aurea\")", "level": 2}, {"id": "a-livekit-wakeword-recommended-2026", "text": "A. livekit-wakeword (recommended, 2026)", "level": 3}, {"id": "b-openwakewords-own-notebook", "text": "B. openWakeWord's own notebook", "level": 3}, {"id": "tuning", "text": "Tuning", "level": 2}], "source": "docs/wake-words.md"}, {"slug": "troubleshooting", "title": "Troubleshooting", "group": "Maintain", "html": "<h1 id=\"troubleshooting\">Troubleshooting<\/h1>\n<p>Start with <code>alveus doctor --warm<\/code> and <code>journalctl --user -u alveus -n 200<\/code>.<\/p>\n<h2 id=\"startup-services\">Startup / services<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>alveus.service<\/code> restarts in a loop, log shows <code>ValueError: space<\/code><\/td>\n<td>hotkey combo uses a bare key name<\/td>\n<td>use pynput names in angle brackets: <code>&lt;ctrl&gt;+&lt;alt&gt;+&lt;space&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>hotkey disabled … Can't connect to display \":0\"<\/code><\/td>\n<td>unit had a hard-coded <code>DISPLAY<\/code>; or the systemd user env lacks <code>DISPLAY<\/code>/<code>XAUTHORITY<\/code><\/td>\n<td>current unit inherits them; if still missing: <code>systemctl --user import-environment DISPLAY XAUTHORITY<\/code> then restart<\/td>\n<\/tr>\n<tr>\n<td>GUI header says \"LLM service failed/activating\"<\/td>\n<td>llama-server not healthy on :8080<\/td>\n<td><code>systemctl --user status alveus-llm<\/code>, <code>journalctl --user -u alveus-llm<\/code>; check weights path in <code>alveus llm profiles<\/code><\/td>\n<\/tr>\n<tr>\n<td>Port 8080 in use<\/td>\n<td>a manual <code>llama-server<\/code> is still running<\/td>\n<td><code>pkill llama-server<\/code> (careful with <code>pkill -f<\/code> matching your own shell), then start the unit<\/td>\n<\/tr>\n<tr>\n<td>Two answers to every question<\/td>\n<td>service <strong>and<\/strong> manual <code>alveus talk<\/code> both running<\/td>\n<td><code>systemctl --user stop alveus<\/code> before running by hand<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"audio\">Audio<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>PortAudioError: Invalid sample rate<\/code> / no devices<\/td>\n<td>conda's PortAudio has no PipeWire/Pulse host API and PipeWire holds the ALSA devices<\/td>\n<td>use <code>audio.backend: pipewire<\/code> (auto when <code>pw-record<\/code> exists)<\/td>\n<\/tr>\n<tr>\n<td><code>pw-record exited unexpectedly<\/code><\/td>\n<td>no <code>XDG_RUNTIME_DIR<\/code>/PipeWire socket (e.g. run from ssh)<\/td>\n<td>run inside the desktop session (<code>systemd --user<\/code> service does)<\/td>\n<\/tr>\n<tr>\n<td>Wrong mic / speaker<\/td>\n<td>default PipeWire device<\/td>\n<td><code>wpctl status<\/code>, <code>wpctl set-default &lt;id&gt;<\/code>, or set <code>audio.input_device<\/code> to the node name<\/td>\n<\/tr>\n<tr>\n<td>Assistant hears itself / random triggers<\/td>\n<td>speaker output reaching the mic<\/td>\n<td>lower speaker volume, raise <code>activation.wake_word.threshold<\/code>, keep <code>mode: names<\/code> (needs a name), or use a headset<\/td>\n<\/tr>\n<tr>\n<td>Cuts you off mid-sentence<\/td>\n<td><code>end_silence_ms<\/code> too short<\/td>\n<td>raise to 900–1200<\/td>\n<\/tr>\n<tr>\n<td>Slow to answer after you stop<\/td>\n<td><code>end_silence_ms<\/code> too long<\/td>\n<td>lower to 500<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"recognition\">Recognition<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Doesn't react to \"Aurea\"<\/td>\n<td>Whisper hears \"Aria/Oria/Area\"<\/td>\n<td>check with <code>alveus stt test<\/code>; add the spelling to <code>activation.wake_word.name_aliases<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reacts when nobody said the name<\/td>\n<td>fuzzy match too loose<\/td>\n<td>remove short aliases; raise <code>NameMatcher<\/code> cutoff (0.78) in <code>alveus/audio/names.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Transcript \"Thank you.\" from silence<\/td>\n<td>Whisper hallucination on near-silence<\/td>\n<td>filtered (<code>JUNK<\/code> set in <code>voice.py<\/code>); extend the set if you see others<\/td>\n<\/tr>\n<tr>\n<td>Non-English speech misrecognised<\/td>\n<td><code>stt.faster_whisper.language: en<\/code><\/td>\n<td>set to <code>null<\/code> for auto-detect<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"model-tools\">Model / tools<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>LLM endpoint FAIL … model 'x' not in served models<\/code><\/td>\n<td>profile <code>model<\/code> ≠ llama-server <code>--alias<\/code><\/td>\n<td>keep them equal; <code>alveus llm serve<\/code> sets the alias from the profile<\/td>\n<\/tr>\n<tr>\n<td><code>alveus-llm<\/code> crash-loops after switching to Ternary: <code>tensor 'output.weight' has invalid ggml type 142<\/code><\/td>\n<td>llama-server built from the fork's <code>master<\/code> (or upstream), which lacks the PQ2_0 kernels<\/td>\n<td>rebuild from the fork's <strong>prism<\/strong> branch: <code>scripts/build_llama.sh<\/code> (does this by default now). The GUI's model check catches this before restarting<\/td>\n<\/tr>\n<tr>\n<td><code>llama-server: error while loading shared libraries: libllama-server-impl.so<\/code><\/td>\n<td>the build directory was moved/renamed; cmake bakes the absolute build path into RPATH<\/td>\n<td>rebuild in place (<code>scripts/build_llama.sh<\/code> now passes <code>-DCMAKE_BUILD_RPATH_USE_ORIGIN=ON<\/code>, which makes the build relocatable) or symlink the old path<\/td>\n<\/tr>\n<tr>\n<td>GUI \"The LLM server did not come up\" after a profile change<\/td>\n<td>new profile's weights can't load<\/td>\n<td>read the error shown, click <em>Revert<\/em>; see the row above<\/td>\n<\/tr>\n<tr>\n<td>Tool calls never happen<\/td>\n<td>server started without <code>--jinja<\/code>, or model without tool template<\/td>\n<td>profile <code>serve.args<\/code> include <code>--jinja<\/code>; check <code>curl :8080/v1/models<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reply is empty but \"thinking\" long<\/td>\n<td><code>max_tokens<\/code> hit during reasoning<\/td>\n<td>raise <code>llm.max_tokens<\/code> or set <code>thinking: false<\/code><\/td>\n<\/tr>\n<tr>\n<td>\"I reached the tool-call limit\"<\/td>\n<td>model looping on a failing tool<\/td>\n<td>check the tool's error in the log; raise <code>llm.max_tool_rounds<\/code> only if legitimately needed<\/td>\n<\/tr>\n<tr>\n<td><code>MCP server 'x' failed to start: Connection closed<\/code><\/td>\n<td>server crashed at import<\/td>\n<td>run it directly: <code>python -m mcp_servers.x<\/code> to see the traceback<\/td>\n<\/tr>\n<tr>\n<td><code>ModuleNotFoundError: mcp.server.fastmcp<\/code><\/td>\n<td>mcp ≥ 2 renamed FastMCP<\/td>\n<td>already handled by <code>mcp_servers/common.py<\/code>; use <code>from .common import FastMCP<\/code><\/td>\n<\/tr>\n<tr>\n<td>Desktop tools say \"missing tools: xdotool…\"<\/td>\n<td>optional binaries absent<\/td>\n<td><code>sudo apt install xdotool wmctrl xclip playerctl<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>code_task<\/code> returns quickly with no summary<\/td>\n<td>opencode not authenticated/configured<\/td>\n<td><code>opencode run \"hi\"<\/code> in a terminal; check <code>~/.config/opencode/opencode.jsonc<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"python-environment\">Python environment<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>CUDAExecutionProvider is not in available provider names<\/code><\/td>\n<td>CPU <code>onnxruntime<\/code> shadows <code>onnxruntime-gpu<\/code><\/td>\n<td><code>pip uninstall -y onnxruntime &amp;&amp; pip install --force-reinstall --no-deps onnxruntime-gpu<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox-tts requires numpy&lt;2<\/code> / other pins broken<\/td>\n<td>another package upgraded numpy/torch<\/td>\n<td><code>pip install \"numpy&lt;2\"<\/code>; compare with <code>requirements-lock.txt<\/code>. Keep experimental tools (e.g. livekit-wakeword) in a separate env<\/td>\n<\/tr>\n<tr>\n<td><code>openwakeword requires tflite-runtime<\/code> in <code>pip check<\/code><\/td>\n<td>intentional (no py3.12 wheels)<\/td>\n<td>ignore; ONNX runtime is used<\/td>\n<\/tr>\n<tr>\n<td>faster-whisper <code>libcudnn<\/code> not found<\/td>\n<td>cuDNN from torch wheels not loaded<\/td>\n<td>the backend imports torch first; ensure torch is installed in the same env<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"disk-downloads\">Disk / downloads<\/h2>\n<ul>\n<li><code>hf download … --include \"*.gguf\"<\/code> on the Bonsai repos would fetch the 54 GB F16 files. Use the\n  exact filenames (as <code>scripts/download_models.sh<\/code> does).<\/li>\n<li>Hugging Face downloads are unauthenticated and rate-limited; set <code>HF_TOKEN<\/code> for speed.<\/li>\n<\/ul>\n<h2 id=\"getting-more-detail\">Getting more detail<\/h2>\n<pre><code class=\"language-bash\">alveus talk -v                         # debug logging incl. ignored transcripts and VAD\ntail -f ~/local/repo/alveus-ai/logs/alveus.log\npython -m mcp_servers.system            # run a tool server alone; it waits on stdin\ncurl -s localhost:8080/health; curl -s localhost:8765/health\ncurl -s localhost:8765/debug/tasks | python -m json.tool   # where every asyncio task is stuck\njournalctl --user -u alveus -o cat | grep &quot;speech:&quot;        # per-reply speech timing / stops\n<\/code><\/pre>\n<p>A reply that never finishes (GUI stays on \"thinking\"/\"speaking\", <code>/health<\/code> still answers) is an\nasyncio task waiting on something: <code>/debug/tasks<\/code> shows the file and line of each task. py-spy\ncannot attach to the service without ptrace rights, so this endpoint is the practical substitute.<\/p>", "headings": [{"id": "startup-services", "text": "Startup / services", "level": 2}, {"id": "audio", "text": "Audio", "level": 2}, {"id": "recognition", "text": "Recognition", "level": 2}, {"id": "model-tools", "text": "Model / tools", "level": 2}, {"id": "python-environment", "text": "Python environment", "level": 2}, {"id": "disk-downloads", "text": "Disk / downloads", "level": 2}, {"id": "getting-more-detail", "text": "Getting more detail", "level": 2}], "source": "docs/troubleshooting.md"}, {"slug": "development", "title": "Development", "group": "Maintain", "html": "<h1 id=\"development\">Development<\/h1>\n<h2 id=\"setup\">Setup<\/h2>\n<pre><code class=\"language-bash\">conda activate alveus\npip install -e &quot;.[dev]&quot;\npython -m pytest -q tests          # unit tests (config, sentence splitter, name matcher)\npython -m ruff check alveus mcp_servers\n<\/code><\/pre>\n<p>Integration checks that need the running stack: <code>alveus doctor --warm<\/code>, <code>alveus tools<\/code>,\n<code>alveus llm test<\/code>, <code>printf 'what is my gpu temperature?\\n/quit\\n' | alveus chat<\/code>.<\/p>\n<h2 id=\"conventions\">Conventions<\/h2>\n<ul>\n<li>Python ≥ 3.11, type hints, <code>from __future__ import annotations<\/code>.<\/li>\n<li>One backend per file; register in the package <code>__init__<\/code> factory (<code>make_llm<\/code>, <code>make_stt<\/code>,\n  <code>make_tts<\/code>). Backends load lazily (<code>load()<\/code>), so unused engines cost nothing.<\/li>\n<li>Heavy imports (torch, faster_whisper, kokoro, chatterbox, onnx_asr, openwakeword) happen\n  inside <code>load()<\/code>/<code>__init__<\/code> of the backend, never at module import.<\/li>\n<li>Everything user-facing reads configuration via <code>load_config()<\/code>; no hard-coded paths.<\/li>\n<li>MCP servers return JSON strings via <code>j()<\/code>; mark irreversible tools with <code>annot(destructive=True)<\/code>.<\/li>\n<li>Logging through <code>logging.getLogger(__name__)<\/code>; the CLI installs a Rich handler and a file handler.<\/li>\n<\/ul>\n<h2 id=\"repository-map\">Repository map<\/h2>\n<pre><code>alveus/            core package (see architecture.md)\nmcp_servers/       built-in MCP servers\nconfig/            alveus.yaml (defaults), persona.md, local.yaml (git-ignored)\nscripts/           installer pieces: pip_install_env.sh, build_llama.sh, download_models.sh,\n                   install_services.sh, train_wakeword.sh\nsystemd/           *.service.in templates rendered by install_services.sh\ntests/             pytest unit tests\ndocs/              this documentation; handbook.html is generated by scripts/build_handbook.py\ninstall.sh         end-to-end installer for a new machine\nrequirements-lock.txt   versions verified together on 2026-09-04\n<\/code><\/pre>\n<h2 id=\"roadmap-next-items-in-order\">Roadmap (next items, in order)<\/h2>\n<ol>\n<li><strong>GUI chat scrolling<\/strong> – stop forcing the log to the bottom during generation; follow the\n   generation head only while the user is at the bottom, and resume following when they return there.<\/li>\n<li><strong>Custom wake words<\/strong> – train openWakeWord models for \"Alveus\" and \"Aurea\" (names mode has too\n   many false negatives with these uncommon words), support several models, use <code>mode: both<\/code>.<\/li>\n<li><strong>Conversations and memory<\/strong> – stored, browsable, resumable conversations plus a persistent\n   memory the assistant can consult and update across restarts.<\/li>\n<li><strong>Image and video models<\/strong> – vision input (Bonsai <code>mmproj<\/code>, screenshots, camera), image\n   generation, video understanding and generation as pluggable backends.<\/li>\n<li><strong>Interrupt by speech<\/strong> – (1) PipeWire echo cancellation so the mic does not hear the assistant;\n   (2) name-triggered barge-in while it speaks (VAD + STT on the cleaned signal, name match acts like\n   the Listen button); (3) custom wake-word models make the trigger instant.<\/li>\n<\/ol>\n<h2 id=\"extension-points-and-ideas\">Extension points and ideas<\/h2>\n<ul>\n<li><strong>Streaming STT<\/strong> for lower latency (Whisper streaming, Parakeet streaming via sherpa-onnx).<\/li>\n<li><strong>Voice barge-in in names mode<\/strong> – run a tiny STT on speech during playback, or train the\n  custom wake-word models (<code>scripts/train_wakeword.sh<\/code>) and use <code>mode: both<\/code>.<\/li>\n<li><strong>Memory<\/strong> – a notes/vector store MCP server so the assistant remembers facts across sessions\n  (history is currently per process).<\/li>\n<li><strong>Timers/reminders<\/strong> – an MCP server with a scheduler and <code>/speak<\/code> callbacks.<\/li>\n<li><strong>Home Assistant<\/strong> – enable the example server block in <code>config/alveus.yaml<\/code>.<\/li>\n<li><strong>Vision<\/strong> – Bonsai ships an <code>mmproj<\/code> vision tower; llama-server can take images\n  (<code>--mmproj<\/code>), so a <code>screenshot → describe<\/code> tool is feasible.<\/li>\n<li><strong>Multiple wake models<\/strong> – <code>WakeWord<\/code> takes a single model today; extend to a list.<\/li>\n<li><strong>Speaker identification<\/strong> – gate destructive actions on your voice.<\/li>\n<\/ul>\n<h2 id=\"documentation\">Documentation<\/h2>\n<p>Edit <code>docs/*.md<\/code>, then <code>python scripts/build_handbook.py<\/code> (needs the <code>markdown<\/code> package from the\n<code>dev<\/code> extra) to regenerate <code>docs/handbook.html<\/code>, a single self-contained page that works from\n<code>file://<\/code> and is served by the GUI at <code>/handbook<\/code>. Commit both.<\/p>\n<h2 id=\"release-checklist\">Release checklist<\/h2>\n<ol>\n<li><code>python -m pytest -q tests &amp;&amp; python -m ruff check alveus mcp_servers &amp;&amp; python scripts/build_handbook.py<\/code><\/li>\n<li><code>alveus doctor --warm<\/code> on a clean env created by <code>./install.sh --skip-models --skip-llama<\/code><\/li>\n<li>Update <code>requirements-lock.txt<\/code> (<code>pip freeze | grep …<\/code>) and the version in <code>pyproject.toml<\/code>/<code>alveus/__init__.py<\/code><\/li>\n<li>Tag and push.<\/li>\n<\/ol>", "headings": [{"id": "setup", "text": "Setup", "level": 2}, {"id": "conventions", "text": "Conventions", "level": 2}, {"id": "repository-map", "text": "Repository map", "level": 2}, {"id": "roadmap-next-items-in-order", "text": "Roadmap (next items, in order)", "level": 2}, {"id": "extension-points-and-ideas", "text": "Extension points and ideas", "level": 2}, {"id": "documentation", "text": "Documentation", "level": 2}, {"id": "release-checklist", "text": "Release checklist", "level": 2}], "source": "docs/development.md"}]</script>
<script>
(function(){
  const DOCS = JSON.parse(document.getElementById('docs-data').textContent);
  const GROUPS = [...new Set(DOCS.map(d=>d.group))].map(g => [g, DOCS.filter(d=>d.group===g).map(d=>d.slug)]);
  const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
  const $ = id => document.getElementById(id);
  const article=$('article'), toc=$('toc'), navlist=$('navlist'), crumb=$('crumb'), pager=$('pager'), source=$('source');
  const search=$('search'), nav=$('docnav'), menuBtn=$('menuBtn');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function buildNav(filter){
    const q=(filter||'').trim().toLowerCase(); let html='', any=false;
    for (const [g, slugs] of GROUPS){
      let items='';
      for (const s of slugs){
        const d=bySlug[s];
        const hits = q ? d.headings.filter(h=>h.text.toLowerCase().includes(q)) : [];
        if (q && !hits.length && !d.title.toLowerCase().includes(q)) continue;
        any=true;
        items += `<a href="#${s}" data-slug="${s}">${esc(d.title)}${hits.slice(0,6).map(h=>`<span class="hit"><a href="#${s}/${h.id}">${esc(h.text)}</a></span>`).join('')}</a>`;
      }
      if (items) html += `<div class="group">${esc(g)}</div>${items}`;
    }
    navlist.innerHTML = any ? html : '<div class="empty">No headings match.</div>';
    markActive();
  }
  function current(){ const slug=location.hash.replace(/^#/,'').split('/')[0]; return bySlug[slug] ? slug : 'readme'; }
  function markActive(){ const s=current(); navlist.querySelectorAll('a[data-slug]').forEach(a=>a.classList.toggle('active', a.dataset.slug===s)); }
  function show(){
    const slug=current(), idx=DOCS.findIndex(d=>d.slug===slug), d=DOCS[idx], sub=location.hash.split('/')[1];
    article.innerHTML = d.html;
    crumb.innerHTML = `<span class="n">${String(idx+1).padStart(2,'0')}</span> · ${esc(d.group)} · ${esc(d.title)}`;
    toc.innerHTML = d.headings.map(h=>`<a href="#${slug}/${h.id}" class="${h.level===3?'h3':''}" data-id="${h.id}">${esc(h.text)}</a>`).join('') || '<span style="color:var(--muted)">—</span>';
    const prev=DOCS[idx-1], next=DOCS[idx+1];
    pager.innerHTML = (prev?`<a class="prev" href="#${prev.slug}"><small>Previous</small><b>${esc(prev.title)}</b></a>`:'<span></span>') + (next?`<a class="next" href="#${next.slug}"><small>Next</small><b>${esc(next.title)}</b></a>`:'');
    source.innerHTML = `Source: <code>${esc(d.source)}</code> — regenerate with <code>python scripts/build_handbook.py</code>`;
    document.title = slug==='readme' ? 'Alveus Handbook' : d.title + ' · Alveus Handbook';
    markActive(); nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false');
    if (sub){ const el=document.getElementById(sub); if (el) el.scrollIntoView({block:'start'}); } else window.scrollTo(0,0);
    observe();
  }
  let io;
  function observe(){
    if (io) io.disconnect();
    const links=[...toc.querySelectorAll('a')]; if(!links.length) return;
    io = new IntersectionObserver(entries => {
      const vis = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
      if (vis) links.forEach(a=>a.classList.toggle('current', a.dataset.id===vis.target.id));
    }, {rootMargin:'-70px 0px -70% 0px'});
    article.querySelectorAll('h2,h3').forEach(h=>io.observe(h));
  }
  search.addEventListener('input', e=>buildNav(e.target.value));
  menuBtn.addEventListener('click', ()=>{ const open=nav.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(open)); });
  window.addEventListener('hashchange', show);
  buildNav(''); show();
})();
</script>
