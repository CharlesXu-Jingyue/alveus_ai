<script type="application/json" id="docs-data">[{"slug": "readme", "title": "Start here", "group": "Orientation", "html": "<h1 id=\"start-here\">Start here<\/h1>\n<p>Browsable offline version: <code>docs/handbook.html<\/code> (open it directly, run <code>alveus handbook<\/code>, or visit <code>/handbook<\/code> in the GUI). Regenerate after editing these files with <code>python scripts/build_handbook.py<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>document<\/th>\n<th>what it covers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"#overview\">overview.md<\/a><\/td>\n<td>What Alveus is, design goals, capabilities at a glance, hardware footprint, glossary<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#architecture\">architecture.md<\/a><\/td>\n<td>Components, data flow, the voice state machine, threading model, code map<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#installation\">installation.md<\/a><\/td>\n<td>Installing on this machine and on a fresh Linux + CUDA machine; models; services; uninstall<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#configuration\">configuration.md<\/a><\/td>\n<td>Every configuration key in <code>config/alveus.yaml<\/code>, override layers, environment variables<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#usage\">usage.md<\/a><\/td>\n<td>Talking to Alveus, example requests, CLI reference, service management, text mode<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#tools\">tools.md<\/a><\/td>\n<td>All 41 built-in MCP tools, the safety model, adding third-party servers, writing your own<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#backends\">backends.md<\/a><\/td>\n<td>LLM / STT / TTS / audio backends, how to swap them, measured performance, adding new ones<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#api\">api.md<\/a><\/td>\n<td>The browser GUI and local HTTP API (streaming chat, confirmations, config, restart)<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#wake-words\">wake-words.md<\/a><\/td>\n<td>Activation modes, pretrained wake words, training custom \"Alveus\" / \"Aurea\" models<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#troubleshooting\">troubleshooting.md<\/a><\/td>\n<td>Known issues and their fixes, diagnostic commands<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#development\">development.md<\/a><\/td>\n<td>Repository conventions, tests, lint, extension points, roadmap ideas<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Quick start: <code>conda activate alveus &amp;&amp; alveus doctor --warm &amp;&amp; alveus chat<\/code>, then say <strong>\"Aurea, …\"<\/strong> with <code>alveus talk<\/code> or the <code>alveus<\/code> systemd service — and open the GUI at http://127.0.0.1:8765/ (<code>alveus ui<\/code>).<\/p>", "headings": [], "source": "docs/README.md"}, {"slug": "overview", "title": "Overview", "group": "Orientation", "html": "<h1 id=\"overview\">Overview<\/h1>\n<h2 id=\"what-alveus-is\">What Alveus is<\/h2>\n<p>Alveus is a personal, \"Jarvis-style\" AI assistant that runs <strong>entirely on one Linux machine\nwith an NVIDIA GPU<\/strong>. You speak to it, it understands, reasons with a local language model,\nacts on your computer through tools, and answers out loud. No audio, text, or data leaves the\nmachine unless a tool you explicitly enabled (web search, page fetch, weather) reaches out to\nthe internet.<\/p>\n<p>It answers to two names. <strong>Alveus<\/strong> is the default; when the configured voice is female (the\ndefault Kokoro voice <code>af_heart<\/code> is), it introduces itself as <strong>Aurea<\/strong>. Both names are always\naccepted, both wake it up, and the persona tells the model never to correct you about which\nname you used.<\/p>\n<h2 id=\"design-goals\">Design goals<\/h2>\n<ol>\n<li><strong>Fully local.<\/strong> LLM inference (llama.cpp), speech-to-text, text-to-speech, voice activity\n   detection and wake-word detection all run on the local GPU/CPU.<\/li>\n<li><strong>Every stage swappable.<\/strong> The LLM, STT engine, TTS engine, audio backend and activation\n   method are each selected in one YAML file. Upgrading the model later means adding a\n   profile, not rewriting code. Any OpenAI-compatible server (vLLM, Ollama, LM Studio, a\n   remote API) is a valid LLM backend.<\/li>\n<li><strong>Real agency, with guard rails.<\/strong> The model calls tools through the Model Context Protocol\n   (MCP): files, shell, GNOME desktop, system status/control, web, and delegation of coding\n   work to opencode. Destructive actions are confirmed by voice before they run.<\/li>\n<li><strong>Portable.<\/strong> <code>install.sh<\/code> reproduces the whole stack on another Linux + CUDA box; nothing\n   in the repo depends on this machine's paths.<\/li>\n<li><strong>Small.<\/strong> ~2,500 lines of Python. Each backend is one short file.<\/li>\n<\/ol>\n<h2 id=\"capabilities-at-a-glance\">Capabilities at a glance<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>area<\/th>\n<th>examples of what you can say<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Conversation<\/td>\n<td>\"Aurea, what's the date?\", \"explain what a Mamba layer is in two sentences\"<\/td>\n<\/tr>\n<tr>\n<td>System<\/td>\n<td>\"what's my GPU temperature?\", \"how much RAM is free?\", \"what's using the CPU?\", \"is the internet up?\"<\/td>\n<\/tr>\n<tr>\n<td>Files &amp; shell<\/td>\n<td>\"list the files in my repo folder\", \"find PDFs in Downloads\", \"search my notes for 'hypothalamus'\", \"run <code>df -h<\/code>\"<\/td>\n<\/tr>\n<tr>\n<td>Desktop<\/td>\n<td>\"open Firefox\", \"set the volume to 30 percent\", \"mute\", \"pause the music\", \"take a screenshot\", \"dark mode on\", \"do not disturb\", \"copy this to the clipboard: …\", \"lock the screen\"<\/td>\n<\/tr>\n<tr>\n<td>Web<\/td>\n<td>\"what's the weather in Boston?\", \"search the web for the latest llama.cpp release\", \"summarize this page: …\"<\/td>\n<\/tr>\n<tr>\n<td>Coding<\/td>\n<td>\"in ~/local/repo/foo, add a README explaining the data layout\" (delegated to opencode), \"what does SAEM/main.py do?\"<\/td>\n<\/tr>\n<tr>\n<td>Power / services<\/td>\n<td>\"suspend the computer\" (asks first), \"restart my alveus-llm service\" (asks first)<\/td>\n<\/tr>\n<tr>\n<td>Follow-ups<\/td>\n<td>For 8 s after a reply you can continue without saying the name<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>See <a href=\"#usage\">usage.md<\/a> for more phrasing and <a href=\"#tools\">tools.md<\/a> for the exact tool list.<\/p>\n<h2 id=\"hardware-footprint-measured-on-this-machine-rtx-4090-i9-13900k-62-gb-ram\">Hardware footprint (measured on this machine: RTX 4090, i9-13900K, 62 GB RAM)<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>component<\/th>\n<th>VRAM<\/th>\n<th>load time<\/th>\n<th>latency<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bonsai-27B 1-bit (llama-server, 32k ctx, flash-attn)<\/td>\n<td>~6.5 GB<\/td>\n<td>~20 s<\/td>\n<td>~60–95 tok/s generation, ~190 tok/s prompt<\/td>\n<\/tr>\n<tr>\n<td>faster-whisper large-v3-turbo (fp16)<\/td>\n<td>~1.5 GB<\/td>\n<td>~30 s first time (download), ~5 s after<\/td>\n<td>0.06–0.2 s per utterance<\/td>\n<\/tr>\n<tr>\n<td>Kokoro-82M<\/td>\n<td>~0.6 GB<\/td>\n<td>~8 s<\/td>\n<td>~0.3× real time (1.4 s for 3.4 s of speech, incl. warm-up)<\/td>\n<\/tr>\n<tr>\n<td>Silero VAD<\/td>\n<td>CPU<\/td>\n<td>&lt;1 s<\/td>\n<td>~1 ms per 32 ms frame<\/td>\n<\/tr>\n<tr>\n<td>openWakeWord (optional)<\/td>\n<td>CPU<\/td>\n<td>&lt;1 s<\/td>\n<td>~5 ms per 80 ms chunk<\/td>\n<\/tr>\n<tr>\n<td>Parakeet TDT 0.6B v3 (optional)<\/td>\n<td>~1 GB / CPU<\/td>\n<td>~35 s first time<\/td>\n<td>~0.3 s per utterance<\/td>\n<\/tr>\n<tr>\n<td>Chatterbox Turbo (optional)<\/td>\n<td>3–4 GB<\/td>\n<td>~20 s<\/td>\n<td>~0.15 s to first audio<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Total with defaults: about 10 GB of the 24 GB VRAM while the assistant is running, leaving room\nfor the Ternary model (7.2 GB weights) or other GPU work.<\/p>\n<h2 id=\"glossary\">Glossary<\/h2>\n<ul>\n<li><strong>Profile<\/strong> – a named LLM configuration under <code>llm.profiles<\/code> (endpoint, model id, sampling, how to launch a server for it).<\/li>\n<li><strong>Backend<\/strong> – a Python class implementing one of the small protocols in <code>alveus/llm|stt|tts/base.py<\/code>.<\/li>\n<li><strong>MCP<\/strong> – Model Context Protocol: a standard for exposing tools to LLM agents. Each Alveus tool group is an MCP server process.<\/li>\n<li><strong>ToolHub<\/strong> – the MCP client inside Alveus that connects all servers and presents their tools to the model as <code>server__tool<\/code>.<\/li>\n<li><strong>Activation<\/strong> – how a turn starts: saying a name, an openWakeWord phrase, the hotkey, or the HTTP trigger.<\/li>\n<li><strong>Follow-up window<\/strong> – a period after an answer in which speech is accepted without a name.<\/li>\n<li><strong>Barge-in<\/strong> – interrupting the assistant while it is speaking.<\/li>\n<\/ul>", "headings": [{"id": "what-alveus-is", "text": "What Alveus is", "level": 2}, {"id": "design-goals", "text": "Design goals", "level": 2}, {"id": "capabilities-at-a-glance", "text": "Capabilities at a glance", "level": 2}, {"id": "hardware-footprint-measured-on-this-machine-rtx-4090-i9-13900k-62-gb-ram", "text": "Hardware footprint (measured on this machine: RTX 4090, i9-13900K, 62 GB RAM)", "level": 2}, {"id": "glossary", "text": "Glossary", "level": 2}], "source": "docs/overview.md"}, {"slug": "architecture", "title": "Architecture", "group": "Orientation", "html": "<h1 id=\"architecture\">Architecture<\/h1>\n<h2 id=\"component-diagram\">Component diagram<\/h2>\n<pre><code>                     ┌──────────────────────────── alveus talk (one process) ────────────────────────────┐\n                     │                                                                                   │\n PipeWire            │  AudioIn ──► 32 ms frames ──► Silero VAD ──┐                                      │\n pw-record ─────────►│   (thread)                                 ├─► activation logic (names / oww /    │\n                     │                        openWakeWord ───────┘   hotkey / follow-up window)          │\n pynput hotkey ─────►│  Trigger flag                                        │                             │\n POST /trigger ─────►│                                                      ▼                             │\n                     │                                     utterance (float32 16 kHz)                    │\n                     │                                                      │                             │\n                     │                                             STT backend (thread pool)             │\n                     │                                                      │ text                        │\n                     │                                              NameMatcher (fuzzy)                  │\n                     │                                                      │ command                     │\n                     │   ┌──────────────────────────── Agent.run() ─────────┴──────────────────────┐     │\n                     │   │  system prompt + history ──► LLMBackend.stream() ──► events              │     │\n                     │   │        ▲                        (httpx SSE)          │                   │     │\n                     │   │        │ tool results                                │ tool_calls        │     │\n                     │   │   ToolHub.call() ◄────────────────────────────────────┘                   │     │\n                     │   │        │  stdio / HTTP (MCP)                                              │     │\n                     │   └────────┼──────────────────────────────────────────────────────────────────┘     │\n                     │            │                            content deltas                              │\n                     │            │                                 │                                      │\n                     │            │                        SentenceBuffer ──► speakable() ──► TTS backend  │\n                     │            │                                                               │        │\n PipeWire            │            │                                          AudioOut queue (thread)       │\n pw-play  ◄──────────┤            │                                                                        │\n                     │   FastAPI (uvicorn, :8765) ── /chat /speak /transcribe /trigger /stop /tools        │\n                     └────────────┼────────────────────────────────────────────────────────────────────────┘\n                                  ▼\n        ┌───────────┐ ┌──────────┐ ┌──────────┐ ┌──────────┐ ┌──────────────────────┐\n        │ files     │ │ desktop  │ │ system   │ │ web      │ │ coder → opencode run │   MCP server processes\n        └───────────┘ └──────────┘ └──────────┘ └──────────┘ └──────────────────────┘\n                                                                        │\n                                                    llama-server (:8080, systemd alveus-llm) ◄── LLM HTTP\n<\/code><\/pre>\n<p>Two long-running processes matter: <strong><code>alveus-llm<\/code><\/strong> (llama-server holding the model in VRAM) and\n<strong><code>alveus<\/code><\/strong> (<code>alveus talk<\/code>: audio loop, agent, speech models, API, and the five MCP child processes\nit spawns over stdio).<\/p>\n<h2 id=\"packages\">Packages<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>path<\/th>\n<th>responsibility<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>alveus/config.py<\/code><\/td>\n<td>Layered YAML loading, <code>${VAR}<\/code>/<code>~<\/code> expansion, <code>DotDict<\/code>, <code>llm_profile()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>alveus/llm/<\/code><\/td>\n<td><code>LLMBackend<\/code> protocol + <code>OpenAICompatLLM<\/code> (SSE streaming, tool-call accumulation, reasoning separation)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/stt/<\/code><\/td>\n<td><code>STTBackend<\/code> protocol + faster-whisper, Parakeet (onnx-asr), OpenAI-HTTP<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/tts/<\/code><\/td>\n<td><code>TTSBackend<\/code> protocol + Kokoro, Chatterbox, OpenAI-HTTP<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/audio/backend.py<\/code><\/td>\n<td><code>AudioIn<\/code>/<code>AudioOut<\/code> with PipeWire (subprocess) and sounddevice implementations<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/audio/vad.py<\/code><\/td>\n<td>Silero VAD on 512-sample frames<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/audio/wakeword.py<\/code><\/td>\n<td>openWakeWord wrapper (ONNX runtime, 1280-sample chunks)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/audio/names.py<\/code><\/td>\n<td><code>NameMatcher<\/code>: fuzzy detection of Alveus/Aurea in a transcript<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/audio/hotkey.py<\/code><\/td>\n<td>pynput global hotkey, <code>Trigger<\/code> flag<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/audio/chimes.py<\/code><\/td>\n<td>synthesized listen/error chimes<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/agent/mcp_client.py<\/code><\/td>\n<td><code>ToolHub<\/code>: connects MCP servers, namespaces tools, executes calls<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/agent/loop.py<\/code><\/td>\n<td><code>Agent<\/code>: system prompt, history, tool loop, destructive-action gate, <code>active_names()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>alveus/agent/sentences.py<\/code><\/td>\n<td><code>SentenceBuffer<\/code> for streaming TTS, <code>speakable()<\/code> markdown stripper<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/voice.py<\/code><\/td>\n<td><code>VoiceAssistant<\/code>: the state machine tying everything together<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/api.py<\/code><\/td>\n<td>FastAPI app + <code>HeadlessAssistant<\/code> (agent without microphone)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus/cli.py<\/code><\/td>\n<td>Typer CLI (<code>alveus …<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>mcp_servers/<\/code><\/td>\n<td>Built-in MCP servers (one file each) + <code>common.py<\/code> helpers/compat<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"data-flow-of-one-voice-turn\">Data flow of one voice turn<\/h2>\n<ol>\n<li><strong>Capture.<\/strong> <code>PipeWireIn<\/code> runs <code>pw-record --rate 16000 --channels 1 --format s16 -<\/code> and a reader\n   thread slices stdout into 512-sample float32 frames (32 ms) on a bounded queue (oldest dropped\n   if the consumer stalls).<\/li>\n<li><strong>Activation.<\/strong> The main loop pulls frames. Each frame is scored by Silero VAD and, in <code>oww<\/code>\n   or <code>both<\/code> mode, by openWakeWord. The <code>Trigger<\/code> flag is set by the hotkey thread or the API.<\/li>\n<li><strong>Segment recording.<\/strong> When speech is detected (or the trigger fires), <code>_record_utterance<\/code>\n   collects frames until <code>end_silence_ms<\/code> of non-speech, <code>max_utterance_s<\/code>, or a second hotkey\n   press. Segments shorter than <code>min_speech_ms<\/code> of speech are discarded.<\/li>\n<li><strong>Transcription.<\/strong> The segment goes to <code>STTBackend.transcribe()<\/code> in a worker thread. Known\n   Whisper hallucinations on near-silence (\"Thank you.\") are dropped.<\/li>\n<li><strong>Name matching<\/strong> (names mode). <code>NameMatcher.match()<\/code> checks the first two words (and their\n   concatenation) and the last word against the names and aliases with <code>difflib<\/code> similarity\n   ≥ 0.78. Leading fillers (\"hey\", \"ok\", \"um\") are stripped. Result: <em>(addressed, remaining\n   command)<\/em>. Not addressed → the segment is ignored. Addressed with no command → chime and\n   record the next utterance. Addressed with a command → proceed directly.<\/li>\n<li><strong>Agent loop.<\/strong> <code>Agent.run(text)<\/code> appends the user message, then repeats up to\n   <code>llm.max_tool_rounds<\/code> times: build <code>[system] + history<\/code>, stream the LLM, forward <code>content<\/code>\n   deltas, collect <code>tool_call<\/code>s. If tool calls were made, each is executed via <code>ToolHub<\/code>\n   (after the destructive-action gate), results are appended as <code>role: tool<\/code> messages, and the\n   loop continues. When the model answers without tools, the turn ends.<\/li>\n<li><strong>Speech output.<\/strong> <code>content<\/code> deltas feed <code>SentenceBuffer<\/code>; each complete sentence is\n   markdown-stripped by <code>speakable()<\/code>, synthesized by the TTS backend in a worker thread, and\n   pushed to <code>AudioOut<\/code>, whose thread streams float32 PCM to <code>pw-play<\/code>. Because synthesis of\n   sentence <em>n+1<\/em> overlaps playback of sentence <em>n<\/em> and generation of the rest, the first words\n   are heard while the model is still writing.<\/li>\n<li><strong>Follow-up.<\/strong> After playback the loop opens a <code>follow_up_window_s<\/code> window during which any\n   speech is treated as addressed.<\/li>\n<\/ol>\n<h2 id=\"the-voice-state-machine\">The voice state machine<\/h2>\n<pre><code>            ┌────────────────────────────────────────────────────────────────┐\n            │                                                                │\n            ▼    name+command / trigger / follow-up speech                   │\n         IDLE ────────────────────────────────────────────► THINKING ──► SPEAKING\n            │                                                  ▲               │\n            │ name only / hotkey / oww phrase                   │ transcript    │ playback done\n            ▼                                                  │               │\n        LISTENING (chime, record until silence) ───────────────┘               │\n            │ nothing heard within 6 s                                         │\n            └──────────────────────────────► IDLE ◄────────────────────────────┘\n                                             (follow-up window open for N s)\n<\/code><\/pre>\n<p><code>on_state<\/code> callbacks let the CLI print state changes; the API's <code>/health<\/code> reports the current state.<\/p>\n<h2 id=\"concurrency-model\">Concurrency model<\/h2>\n<ul>\n<li>The main coroutine runs the state machine on asyncio.<\/li>\n<li>Blocking work (audio reads, STT, TTS, VAD reset) runs in a 3-worker <code>ThreadPoolExecutor<\/code>.<\/li>\n<li><code>AudioIn<\/code> and <code>AudioOut<\/code> each own one background thread plus a <code>pw-record<\/code>/<code>pw-play<\/code> child.<\/li>\n<li>LLM streaming is async (httpx). MCP servers are child processes; <code>ToolHub<\/code> talks to them\n  through the <code>mcp<\/code> client library's async stdio transport, all inside one <code>AsyncExitStack<\/code>.<\/li>\n<li>The FastAPI server runs in the same event loop (uvicorn <code>Server.serve()<\/code>), so <code>/chat<\/code> with\n  <code>speak: true<\/code> shares the loaded models and the speaker queue with the voice loop.<\/li>\n<\/ul>\n<h2 id=\"prompting-and-model-interface\">Prompting and model interface<\/h2>\n<ul>\n<li>The system prompt is <code>config/persona.md<\/code> rendered with <code>{name}<\/code>, <code>{other_name}<\/code>, <code>{voice_gender}<\/code>,\n  <code>{user_name}<\/code>, <code>{date}<\/code>, <code>{hostname}<\/code>, <code>{os}<\/code>, plus a line listing available tool groups.<\/li>\n<li>Tools are presented in OpenAI function-calling format, names namespaced <code>server__tool<\/code>\n  (<code>system__gpu_status<\/code>). llama-server's <code>--jinja<\/code> renders Bonsai's Qwen3.6 chat template, which\n  natively supports tools and thinking. <code>--reasoning-format deepseek<\/code> moves thinking into\n  <code>reasoning_content<\/code>, which Alveus never speaks.<\/li>\n<li>History keeps the last <code>assistant.max_history_turns<\/code> user turns (and everything after them,\n  including tool messages).<\/li>\n<li><code>thinking: true|false<\/code> on a profile forces <code>chat_template_kwargs.enable_thinking<\/code>; unset\n  keeps the model default (thinking on for Bonsai). Thinking costs ~1 s per turn but improves\n  tool selection.<\/li>\n<\/ul>\n<h2 id=\"safety-model\">Safety model<\/h2>\n<ul>\n<li><strong>Destructive gate.<\/strong> A tool call is confirmed before execution if the tool carries\n  <code>destructive_hint<\/code> (delete_path, move_path, close_window, kill_process, control_service,\n  power) or if a <code>run_command<\/code> command matches <code>_DESTRUCTIVE_SHELL<\/code> in <code>agent/loop.py<\/code>\n  (<code>rm<\/code>, <code>kill<\/code>, <code>shutdown<\/code>, <code>mkfs<\/code>, <code>dd<\/code>, <code>git push --force<\/code>, <code>chmod -R<\/code>, …). In voice mode the\n  assistant asks aloud and listens for yes/no; in <code>alveus chat<\/code> it prompts on the terminal;\n  through the bare <code>/chat<\/code> API there is no confirmer, so destructive calls are refused.\n  Disable with <code>tools.confirm_destructive: false<\/code>.<\/li>\n<li><strong>Filesystem scope.<\/strong> The files server only touches paths under <code>ALVEUS_FS_ROOTS<\/code>\n  (default <code>~<\/code>).<\/li>\n<li><strong>Network exposure.<\/strong> llama-server and the API bind to 127.0.0.1. Nothing is exposed on the LAN\n  unless you change <code>api.host<\/code> or the server args.<\/li>\n<li><strong>Prompt injection.<\/strong> Web page content and file contents returned by tools are model input.\n  The persona asks for confirmation before irreversible actions, and the gate enforces it for\n  the risky tool set regardless of what the model \"decides\".<\/li>\n<\/ul>\n<h2 id=\"portability-decisions\">Portability decisions<\/h2>\n<ul>\n<li>All machine-specific paths live in <code>config/local.yaml<\/code> under <code>env:<\/code> (<code>ALVEUS_MODELS<\/code>,\n  <code>ALVEUS_LLAMA_SERVER<\/code>), written by <code>install.sh<\/code>. The repo root is discovered from\n  <code>alveus/config.py<\/code>'s location, so the checkout can live anywhere.<\/li>\n<li>systemd unit templates (<code>systemd/*.service.in<\/code>) are rendered per machine by\n  <code>scripts/install_services.sh<\/code>, substituting the Python interpreter and paths.<\/li>\n<li>Audio uses PipeWire's CLI tools rather than PortAudio because conda-forge's PortAudio cannot\n  open ALSA devices that PipeWire already holds; PortAudio remains as the fallback for\n  non-PipeWire systems.<\/li>\n<\/ul>", "headings": [{"id": "component-diagram", "text": "Component diagram", "level": 2}, {"id": "packages", "text": "Packages", "level": 2}, {"id": "data-flow-of-one-voice-turn", "text": "Data flow of one voice turn", "level": 2}, {"id": "the-voice-state-machine", "text": "The voice state machine", "level": 2}, {"id": "concurrency-model", "text": "Concurrency model", "level": 2}, {"id": "prompting-and-model-interface", "text": "Prompting and model interface", "level": 2}, {"id": "safety-model", "text": "Safety model", "level": 2}, {"id": "portability-decisions", "text": "Portability decisions", "level": 2}], "source": "docs/architecture.md"}, {"slug": "installation", "title": "Installation", "group": "Set up", "html": "<h1 id=\"installation\">Installation<\/h1>\n<h2 id=\"requirements\">Requirements<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>requirement<\/th>\n<th>notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Linux (tested: Ubuntu 24.04, GNOME on X11)<\/td>\n<td>Wayland works except global hotkey / xdotool typing (use <code>alveus trigger<\/code> from a DE shortcut)<\/td>\n<\/tr>\n<tr>\n<td>NVIDIA GPU with ≥ 12 GB VRAM, driver ≥ 550<\/td>\n<td>Bonsai 1-bit + speech models need ~10 GB; 24 GB is comfortable<\/td>\n<\/tr>\n<tr>\n<td>CUDA toolkit (<code>nvcc<\/code>) 12.x, cmake, gcc<\/td>\n<td>only to build llama.cpp; PyTorch wheels bring their own CUDA runtime<\/td>\n<\/tr>\n<tr>\n<td>Miniconda/Anaconda (or plain <code>python3 -m venv<\/code> with <code>--venv<\/code>)<\/td>\n<td>Python 3.12<\/td>\n<\/tr>\n<tr>\n<td>PipeWire (<code>pw-record<\/code>, <code>pw-play<\/code>, <code>wpctl<\/code>)<\/td>\n<td>default on modern desktops; otherwise PortAudio via <code>libportaudio2<\/code><\/td>\n<\/tr>\n<tr>\n<td>~15 GB disk<\/td>\n<td>3.8 GB Bonsai 1-bit, 7.2 GB Ternary (optional), ~3 GB speech models, ~8 GB Python env<\/td>\n<\/tr>\n<tr>\n<td>Internet for the initial download<\/td>\n<td>Hugging Face (models), PyPI, GitHub (llama.cpp fork)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Optional but recommended for full desktop control: <code>sudo apt install xdotool wmctrl xclip playerctl<\/code>.<\/p>\n<h2 id=\"one-command-install-on-a-new-machine\">One-command install on a new machine<\/h2>\n<pre><code class=\"language-bash\">git clone &lt;your remote&gt; alveus-ai\ncd alveus-ai\n./install.sh --ternary --with-chatterbox --services\n<\/code><\/pre>\n<p>What it does, in order (each step is also a standalone script under <code>scripts/<\/code>):<\/p>\n<ol>\n<li><strong>System check<\/strong> – NVIDIA driver, build tools, which optional desktop binaries are missing.<\/li>\n<li><strong>Python env<\/strong> – <code>conda create -n alveus -c conda-forge python=3.12 portaudio ffmpeg<\/code>, then\n   <code>scripts/pip_install_env.sh<\/code>: PyTorch (CUDA wheels), the package in editable mode with the\n   selected extras, openWakeWord without its obsolete <code>tflite-runtime<\/code> pin, the GPU-only build\n   of onnxruntime, Parakeet, and (with <code>--with-chatterbox<\/code>) Chatterbox.<\/li>\n<li><strong>llama.cpp<\/strong> – <code>scripts/build_llama.sh<\/code> clones <code>PrismML-Eng/llama.cpp<\/code> (needed for Bonsai's\n   <code>Q1_0<\/code>/<code>PQ2_0<\/code> kernels) into <code>~/local/lib/llama.cpp-bonsai<\/code> and builds <code>llama-server<\/code> and\n   <code>llama-cli<\/code> with <code>-DGGML_CUDA=ON<\/code> for the GPU's compute capability (auto-detected).<\/li>\n<li><strong>Models<\/strong> – <code>scripts/download_models.sh<\/code>: Bonsai-27B 1-bit (and Ternary with <code>--ternary<\/code>) into\n   <code>~/local/model/<\/code>, plus pre-caching Whisper, Kokoro and the <code>hey_jarvis<\/code> wake word.\n   Only the needed GGUF files are fetched (the repos also contain 54 GB F16 files).<\/li>\n<li><strong>Config<\/strong> – writes <code>config/local.yaml<\/code> with the model dir, llama-server path, and your name.<\/li>\n<li><strong>Services<\/strong> (<code>--services<\/code>) – renders and enables <code>alveus-llm.service<\/code> and <code>alveus.service<\/code>\n   as systemd user units.<\/li>\n<\/ol>\n<p>Flags: <code>--env NAME<\/code>, <code>--venv<\/code>, <code>--models DIR<\/code>, <code>--lib DIR<\/code>, <code>--ternary<\/code>, <code>--no-1bit<\/code>,\n<code>--with-chatterbox<\/code>, <code>--no-parakeet<\/code>, <code>--services<\/code>, <code>--skip-llama<\/code>, <code>--skip-models<\/code>.<\/p>\n<h2 id=\"opening-the-gui\">Opening the GUI<\/h2>\n<p>Once the <code>alveus<\/code> service (or <code>alveus talk<\/code> / <code>alveus api<\/code>) is running, the browser GUI is at\n<code>http://127.0.0.1:8765/<\/code> — <code>alveus ui<\/code> opens it. It is bound to the local machine; for a remote\nmachine use <code>ssh -L 8765:127.0.0.1:8765 &lt;host&gt;<\/code> and browse to the same address.<\/p>\n<h2 id=\"verifying\">Verifying<\/h2>\n<pre><code class=\"language-bash\">conda activate alveus\nalveus doctor --warm      # GPU, torch CUDA, audio backend, weights, llama-server, endpoint, every dep, model loads\nalveus tools              # all MCP servers start and list their tools\nalveus llm test           # streams a reply from the LLM\nalveus tts say &quot;Hello&quot;    # speaker works\nalveus stt test           # microphone works (speak for 5 s)\n<\/code><\/pre>\n<h2 id=\"directory-layout-on-this-machine\">Directory layout on this machine<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>path<\/th>\n<th>contents<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>~/local/repo/alveus-ai<\/code><\/td>\n<td>this repository (<code>ALVEUS_HOME<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>~/local/model/bonsai/Bonsai-27B-Q1_0.gguf<\/code><\/td>\n<td>1-bit weights (3.8 GB)<\/td>\n<\/tr>\n<tr>\n<td><code>~/local/model/bonsai-ternary/Ternary-Bonsai-27B-PQ2_0.gguf<\/code><\/td>\n<td>ternary weights (7.2 GB)<\/td>\n<\/tr>\n<tr>\n<td><code>~/local/model/wakeword/<\/code><\/td>\n<td>custom openWakeWord <code>.onnx<\/code> models (empty until you train one)<\/td>\n<\/tr>\n<tr>\n<td><code>~/local/lib/llama.cpp-bonsai/build/bin/llama-server<\/code><\/td>\n<td>inference server binary<\/td>\n<\/tr>\n<tr>\n<td><code>~/miniconda3/envs/alveus<\/code><\/td>\n<td>Python environment<\/td>\n<\/tr>\n<tr>\n<td><code>~/.cache/huggingface/hub<\/code><\/td>\n<td>faster-whisper, Kokoro, Parakeet, Chatterbox weights<\/td>\n<\/tr>\n<tr>\n<td><code>~/miniconda3/envs/alveus/lib/python3.12/site-packages/openwakeword/resources/models<\/code><\/td>\n<td>pretrained wake-word models<\/td>\n<\/tr>\n<tr>\n<td><code>~/.config/systemd/user/alveus*.service<\/code><\/td>\n<td>rendered service units<\/td>\n<\/tr>\n<tr>\n<td><code>~/.config/opencode/opencode.jsonc<\/code><\/td>\n<td>opencode provider <code>bonsai<\/code> pointing at llama-server<\/td>\n<\/tr>\n<tr>\n<td><code>~/local/repo/alveus-ai/logs/alveus.log<\/code><\/td>\n<td>rotating text log (also <code>journalctl --user -u alveus<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"services\">Services<\/h2>\n<p>Both units are enabled and start automatically at login, so a reboot needs no manual steps\n(models take about a minute to load).<\/p>\n<pre><code class=\"language-bash\">systemctl --user stop alveus alveus-llm        # stop everything\nsystemctl --user start alveus-llm alveus       # start everything\nsystemctl --user status alveus-llm alveus      # state\nsystemctl --user restart alveus                # after config changes\nsystemctl --user disable alveus alveus-llm     # stop autostart\njournalctl --user -u alveus -f                 # live log\n<\/code><\/pre>\n<p><code>alveus.service<\/code> runs <code>alveus talk<\/code>; it does not wait for the LLM, so the GUI is reachable even\nwhile <code>alveus-llm<\/code> is still loading or failing (the header shows the LLM state). It inherits <code>DISPLAY<\/code>/<code>XAUTHORITY<\/code> from the systemd user environment, which GDM\npopulates at login; if the hotkey reports no display, run\n<code>systemctl --user import-environment DISPLAY XAUTHORITY<\/code> and restart the unit.<\/p>\n<h2 id=\"updating\">Updating<\/h2>\n<pre><code class=\"language-bash\">cd ~/local/repo/alveus-ai &amp;&amp; git pull\nconda activate alveus &amp;&amp; scripts/pip_install_env.sh --with-chatterbox   # if deps changed\nscripts/install_services.sh --start                                      # re-render units if they changed\n<\/code><\/pre>\n<p><code>requirements-lock.txt<\/code> records the exact versions that were verified together on 2026-09-04.<\/p>\n<h2 id=\"uninstall\">Uninstall<\/h2>\n<pre><code class=\"language-bash\">systemctl --user disable --now alveus alveus-llm &amp;&amp; rm ~/.config/systemd/user/alveus*.service\nconda env remove -n alveus\nrm -rf ~/local/repo/alveus-ai ~/local/lib/llama.cpp-bonsai\nrm -rf ~/local/model/bonsai ~/local/model/bonsai-ternary ~/local/model/wakeword   # weights\n<\/code><\/pre>", "headings": [{"id": "requirements", "text": "Requirements", "level": 2}, {"id": "one-command-install-on-a-new-machine", "text": "One-command install on a new machine", "level": 2}, {"id": "opening-the-gui", "text": "Opening the GUI", "level": 2}, {"id": "verifying", "text": "Verifying", "level": 2}, {"id": "directory-layout-on-this-machine", "text": "Directory layout on this machine", "level": 2}, {"id": "services", "text": "Services", "level": 2}, {"id": "updating", "text": "Updating", "level": 2}, {"id": "uninstall", "text": "Uninstall", "level": 2}], "source": "docs/installation.md"}, {"slug": "configuration", "title": "Configuration", "group": "Set up", "html": "<h1 id=\"configuration-reference\">Configuration reference<\/h1>\n<h2 id=\"layers\">Layers<\/h2>\n<p>Settings are merged in this order (later wins):<\/p>\n<ol>\n<li><code>config/alveus.yaml<\/code> – defaults, versioned.<\/li>\n<li><code>config/local.yaml<\/code> – this machine only, git-ignored, written by <code>install.sh<\/code>.<\/li>\n<li><code>$ALVEUS_CONFIG<\/code> – optional extra file path.<\/li>\n<li>Environment shortcuts: <code>ALVEUS_LLM_PROFILE<\/code>, <code>ALVEUS_STT_BACKEND<\/code>, <code>ALVEUS_TTS_BACKEND<\/code>.<\/li>\n<\/ol>\n<p>Every string value is expanded: <code>~<\/code> → home, <code>${VAR}<\/code> → a variable. Variables come from the\nprocess environment or from the YAML <code>env:<\/code> block (environment wins). Always defined:\n<code>ALVEUS_HOME<\/code> (repo root), <code>ALVEUS_MODELS<\/code> (default <code>${ALVEUS_HOME}/models<\/code>),\n<code>ALVEUS_LLAMA_SERVER<\/code> (default <code>llama-server<\/code> on PATH).<\/p>\n<p>Only put in <code>local.yaml<\/code> what differs from the defaults, e.g.:<\/p>\n<pre><code class=\"language-yaml\">env:\n  ALVEUS_MODELS: ~/local/model\n  ALVEUS_LLAMA_SERVER: ~/local/lib/llama.cpp-bonsai/build/bin/llama-server\nassistant:\n  user_name: Charles\naudio:\n  backend: pipewire\n<\/code><\/pre>\n<p>Changes take effect on the next start (<code>systemctl --user restart alveus<\/code>).<\/p>\n<h2 id=\"assistant\"><code>assistant<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>name<\/code><\/td>\n<td><code>Alveus<\/code><\/td>\n<td>name used with a male/neutral voice; always accepted as a wake name<\/td>\n<\/tr>\n<tr>\n<td><code>female_name<\/code><\/td>\n<td><code>Aurea<\/code><\/td>\n<td>name used when the voice is female (see <code>tts.voice_gender<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>user_name<\/code><\/td>\n<td><code>Charles<\/code><\/td>\n<td>how the assistant addresses you; injected into the persona<\/td>\n<\/tr>\n<tr>\n<td><code>language<\/code><\/td>\n<td><code>en<\/code><\/td>\n<td>informational (STT language is set per backend)<\/td>\n<\/tr>\n<tr>\n<td><code>persona_file<\/code><\/td>\n<td><code>${ALVEUS_HOME}/config/persona.md<\/code><\/td>\n<td>system prompt template; placeholders <code>{name} {other_name} {voice_gender} {user_name} {date} {hostname} {os}<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>max_history_turns<\/code><\/td>\n<td><code>30<\/code><\/td>\n<td>user turns kept in the conversation<\/td>\n<\/tr>\n<tr>\n<td><code>streaming_tts<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td>speak sentence by sentence while generating (voice loop and GUI \"speak replies\" alike; synthesis of the next sentence overlaps playback); <code>false<\/code> waits for the full reply. The journal logs <code>speech: … first audio after N s<\/code> per reply<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"llm\"><code>llm<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>profile<\/code><\/td>\n<td><code>bonsai-1bit<\/code><\/td>\n<td>active profile (override: <code>ALVEUS_LLM_PROFILE<\/code>, <code>alveus talk --profile<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>temperature<\/code>, <code>top_p<\/code>, <code>max_tokens<\/code><\/td>\n<td><code>0.7<\/code>, <code>0.95<\/code>, <code>4096<\/code><\/td>\n<td>request defaults, overridable per profile<\/td>\n<\/tr>\n<tr>\n<td><code>max_tool_rounds<\/code><\/td>\n<td><code>12<\/code><\/td>\n<td>maximum LLM↔tool iterations in one turn<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.backend<\/code><\/td>\n<td><code>openai<\/code><\/td>\n<td>only OpenAI-compatible is implemented (aliases: <code>llama_server<\/code>, <code>vllm<\/code>, <code>ollama<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.base_url<\/code><\/td>\n<td><\/td>\n<td>e.g. <code>http://127.0.0.1:8080/v1<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.api_key<\/code><\/td>\n<td><code>local<\/code><\/td>\n<td>sent as Bearer token<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.model<\/code><\/td>\n<td><\/td>\n<td>must equal an id in <code>GET /v1/models<\/code> (llama-server: set with <code>--alias<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.reasoning<\/code><\/td>\n<td><code>false<\/code><\/td>\n<td>model emits <code>reasoning_content<\/code> (informational)<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.thinking<\/code><\/td>\n<td>unset<\/td>\n<td><code>true<\/code>/<code>false<\/code> forces <code>chat_template_kwargs.enable_thinking<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.extra_body<\/code><\/td>\n<td><code>{}<\/code><\/td>\n<td>merged into the request JSON (<code>top_k<\/code>, <code>min_p<\/code>, <code>repetition_penalty<\/code>, …)<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.serve.command<\/code><\/td>\n<td><\/td>\n<td>server binary for <code>alveus llm serve<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.serve.model_path<\/code><\/td>\n<td><\/td>\n<td>GGUF path (checked by <code>doctor<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>profiles.&lt;name&gt;.serve.args<\/code><\/td>\n<td><\/td>\n<td>extra llama-server args; <code>--host/--port/-m/--alias<\/code> are added automatically<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Shipped profiles: <code>bonsai-1bit<\/code> (default) and <code>bonsai-ternary<\/code>. Both serve on port 8080, so only\none runs at a time; switch with <code>llm.profile<\/code> and restart <code>alveus-llm<\/code>.<\/p>\n<p>llama-server flags used and why: <code>-ngl 99<\/code> all layers on GPU; <code>-c 32768<\/code> context (raise up to\n262144 if you need long documents, VRAM permitting); <code>--jinja<\/code> real chat template (required for\ntool calling); <code>--reasoning-format deepseek<\/code> separates thinking; <code>-fa on<\/code> flash attention;\nsampling <code>--temp 0.7 --top-p 0.95 --top-k 20<\/code> as recommended by the model card.<\/p>\n<h2 id=\"stt\"><code>stt<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>backend<\/code><\/td>\n<td><code>faster_whisper<\/code><\/td>\n<td><code>faster_whisper<\/code> | <code>parakeet<\/code> | <code>openai_http<\/code> (override: <code>ALVEUS_STT_BACKEND<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>device<\/code><\/td>\n<td><code>cuda<\/code><\/td>\n<td><code>cuda<\/code> or <code>cpu<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>faster_whisper.model<\/code><\/td>\n<td><code>large-v3-turbo<\/code><\/td>\n<td>any faster-whisper model id or local CTranslate2 dir (<code>distil-large-v3<\/code>, <code>medium<\/code>, <code>small<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>faster_whisper.compute_type<\/code><\/td>\n<td><code>float16<\/code><\/td>\n<td><code>int8_float16<\/code> halves VRAM<\/td>\n<\/tr>\n<tr>\n<td><code>faster_whisper.beam_size<\/code><\/td>\n<td><code>1<\/code><\/td>\n<td>greedy is fastest; 5 for tougher audio<\/td>\n<\/tr>\n<tr>\n<td><code>faster_whisper.language<\/code><\/td>\n<td><code>en<\/code><\/td>\n<td><code>null<\/code> = auto-detect (slower, needed for multilingual)<\/td>\n<\/tr>\n<tr>\n<td><code>parakeet.model<\/code><\/td>\n<td><code>nemo-parakeet-tdt-0.6b-v3<\/code><\/td>\n<td>onnx-asr model id<\/td>\n<\/tr>\n<tr>\n<td><code>openai_http.base_url<\/code>, <code>.model<\/code>, <code>.language<\/code><\/td>\n<td><\/td>\n<td>any <code>/v1/audio/transcriptions<\/code> server<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"tts\"><code>tts<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>backend<\/code><\/td>\n<td><code>kokoro<\/code><\/td>\n<td><code>kokoro<\/code> | <code>chatterbox<\/code> | <code>openai_http<\/code> (override: <code>ALVEUS_TTS_BACKEND<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>device<\/code><\/td>\n<td><code>cuda<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>voice_gender<\/code><\/td>\n<td><code>auto<\/code><\/td>\n<td><code>auto<\/code> infers from the voice: Kokoro voice prefix (<code>af_<\/code>/<code>bf_<\/code> female, <code>am_<\/code>/<code>bm_<\/code> male), or for Chatterbox the cloned sample's file name (<code>f_*.wav<\/code> / <code>m_*.wav<\/code>); or <code>female<\/code>/<code>male<\/code>. Decides Alveus vs Aurea<\/td>\n<\/tr>\n<tr>\n<td><code>kokoro.voice<\/code><\/td>\n<td><code>af_heart<\/code><\/td>\n<td>see <code>alveus tts voices<\/code> (28 English voices)<\/td>\n<\/tr>\n<tr>\n<td><code>kokoro.speed<\/code><\/td>\n<td><code>1.0<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>kokoro.lang_code<\/code><\/td>\n<td><code>a<\/code><\/td>\n<td><code>a<\/code> American, <code>b<\/code> British English<\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox.model<\/code><\/td>\n<td><code>turbo<\/code><\/td>\n<td><code>turbo<\/code> or <code>standard<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>voices_dir<\/code><\/td>\n<td><code>${ALVEUS_HOME}/voices<\/code><\/td>\n<td>folder of WAV samples for cloning; the GUI's sample picker lists its files (set per machine in <code>local.yaml<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox.voice_ref<\/code><\/td>\n<td><code>null<\/code><\/td>\n<td>a file name inside <code>voices_dir<\/code>, or an absolute path, of a 5–15 s WAV to clone; name it <code>f_…wav<\/code> or <code>m_…wav<\/code> so the gender (and name) is inferred. A missing file falls back to the built-in voice with a warning<\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox.exaggeration<\/code>, <code>.cfg_weight<\/code><\/td>\n<td><code>0.5<\/code>, <code>0.5<\/code><\/td>\n<td>standard model only<\/td>\n<\/tr>\n<tr>\n<td><code>openai_http.base_url<\/code>, <code>.model<\/code>, <code>.voice<\/code><\/td>\n<td><\/td>\n<td>any <code>/v1/audio/speech<\/code> server (e.g. Kokoro-FastAPI on :8880)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"audio\"><code>audio<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>backend<\/code><\/td>\n<td><code>auto<\/code><\/td>\n<td><code>auto<\/code> picks <code>pipewire<\/code> when <code>pw-record<\/code>/<code>pw-play<\/code> exist, else <code>sounddevice<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>input_device<\/code> / <code>output_device<\/code><\/td>\n<td><code>null<\/code><\/td>\n<td>PipeWire: node name or serial for <code>--target<\/code> (see <code>wpctl status<\/code>); sounddevice: index or name substring<\/td>\n<\/tr>\n<tr>\n<td><code>sample_rate<\/code><\/td>\n<td><code>16000<\/code><\/td>\n<td>capture rate (VAD/STT expect 16 kHz)<\/td>\n<\/tr>\n<tr>\n<td><code>vad.threshold<\/code><\/td>\n<td><code>0.5<\/code><\/td>\n<td>Silero speech probability threshold<\/td>\n<\/tr>\n<tr>\n<td><code>vad.min_speech_ms<\/code><\/td>\n<td><code>250<\/code><\/td>\n<td>shorter segments are ignored<\/td>\n<\/tr>\n<tr>\n<td><code>vad.end_silence_ms<\/code><\/td>\n<td><code>700<\/code><\/td>\n<td>pause length that ends an utterance<\/td>\n<\/tr>\n<tr>\n<td><code>vad.max_utterance_s<\/code><\/td>\n<td><code>60<\/code><\/td>\n<td>hard cap<\/td>\n<\/tr>\n<tr>\n<td><code>chimes<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td>play a chime when the assistant starts listening<\/td>\n<\/tr>\n<tr>\n<td><code>barge_in<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td>hotkey, Listen button, <code>/trigger<\/code> (and openWakeWord, if enabled) interrupt a reply in progress: generation, pending tool calls and speech, then listen<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"activation\"><code>activation<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>wake_word.enabled<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.mode<\/code><\/td>\n<td><code>names<\/code><\/td>\n<td><code>names<\/code> (transcript-based), <code>oww<\/code> (openWakeWord), <code>both<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.names<\/code><\/td>\n<td><code>[Alveus, Aurea]<\/code><\/td>\n<td>names that address the assistant<\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.name_aliases<\/code><\/td>\n<td><code>[alvius, …, aria, oria, …]<\/code><\/td>\n<td>STT misspellings that also count<\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.oww_model<\/code><\/td>\n<td><code>hey_jarvis<\/code><\/td>\n<td>pretrained id or the stem of a custom <code>.onnx<\/code> in <code>${ALVEUS_MODELS}/wakeword/<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.threshold<\/code><\/td>\n<td><code>0.5<\/code><\/td>\n<td>openWakeWord score threshold<\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.name_segment_s<\/code><\/td>\n<td><code>12<\/code><\/td>\n<td>max length of a speech segment checked for a name<\/td>\n<\/tr>\n<tr>\n<td><code>wake_word.follow_up_window_s<\/code><\/td>\n<td><code>8<\/code><\/td>\n<td>seconds after a reply during which no name is needed (<code>0<\/code> disables)<\/td>\n<\/tr>\n<tr>\n<td><code>hotkey.enabled<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>hotkey.combo<\/code><\/td>\n<td><code>&lt;ctrl&gt;+&lt;alt&gt;+&lt;space&gt;<\/code><\/td>\n<td>pynput syntax: <code>&lt;ctrl&gt;+&lt;shift&gt;+a<\/code>, <code>&lt;cmd&gt;+&lt;space&gt;<\/code>, …<\/td>\n<\/tr>\n<tr>\n<td><code>hotkey.mode<\/code><\/td>\n<td><code>toggle<\/code><\/td>\n<td><code>toggle<\/code> (press to start, silence/press ends) or <code>hold<\/code> (push-to-talk)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"tools\"><code>tools<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>confirm_destructive<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td>ask before destructive tools / dangerous shell commands<\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.command<\/code><\/td>\n<td><\/td>\n<td>argv list for a stdio MCP server; <code>python<\/code> is replaced by the env's interpreter<\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.url<\/code><\/td>\n<td><\/td>\n<td>HTTP MCP server (<code>…/sse<\/code> uses SSE transport, otherwise streamable HTTP)<\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.headers<\/code><\/td>\n<td><\/td>\n<td>HTTP headers (e.g. <code>Authorization<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.env<\/code><\/td>\n<td><\/td>\n<td>extra environment for stdio servers (<code>ALVEUS_FS_ROOTS<\/code> for <code>files<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.cwd<\/code><\/td>\n<td>repo root<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.enabled<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>servers.&lt;name&gt;.timeout_s<\/code><\/td>\n<td><code>60<\/code><\/td>\n<td>startup timeout<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Built-in servers: <code>files<\/code>, <code>desktop<\/code>, <code>system<\/code>, <code>web<\/code>, <code>coder<\/code>. The coder server honours\n<code>ALVEUS_OPENCODE_MODEL<\/code> (<code>auto<\/code> = the assistant's own local model, <code>opencode-default<\/code>, or a\n<code>provider/model<\/code> id such as <code>deepseek/deepseek-v4-flash<\/code>) and <code>ALVEUS_CODE_DIR<\/code> (default project folder).\nEvery stdio server also receives <code>ALVEUS_HOME<\/code>, <code>ALVEUS_LLM_PROFILE<\/code>, <code>ALVEUS_LLM_MODEL<\/code>, <code>ALVEUS_LLM_BASE_URL<\/code>.<\/p>\n<h2 id=\"api\"><code>api<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>enabled<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td>start the browser GUI + HTTP API inside <code>alveus talk<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>host<\/code>, <code>port<\/code><\/td>\n<td><code>127.0.0.1<\/code>, <code>8765<\/code><\/td>\n<td>bind address (keep localhost; tunnel with SSH for remote use)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Most keys above can also be edited in the GUI's Settings tab, which writes <code>config/local.yaml<\/code>.<\/p>\n<h2 id=\"logging\"><code>logging<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>key<\/th>\n<th>default<\/th>\n<th>meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>level<\/code><\/td>\n<td><code>INFO<\/code><\/td>\n<td><code>DEBUG<\/code> shows ignored (non-addressed) transcripts, VAD decisions, MCP traffic<\/td>\n<\/tr>\n<tr>\n<td><code>dir<\/code><\/td>\n<td><code>${ALVEUS_HOME}/logs<\/code><\/td>\n<td><code>alveus.log<\/code> is written here in addition to the console/journal<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "headings": [{"id": "layers", "text": "Layers", "level": 2}, {"id": "assistant", "text": "assistant", "level": 2}, {"id": "llm", "text": "llm", "level": 2}, {"id": "stt", "text": "stt", "level": 2}, {"id": "tts", "text": "tts", "level": 2}, {"id": "audio", "text": "audio", "level": 2}, {"id": "activation", "text": "activation", "level": 2}, {"id": "tools", "text": "tools", "level": 2}, {"id": "api", "text": "api", "level": 2}, {"id": "logging", "text": "logging", "level": 2}], "source": "docs/configuration.md"}, {"slug": "usage", "title": "Usage", "group": "Use", "html": "<h1 id=\"usage\">Usage<\/h1>\n<h2 id=\"talking-to-alveus-aurea\">Talking to Alveus / Aurea<\/h2>\n<p>With the <code>alveus<\/code> service running (or <code>alveus talk<\/code> in a terminal) the assistant is always\nlistening for its names. There are four ways to start a turn:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>how<\/th>\n<th>what happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>\"Aurea, what's the weather?\"<\/strong> (name + request in one breath)<\/td>\n<td>the request runs immediately, no chime<\/td>\n<\/tr>\n<tr>\n<td><strong>\"Alveus.\"<\/strong> (name alone, then pause)<\/td>\n<td>a rising chime plays; speak your request; a 700 ms pause ends it<\/td>\n<\/tr>\n<tr>\n<td><strong>ctrl+alt+space<\/strong><\/td>\n<td>same as the name alone; press again to end early<\/td>\n<\/tr>\n<tr>\n<td><strong>follow-up<\/strong> within 8 s of a reply<\/td>\n<td>just keep talking, no name needed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Say either name; the assistant does not care which. It replies with the name that matches\nits voice (Aurea for the default female Kokoro voice).<\/p>\n<p>Tips for reliable recognition:<\/p>\n<ul>\n<li>Speak the name at the start (or the very end) of the sentence. Names buried mid-sentence are\n  not treated as addressing.<\/li>\n<li>A short pause is required to end an utterance (<code>audio.vad.end_silence_ms<\/code>, default 0.7 s).\n  If the assistant cuts you off, raise it; if it feels slow, lower it to ~500.<\/li>\n<li>Interrupt a long answer with the hotkey or the GUI Listen button: generation and speech stop and it listens to you. (Interrupting by voice alone needs the openWakeWord mode.)<\/li>\n<li>Destructive requests get a spoken question, e.g. <em>\"I am about to delete path with\n  {\"path\": \"…\"}. Should I go ahead?\"<\/em> Answer \"yes\", \"go ahead\", \"do it\" — anything else cancels.<\/li>\n<\/ul>\n<h3 id=\"example-requests-by-tool-group\">Example requests by tool group<\/h3>\n<p><strong>System<\/strong> – \"how hot is the GPU?\", \"how much memory is free?\", \"what's eating the CPU?\", \"is\nthere a process called zoom?\", \"kill process 4242\" (confirmed), \"which of my services are\nrunning?\", \"restart the alveus-llm service\" (confirmed), \"what's my IP address?\",\n\"suspend the computer\" (confirmed), \"lock the screen\".<\/p>\n<p><strong>Files &amp; shell<\/strong> – \"what's in my Downloads folder?\", \"find all PDFs under Documents\", \"search\nmy repo folder for the word hypothalamus\", \"read the README in ~/local/repo/SAEM\", \"create a\nfile notes.txt on the desktop with today's plan\", \"run <code>nvidia-smi<\/code>\", \"how big is my home\ndirectory?\" (runs <code>du<\/code>).<\/p>\n<p><strong>Desktop<\/strong> – \"open Firefox\", \"launch the terminal\", \"open ~/Downloads\", \"open github.com\",\n\"volume to 30 percent\", \"turn it up a bit\", \"mute\", \"unmute\", \"pause the music\", \"next track\",\n\"what's playing?\", \"take a screenshot\", \"switch to dark mode\", \"enable do not disturb\", \"copy\n'hello world' to the clipboard\", \"what's on my clipboard?\", \"notify me: stand up in 20 minutes\"\n(shows a desktop notification now — it has no timer yet), \"focus the Firefox window\", \"type\n'hello' into the current window\", \"press ctrl s\".<\/p>\n<p><strong>Web<\/strong> – \"weather in Boston tomorrow?\", \"search for the latest CUDA toolkit release\", \"search\nthe news for Neuralink\", \"summarize https://example.com/article\".<\/p>\n<p><strong>Coding (opencode)<\/strong> – \"in ~/local/repo/SAEM, what does the training loop do?\", \"in\n~/local/repo/foo, add type hints to utils.py and run the tests\" (opencode edits files; can take\nminutes), \"what's the git status of ~/local/repo/alveus-ai?\".<\/p>\n<p><strong>Conversation<\/strong> – anything else: explanations, drafting text, maths, planning. The model is\nBonsai-27B (Qwen3.6-derived); expect solid general knowledge with a 1-bit quality trade-off.<\/p>\n<h2 id=\"browser-gui\">Browser GUI<\/h2>\n<p>While the assistant runs (service, <code>alveus talk<\/code>, or <code>alveus api<\/code>), open <strong>http://127.0.0.1:8765/<\/strong>\nor run <code>alveus ui<\/code>. The page is served by the assistant itself and is reachable from this machine\nonly.<\/p>\n<p><strong>Chat tab.<\/strong> Type a request (Enter sends, Shift+Enter for a newline). Replies stream in; tool calls\nappear as expandable chips above the answer with their arguments and results; the model's reasoning\ncan be shown with the \"Show reasoning\" toggle. Destructive actions pause the reply with an\n<strong>Allow / Deny<\/strong> card. \"Speak replies aloud\" plays the answer through the speaker. Voice turns you\nsay out loud appear in the same log (tagged <em>voice<\/em>) and stream live, with their tool cards and any\nquestion asked aloud (\"I am about to … Should I go ahead?\"), because GUI and microphone share one\nconversation. The header shows the live state (idle, listening, thinking, speaking) and the LLM\nhealth. Next to the message box, <strong>Listen<\/strong> starts a voice turn (same as the hotkey); pressed while it is thinking or speaking, it cuts that reply off first. While a reply\nis running the <strong>Send<\/strong> button turns into <strong>Interrupt<\/strong>, which stops generation, skips pending tool\ncalls, cuts speech and denies any open confirmation. Under each answer: <strong>Copy<\/strong>, <strong>Speak<\/strong> (say it\nagain), <strong>Stop<\/strong> (stop speaking) and <strong>Retry<\/strong> (ask the same question again).<\/p>\n<p><strong>Commands that need sudo.<\/strong> Any shell command using <code>sudo<\/code> is held until you allow it. The\nconfirmation card shows a password field: enter your password and press <strong>Allow once<\/strong>. The\npassword is handed to that one <code>sudo<\/code> on its standard input and is neither stored nor logged (it\ntravels only over the local loopback connection to the assistant process). Leave the field empty\nif your account has passwordless sudo. A voice request that needs sudo says so aloud and shows the\nsame card in the browser, since a password cannot be spoken.<\/p>\n<p><strong>Settings tab.<\/strong> A form over every commonly changed option (names, model profile, speech engines and\nvoice, activation mode and names, hotkey, VAD timing, chimes, tool safety, log level). Each row shows\nwhether the value is overridden on this machine and offers <em>reset to default<\/em>. <strong>Save<\/strong> writes the\nchanges to <code>config/local.yaml<\/code>; nothing is applied until you press <strong>Restart assistant<\/strong> (or\n<strong>Restart LLM + assistant<\/strong> when the model profile changed). Changing the model profile first runs\na load check of the new weights with your llama-server binary (5–20 s); if the file cannot be\nloaded, nothing is saved and the error is shown. If the LLM service still fails to come up after a\nrestart, the page shows the server's error and offers to revert to the previous profile. The page reconnects by itself, usually\nin 10–40 s while models reload. The <em>Advanced<\/em> section edits <code>local.yaml<\/code> and the persona prompt as\nraw text.<\/p>\n<p><strong>On another machine.<\/strong> After <code>./install.sh<\/code> there, the GUI is available the same way at\n<code>http://127.0.0.1:8765/<\/code> whenever <code>systemctl --user start alveus<\/code>, <code>alveus talk<\/code>, or <code>alveus api<\/code>\n(GUI without microphone) is running; <code>alveus ui<\/code> opens it in the default browser. To reach a remote\nmachine's GUI from your laptop, tunnel the port rather than exposing it:\n<code>ssh -L 8765:127.0.0.1:8765 user@that-machine<\/code>, then browse to <code>http://127.0.0.1:8765/<\/code> locally.<\/p>\n<h2 id=\"text-mode\">Text mode<\/h2>\n<pre><code class=\"language-bash\">conda activate alveus\nalveus chat                  # REPL with tools; /tools lists them, /reset clears history, /quit exits\nalveus chat --speak          # replies are also spoken\nalveus chat --show-thinking  # print the model's reasoning stream in grey\nalveus chat --no-tools       # pure conversation\nalveus chat --profile bonsai-ternary\n<\/code><\/pre>\n<p>In text mode destructive confirmations are terminal <code>[y/N]<\/code> prompts.<\/p>\n<h2 id=\"cli-reference\">CLI reference<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>command<\/th>\n<th>purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>alveus talk [-v] [--no-api] [--profile P]<\/code><\/td>\n<td>full voice assistant + HTTP API<\/td>\n<\/tr>\n<tr>\n<td><code>alveus chat [--speak] [--no-tools] [--show-thinking] [--profile P]<\/code><\/td>\n<td>text REPL<\/td>\n<\/tr>\n<tr>\n<td><code>alveus api<\/code><\/td>\n<td>HTTP API only (no microphone), for other frontends<\/td>\n<\/tr>\n<tr>\n<td><code>alveus ui<\/code><\/td>\n<td>open the browser GUI of the running assistant<\/td>\n<\/tr>\n<tr>\n<td><code>alveus handbook [--rebuild]<\/code><\/td>\n<td>open the offline documentation (<code>docs/handbook.html<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus trigger<\/code><\/td>\n<td>make the running assistant listen now (bind to a keyboard shortcut)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus say \"text\"<\/code><\/td>\n<td>speak through the running assistant (falls back to local synthesis)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus tools<\/code><\/td>\n<td>connect every MCP server and list tools (destructive ones marked)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus devices<\/code><\/td>\n<td>audio devices (<code>wpctl status<\/code> on PipeWire)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus doctor [--warm]<\/code><\/td>\n<td>environment health check; <code>--warm<\/code> also loads STT/TTS/wake word<\/td>\n<\/tr>\n<tr>\n<td><code>alveus wakeword-test [--seconds N]<\/code><\/td>\n<td>live openWakeWord scores<\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm profiles<\/code><\/td>\n<td>table of LLM profiles and whether their weights exist<\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm serve [--profile P] [--host H] [--port N] [--extra \"…\"]<\/code><\/td>\n<td>launch llama-server for a profile (what the service runs)<\/td>\n<\/tr>\n<tr>\n<td><code>alveus llm test [--prompt \"…\"] [--profile P]<\/code><\/td>\n<td>stream a quick reply<\/td>\n<\/tr>\n<tr>\n<td><code>alveus tts say \"text\" [--out file.wav]<\/code><\/td>\n<td>synthesize and play / save<\/td>\n<\/tr>\n<tr>\n<td><code>alveus tts voices<\/code><\/td>\n<td>list voices of the active TTS backend<\/td>\n<\/tr>\n<tr>\n<td><code>alveus stt test [--seconds N] [--file x.wav]<\/code><\/td>\n<td>record (or read a WAV) and transcribe<\/td>\n<\/tr>\n<tr>\n<td><code>alveus version<\/code><\/td>\n<td>version and repo path<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>All commands read the same configuration; <code>-v<\/code> on <code>talk<\/code>/<code>chat<\/code>/<code>api<\/code> enables debug logging.<\/p>\n<h2 id=\"starting-and-stopping\">Starting and stopping<\/h2>\n<p>Both services are <strong>enabled<\/strong>, so after a reboot (or logging in) they start by themselves: the LLM\nserver first, then the assistant with its GUI at <code>http://127.0.0.1:8765/<\/code>. Allow about a minute for\nthe models to load. Nothing needs to be typed.<\/p>\n<pre><code class=\"language-bash\">systemctl --user stop alveus alveus-llm      # stop everything\nsystemctl --user start alveus-llm alveus     # start everything\nsystemctl --user restart alveus              # restart only the assistant (after config changes)\nsystemctl --user status alveus alveus-llm    # current state\njournalctl --user -u alveus -f               # live log\nsystemctl --user disable alveus alveus-llm   # turn off autostart (enable to turn it back on)\n<\/code><\/pre>\n<h2 id=\"running-as-a-service-vs-by-hand\">Running as a service vs. by hand<\/h2>\n<p>The systemd units start both the LLM server and the assistant at login. To iterate manually,\nstop the assistant unit first so two instances do not both answer the microphone:<\/p>\n<pre><code class=\"language-bash\">systemctl --user stop alveus\nalveus talk -v\nsystemctl --user start alveus\n<\/code><\/pre>\n<p>The LLM unit can stay running; <code>alveus talk<\/code>, <code>alveus chat<\/code> and opencode all share it.<\/p>\n<h2 id=\"switching-the-model\">Switching the model<\/h2>\n<pre><code class=\"language-bash\"># one-off\nALVEUS_LLM_PROFILE=bonsai-ternary alveus llm serve      # in one terminal\nALVEUS_LLM_PROFILE=bonsai-ternary alveus chat            # in another\n\n# permanent: config/local.yaml\nllm:\n  profile: bonsai-ternary\n# then: systemctl --user restart alveus-llm alveus\n<\/code><\/pre>\n<p>The Ternary model is ~7 GB (vs 3.8 GB), keeps ~95 % of full-precision quality (vs ~90 %) and\nscores higher on tool use; generation is somewhat slower.<\/p>\n<h2 id=\"changing-the-voice-and-the-name\">Changing the voice (and the name)<\/h2>\n<pre><code class=\"language-yaml\">tts:\n  kokoro:\n    voice: am_michael     # a male voice -&gt; the assistant calls itself Alveus\n<\/code><\/pre>\n<p><code>alveus tts voices<\/code> lists the 28 Kokoro voices; <code>alveus tts say \"…\"<\/code> previews one after editing\nthe config. For a cloned voice, switch <code>tts.backend<\/code> to <code>chatterbox<\/code> and set <code>chatterbox.voice_ref<\/code>\nto a clean 5–15 s WAV of the speaker.<\/p>\n<h2 id=\"speaking-other-languages\">Speaking other languages<\/h2>\n<ol>\n<li>Settings → Speech: Text-to-speech engine <code>chatterbox<\/code>, Chatterbox model <code>multilingual<\/code>, output\n   language <code>auto<\/code> (or fix one, e.g. <code>zh<\/code>).<\/li>\n<li>Settings → Speech: clear <em>Spoken language<\/em> so Whisper detects the language you speak.<\/li>\n<li>Save, restart. Speak Chinese (or German, Japanese…) and the assistant hears, thinks and answers in\n   that language; each sentence is voiced in the language it is written in, so mixed replies work.\n   The wake names still have to be said as \"Alveus\"/\"Aurea\" (add local spellings to <em>Name aliases<\/em>\n   if Whisper writes them differently in your language).<\/li>\n<\/ol>\n<h2 id=\"using-alveus-from-other-programs\">Using Alveus from other programs<\/h2>\n<p>Everything the voice loop can do is reachable over HTTP on <code>127.0.0.1:8765<\/code> while\n<code>alveus talk<\/code> (or <code>alveus api<\/code>) runs — see <a href=\"#api\">api.md<\/a>. Examples:<\/p>\n<pre><code class=\"language-bash\">curl -s localhost:8765/chat -H 'content-type: application/json' -d '{&quot;text&quot;:&quot;what time is it?&quot;}'\ncurl -s localhost:8765/speak -H 'content-type: application/json' -d '{&quot;text&quot;:&quot;Dinner is ready&quot;,&quot;play&quot;:true}'\ncurl -s -X POST localhost:8765/trigger        # start listening (Wayland shortcut, phone, Stream Deck…)\n<\/code><\/pre>", "headings": [{"id": "talking-to-alveus-aurea", "text": "Talking to Alveus / Aurea", "level": 2}, {"id": "example-requests-by-tool-group", "text": "Example requests by tool group", "level": 3}, {"id": "browser-gui", "text": "Browser GUI", "level": 2}, {"id": "text-mode", "text": "Text mode", "level": 2}, {"id": "cli-reference", "text": "CLI reference", "level": 2}, {"id": "starting-and-stopping", "text": "Starting and stopping", "level": 2}, {"id": "running-as-a-service-vs-by-hand", "text": "Running as a service vs. by hand", "level": 2}, {"id": "switching-the-model", "text": "Switching the model", "level": 2}, {"id": "changing-the-voice-and-the-name", "text": "Changing the voice (and the name)", "level": 2}, {"id": "speaking-other-languages", "text": "Speaking other languages", "level": 2}, {"id": "using-alveus-from-other-programs", "text": "Using Alveus from other programs", "level": 2}], "source": "docs/usage.md"}, {"slug": "tools", "title": "Tools (MCP)", "group": "Use", "html": "<h1 id=\"tools-mcp\">Tools (MCP)<\/h1>\n<p>Alveus gives the model tools through the <strong>Model Context Protocol<\/strong>. Each tool group is a\nseparate MCP server process started over stdio by <code>ToolHub<\/code> when the assistant starts (HTTP/SSE\nservers are also supported). Tools are shown to the model as <code>server__tool<\/code> and executed with a\n120 s timeout; results are returned as text (JSON from the built-in servers).<\/p>\n<p><code>alveus tools<\/code> prints the live list. Destructive tools (marked <strong>!<\/strong> below) require confirmation\nwhen <code>tools.confirm_destructive<\/code> is on. <code>run_command<\/code> is additionally screened by a regex for\ndangerous shell commands (<code>rm<\/code>, <code>kill<\/code>, <code>shutdown<\/code>, <code>dd<\/code>, <code>mkfs<\/code>, <code>git push --force<\/code>, …).\nAny <code>run_command<\/code> that uses <code>sudo<\/code> always asks (regardless of <code>confirm_destructive<\/code>): the GUI card\ntakes the password for an \"allow once\", passes it to the tool as <code>sudo_password<\/code>, and the tool\nrewrites the first <code>sudo<\/code> to <code>sudo -S -p ''<\/code> fed from stdin. The model cannot supply that argument\nitself (it is stripped before the confirmation) and the password never enters the conversation\nhistory or logs.<\/p>\n<h2 id=\"files-mcp_serversfiles_shellpy\"><code>files<\/code> — <code>mcp_servers/files_shell.py<\/code><\/h2>\n<p>Access is restricted to <code>ALVEUS_FS_ROOTS<\/code> (colon-separated; default <code>~<\/code>). Paths outside raise\n<code>PermissionError<\/code>, which the model sees as an error message.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>list_dir<\/code><\/td>\n<td><code>path=\"~\"<\/code>, <code>show_hidden=false<\/code><\/td>\n<td>folders first, sizes, max 400 entries<\/td>\n<\/tr>\n<tr>\n<td><code>read_file<\/code><\/td>\n<td><code>path<\/code>, <code>start_line=1<\/code>, <code>max_lines=400<\/code><\/td>\n<td>text with line range; 60 kB cap<\/td>\n<\/tr>\n<tr>\n<td><code>write_file<\/code><\/td>\n<td><code>path<\/code>, <code>content<\/code>, <code>append=false<\/code><\/td>\n<td>creates parent folders<\/td>\n<\/tr>\n<tr>\n<td><code>find_files<\/code><\/td>\n<td><code>pattern<\/code>, <code>path=\"~\"<\/code>, <code>max_results=100<\/code><\/td>\n<td>recursive glob (<code>*.pdf<\/code>), skips dot-dirs/node_modules<\/td>\n<\/tr>\n<tr>\n<td><code>search_text<\/code><\/td>\n<td><code>query<\/code>, <code>path=\"~\"<\/code>, <code>file_glob=\"*\"<\/code>, <code>max_results=50<\/code>, <code>regex=false<\/code><\/td>\n<td>grep-like, case-insensitive, skips files &gt; 5 MB<\/td>\n<\/tr>\n<tr>\n<td><code>move_path<\/code> <strong>!<\/strong><\/td>\n<td><code>src<\/code>, <code>dst<\/code><\/td>\n<td>rename/move<\/td>\n<\/tr>\n<tr>\n<td><code>delete_path<\/code> <strong>!<\/strong><\/td>\n<td><code>path<\/code><\/td>\n<td>unlink file or remove empty dir<\/td>\n<\/tr>\n<tr>\n<td><code>run_command<\/code><\/td>\n<td><code>command<\/code>, <code>cwd=\"~\"<\/code>, <code>timeout_s=60<\/code><\/td>\n<td>bash, stdout/stderr/exit code; dangerous commands confirmed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"desktop-mcp_serversdesktoppy\"><code>desktop<\/code> — <code>mcp_servers/desktop.py<\/code><\/h2>\n<p>Uses stock GNOME/freedesktop tooling (<code>gio<\/code>, <code>gdbus<\/code>, <code>notify-send<\/code>, <code>wpctl<\/code>, <code>xdg-open<\/code>,\n<code>gsettings<\/code>, <code>loginctl<\/code>). Window and input tools need <code>wmctrl<\/code>/<code>xdotool<\/code> (X11) and report what is\nmissing otherwise; <code>playerctl<\/code> improves media control but D-Bus MPRIS is used as fallback.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>list_apps<\/code><\/td>\n<td><code>filter=\"\"<\/code><\/td>\n<td>installed <code>.desktop<\/code> apps (system, user, snap, flatpak)<\/td>\n<\/tr>\n<tr>\n<td><code>launch_app<\/code><\/td>\n<td><code>app<\/code>, <code>args=\"\"<\/code><\/td>\n<td>match by desktop id or name, <code>gio launch<\/code>; falls back to a binary on PATH<\/td>\n<\/tr>\n<tr>\n<td><code>open_target<\/code><\/td>\n<td><code>target<\/code><\/td>\n<td><code>xdg-open<\/code> a URL, file or folder<\/td>\n<\/tr>\n<tr>\n<td><code>notify<\/code><\/td>\n<td><code>title<\/code>, <code>body=\"\"<\/code>, <code>urgency=\"normal\"<\/code><\/td>\n<td>desktop notification<\/td>\n<\/tr>\n<tr>\n<td><code>clipboard_get<\/code> / <code>clipboard_set<\/code><\/td>\n<td>— / <code>text<\/code><\/td>\n<td>via <code>wl-paste<\/code>/<code>xclip<\/code>/<code>xsel<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>volume_get<\/code><\/td>\n<td><\/td>\n<td><code>{volume 0-100, muted}<\/code> from <code>wpctl<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>volume_set<\/code><\/td>\n<td><code>level<\/code>, <code>delta<\/code>, <code>mute<\/code> (all optional)<\/td>\n<td>absolute, relative (±%), or mute toggle; capped at 100 %<\/td>\n<\/tr>\n<tr>\n<td><code>media_control<\/code><\/td>\n<td><code>action<\/code> = play/pause/play_pause/next/previous/stop/status<\/td>\n<td>MPRIS via playerctl or gdbus<\/td>\n<\/tr>\n<tr>\n<td><code>list_windows<\/code><\/td>\n<td><\/td>\n<td><code>wmctrl -l<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>focus_window<\/code><\/td>\n<td><code>title_substring<\/code><\/td>\n<td>raise window<\/td>\n<\/tr>\n<tr>\n<td><code>close_window<\/code> <strong>!<\/strong><\/td>\n<td><code>title_substring<\/code><\/td>\n<td>graceful close<\/td>\n<\/tr>\n<tr>\n<td><code>type_text<\/code><\/td>\n<td><code>text<\/code><\/td>\n<td><code>xdotool type<\/code> (X11 only)<\/td>\n<\/tr>\n<tr>\n<td><code>press_keys<\/code><\/td>\n<td><code>keys<\/code> (xdotool syntax, e.g. <code>ctrl+s<\/code>)<\/td>\n<td><code>xdotool key<\/code> (X11 only)<\/td>\n<\/tr>\n<tr>\n<td><code>screenshot<\/code><\/td>\n<td><code>path=\"\"<\/code><\/td>\n<td>PNG via gnome-screenshot, GNOME Shell D-Bus, or ImageMagick <code>import<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>set_dark_mode<\/code><\/td>\n<td><code>enabled<\/code><\/td>\n<td>GNOME colour scheme + Yaru theme<\/td>\n<\/tr>\n<tr>\n<td><code>do_not_disturb<\/code><\/td>\n<td><code>enabled<\/code><\/td>\n<td>GNOME <code>show-banners<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>lock_screen<\/code><\/td>\n<td><\/td>\n<td><code>loginctl lock-session<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"system-mcp_serverssystempy\"><code>system<\/code> — <code>mcp_servers/system.py<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>system_status<\/code><\/td>\n<td><\/td>\n<td>host, OS, time, uptime, CPU %, load, CPU temp, RAM, root disk, GPUs, battery<\/td>\n<\/tr>\n<tr>\n<td><code>gpu_status<\/code><\/td>\n<td><\/td>\n<td>per-GPU name, temperature, utilisation, memory, power (NVML)<\/td>\n<\/tr>\n<tr>\n<td><code>top_processes<\/code><\/td>\n<td><code>sort_by=\"cpu\"|\"memory\"<\/code>, <code>limit=10<\/code><\/td>\n<td>heaviest processes<\/td>\n<\/tr>\n<tr>\n<td><code>find_process<\/code><\/td>\n<td><code>name<\/code><\/td>\n<td>match on name or command line<\/td>\n<\/tr>\n<tr>\n<td><code>kill_process<\/code> <strong>!<\/strong><\/td>\n<td><code>pid<\/code>, <code>force=false<\/code><\/td>\n<td>SIGTERM / SIGKILL<\/td>\n<\/tr>\n<tr>\n<td><code>list_services<\/code><\/td>\n<td><code>scope=\"user\"|\"system\"<\/code>, <code>state=\"running\"|\"failed\"|\"all\"<\/code><\/td>\n<td>systemd units<\/td>\n<\/tr>\n<tr>\n<td><code>control_service<\/code> <strong>!<\/strong><\/td>\n<td><code>name<\/code>, <code>action<\/code> (start/stop/restart/enable/disable/status), <code>scope=\"user\"<\/code><\/td>\n<td>systemctl; system scope may prompt polkit<\/td>\n<\/tr>\n<tr>\n<td><code>network_info<\/code><\/td>\n<td><\/td>\n<td>IPv4 per interface, internet reachability (ping 1.1.1.1)<\/td>\n<\/tr>\n<tr>\n<td><code>power<\/code> <strong>!<\/strong><\/td>\n<td><code>action<\/code> = suspend/hibernate/reboot/poweroff/lock<\/td>\n<td>systemctl / loginctl<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"web-mcp_serverswebpy\"><code>web<\/code> — <code>mcp_servers/web.py<\/code><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>web_search<\/code><\/td>\n<td><code>query<\/code>, <code>max_results=6<\/code>, <code>kind=\"text\"|\"news\"<\/code><\/td>\n<td>DuckDuckGo via <code>ddgs<\/code> (title, url, snippet)<\/td>\n<\/tr>\n<tr>\n<td><code>fetch_page<\/code><\/td>\n<td><code>url<\/code>, <code>max_chars=6000<\/code><\/td>\n<td>HTTP GET + <code>trafilatura<\/code> readable-text extraction (HTML-strip fallback); JSON passthrough<\/td>\n<\/tr>\n<tr>\n<td><code>weather<\/code><\/td>\n<td><code>location=\"\"<\/code><\/td>\n<td>wttr.in current conditions + 3-day forecast; empty = geo-IP<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>These are the only tools that contact the internet.<\/p>\n<h2 id=\"coder-mcp_serverscoderpy\"><code>coder<\/code> — <code>mcp_servers/coder.py<\/code><\/h2>\n<p>Delegates programming work to <strong>opencode<\/strong> (<code>opencode run --format json<\/code>, headless; the desktop app\nis not involved, but it shares opencode's config and credentials). Which model opencode uses is set by\n<code>tools.servers.coder.env.ALVEUS_OPENCODE_MODEL<\/code> (GUI: Tools &amp; safety → Coding model):\n<code>auto<\/code> (default) requests the same local Bonsai model the assistant is running, via the <code>bonsai<\/code>\nprovider in <code>~/.config/opencode/opencode.jsonc<\/code>, so it follows <code>llm.profile<\/code>; <code>opencode-default<\/code> leaves\nthe choice to opencode; any <code>provider/model<\/code> id from <code>opencode models<\/code> (e.g. <code>deepseek/deepseek-v4-flash<\/code>)\nsends the work to that model instead. <code>ALVEUS_CODE_DIR<\/code> is the project folder used when the request\nnames none.<\/p>\n<p>Note on the local server: llama-server loads one model and answers to whatever model id a client\nsends, so a client that asks for <code>bonsai-27b-1bit<\/code> while the ternary profile is running silently gets\nthe ternary model under the wrong label. <code>auto<\/code> avoids this for the coder by always requesting the\nrunning profile's id.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>parameters<\/th>\n<th>does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>code_task<\/code><\/td>\n<td><code>task<\/code>, <code>directory=\"~\"<\/code>, <code>continue_last=false<\/code>, <code>timeout_s=900<\/code><\/td>\n<td>full agentic coding run in that directory (reads, edits, runs); returns opencode's final message, tools used, session id. <code>continue_last<\/code> resumes the previous session in the same directory<\/td>\n<\/tr>\n<tr>\n<td><code>code_question<\/code><\/td>\n<td><code>question<\/code>, <code>directory=\"~\"<\/code>, <code>timeout_s=300<\/code><\/td>\n<td>read-only analysis with opencode's <code>plan<\/code> agent<\/td>\n<\/tr>\n<tr>\n<td><code>git_status<\/code><\/td>\n<td><code>directory=\".\"<\/code><\/td>\n<td><code>git status --short --branch<\/code> + last 5 commits<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"adding-third-party-mcp-servers\">Adding third-party MCP servers<\/h2>\n<p>Anything that speaks MCP works. In <code>config/local.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">tools:\n  servers:\n    home-assistant:                     # remote SSE server\n      url: http://homeassistant.local:8123/mcp_server/sse\n      headers: { Authorization: &quot;Bearer ${HASS_TOKEN}&quot; }\n    github:                             # stdio server from npm\n      command: [npx, -y, &quot;@modelcontextprotocol/server-github&quot;]\n      env: { GITHUB_PERSONAL_ACCESS_TOKEN: &quot;${GITHUB_TOKEN}&quot; }\n    obsidian:\n      command: [uvx, mcp-obsidian]\n      env: { OBSIDIAN_API_KEY: &quot;${OBSIDIAN_KEY}&quot; }\n      enabled: false\n<\/code><\/pre>\n<p><code>${VAR}<\/code> values are taken from the environment of the <code>alveus<\/code> process (add\n<code>Environment=<\/code> lines to the systemd unit or export before <code>alveus talk<\/code>). Restart the assistant\nand run <code>alveus tools<\/code> to confirm the new tools appear. Keep the total tool count reasonable\n(the schemas are sent with every request; ~40–60 tools is fine for a 32k context).<\/p>\n<h2 id=\"writing-your-own-server\">Writing your own server<\/h2>\n<p>Copy
