> while talking, then check the peak (<code>soundfile<\/code>); near 0.001 = dead input. Check the mute button/LED, <code>wpctl status<\/code> sources, replug the USB device<\/td>\n<\/tr>\n<tr>\n<td>Wrong mic / speaker<\/td>\n<td>default PipeWire device<\/td>\n<td><code>wpctl status<\/code>, <code>wpctl set-default &lt;id&gt;<\/code>, or set <code>audio.input_device<\/code> to the node name<\/td>\n<\/tr>\n<tr>\n<td>Assistant hears itself / random triggers<\/td>\n<td>speaker output reaching the mic<\/td>\n<td>lower speaker volume, raise <code>activation.wake_word.threshold<\/code>, keep <code>mode: names<\/code> (needs a name), or use a headset<\/td>\n<\/tr>\n<tr>\n<td>Cuts you off mid-sentence<\/td>\n<td><code>end_silence_ms<\/code> too short<\/td>\n<td>raise to 900–1200<\/td>\n<\/tr>\n<tr>\n<td>Slow to answer after you stop<\/td>\n<td><code>end_silence_ms<\/code> too long<\/td>\n<td>lower to 500<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"recognition\">Recognition<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>openWakeWord phrase (<code>hey jarvis<\/code>, <code>alexa<\/code>, …) never fires in <code>mode: both<\/code>, works in <code>mode: oww<\/code><\/td>\n<td>before 2026-09-09 VAD started recording on the first speech frame and the recorder did not score frames with the wake model<\/td>\n<td>fixed: the recorder keeps scoring while capturing; a detection acts like the hotkey. Tune with <code>alveus wakeword-test<\/code> (uses <code>oww_model<\/code> and <code>threshold<\/code> from the config)<\/td>\n<\/tr>\n<tr>\n<td>Doesn't react to \"Aurea\"<\/td>\n<td>Whisper hears \"Aria/Oria/Area\"<\/td>\n<td>check with <code>alveus stt test<\/code>; add the spelling to <code>activation.wake_word.name_aliases<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reacts when nobody said the name<\/td>\n<td>fuzzy match too loose<\/td>\n<td>remove short aliases; raise <code>NameMatcher<\/code> cutoff (0.78) in <code>alveus/audio/names.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Transcript \"Thank you.\" from silence<\/td>\n<td>Whisper hallucination on near-silence<\/td>\n<td>filtered (<code>JUNK<\/code> set in <code>voice.py<\/code>); extend the set if you see others<\/td>\n<\/tr>\n<tr>\n<td>Speech in another language (e.g. Chinese) arrives translated into English<\/td>\n<td><code>stt.faster_whisper.language: en<\/code> makes Whisper translate<\/td>\n<td>set it to <code>null<\/code> (GUI: Speech → STT language empty) so each utterance is transcribed in the language spoken; the model then answers as it sees fit<\/td>\n<\/tr>\n<tr>\n<td>Reply in Chinese/Japanese/… is spoken as \"Chinese letter, Chinese letter\"<\/td>\n<td>Kokoro is English-only (its G2P has no CJK)<\/td>\n<td>switch <code>tts.backend<\/code> to <code>chatterbox<\/code> with <code>model: multilingual<\/code> (23 languages, per-sentence auto-detect); verified 2026-09-09<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"model-tools\">Model / tools<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>LLM endpoint FAIL … model 'x' not in served models<\/code><\/td>\n<td>profile <code>model<\/code> ≠ llama-server <code>--alias<\/code><\/td>\n<td>keep them equal; <code>alveus llm serve<\/code> sets the alias from the profile<\/td>\n<\/tr>\n<tr>\n<td><code>alveus-llm<\/code> crash-loops after switching to Ternary: <code>tensor 'output.weight' has invalid ggml type 142<\/code><\/td>\n<td>llama-server built from the fork's <code>master<\/code> (or upstream), which lacks the PQ2_0 kernels<\/td>\n<td>rebuild from the fork's <strong>prism<\/strong> branch: <code>scripts/build_llama.sh<\/code> (does this by default now). The GUI's model check catches this before restarting<\/td>\n<\/tr>\n<tr>\n<td><code>llama-server: error while loading shared libraries: libllama-server-impl.so<\/code><\/td>\n<td>the build directory was moved/renamed; cmake bakes the absolute build path into RPATH<\/td>\n<td>rebuild in place (<code>scripts/build_llama.sh<\/code> now passes <code>-DCMAKE_BUILD_RPATH_USE_ORIGIN=ON<\/code>, which makes the build relocatable) or symlink the old path<\/td>\n<\/tr>\n<tr>\n<td>GUI \"The LLM server did not come up\" after a profile change<\/td>\n<td>new profile's weights can't load<\/td>\n<td>read the error shown, click <em>Revert<\/em>; see the row above<\/td>\n<\/tr>\n<tr>\n<td>Tool calls never happen<\/td>\n<td>server started without <code>--jinja<\/code>, or model without tool template<\/td>\n<td>profile <code>serve.args<\/code> include <code>--jinja<\/code>; check <code>curl :8080/v1/models<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reply is empty but \"thinking\" long<\/td>\n<td><code>max_tokens<\/code> hit during reasoning<\/td>\n<td>raise <code>llm.max_tokens<\/code> or set <code>thinking: false<\/code><\/td>\n<\/tr>\n<tr>\n<td>\"I reached the tool-call limit\"<\/td>\n<td>model looping on a failing tool<\/td>\n<td>check the tool's error in the log; raise <code>llm.max_tool_rounds<\/code> only if legitimately needed<\/td>\n<\/tr>\n<tr>\n<td><code>MCP server 'x' failed to start: Connection closed<\/code><\/td>\n<td>server crashed at import<\/td>\n<td>run it directly: <code>python -m mcp_servers.x<\/code> to see the traceback<\/td>\n<\/tr>\n<tr>\n<td><code>ModuleNotFoundError: mcp.server.fastmcp<\/code><\/td>\n<td>mcp ≥ 2 renamed FastMCP<\/td>\n<td>already handled by <code>mcp_servers/common.py<\/code>; use <code>from .common import FastMCP<\/code><\/td>\n<\/tr>\n<tr>\n<td>Desktop tools say \"missing tools: xdotool…\"<\/td>\n<td>optional binaries absent<\/td>\n<td><code>sudo apt install xdotool wmctrl xclip playerctl<\/code><\/td>\n<\/tr>\n<tr>\n<td>It asks before an action although the model's reasoning said it would just do it<\/td>\n<td>the confirmation gate is in the agent, not the model: tools marked destructive ask (closing windows no longer does)<\/td>\n<td>tick the tool under Tools &amp; safety → Don't ask for these (<code>tools.no_confirm<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>It gave up on an action although you were about to answer<\/td>\n<td><code>activation.confirm_wait_s<\/code> (default 15 s) ran out; silence means \"not now\"<\/td>\n<td>raise the wait (Activation → Time to answer a question). The journal logs <code>confirmation (try N): heard '…' -&gt; yes/no/unclear<\/code> or <code>no answer within N s<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>code_task<\/code> returns quickly with no summary<\/td>\n<td>opencode not authenticated/configured<\/td>\n<td><code>opencode run \"hi\"<\/code> in a terminal; check <code>~/.config/opencode/opencode.jsonc<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"cloud-models\">Cloud models<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"The language model failed: no API key for Anthropic …\" (spoken)<\/td>\n<td>the profile's key variable is set neither in the environment nor in <code>~/.config/alveus/secrets.env<\/code><\/td>\n<td>Settings → Language model → API keys, or <code>alveus llm key ANTHROPIC_API_KEY<\/code>; no restart needed<\/td>\n<\/tr>\n<tr>\n<td>\"… rejected the API key\"<\/td>\n<td>wrong, revoked or out-of-project key<\/td>\n<td>paste a new key; <code>alveus llm test --profile &lt;name&gt;<\/code> checks it with one request<\/td>\n<\/tr>\n<tr>\n<td>\"… says the account has no credit left\" (HTTP 402) / \"rate limiting us\" (429)<\/td>\n<td>billing or quota at the provider<\/td>\n<td>top up / raise limits in the provider console; 429s and 5xx are already retried twice<\/td>\n<\/tr>\n<tr>\n<td>\"… does not know this model\" (404)<\/td>\n<td>model id changed or not available to the account<\/td>\n<td><code>alveus llm profiles<\/code>, then fix <code>model<\/code> in the profile; the provider's model list is the reference<\/td>\n<\/tr>\n<tr>\n<td>Switching to a cloud profile is refused: \"Profile … cannot be used yet\"<\/td>\n<td>the GUI preflight (<code>POST /llm/check<\/code>) found no key, a rejected key or an unknown model<\/td>\n<td>enter the key under API keys (just below the profile) and save again<\/td>\n<\/tr>\n<tr>\n<td>On a cloud profile, <code>nvidia-smi<\/code> still shows llama-server holding VRAM<\/td>\n<td>the assistant was not restarted since the switch, or <code>llm.manage_local_server: false<\/code><\/td>\n<td>restart the assistant (it stops the unit; the journal says <code>LLM server: profile … needs no local server; stopping it<\/code>), or <code>systemctl --user stop alveus-llm<\/code><\/td>\n<\/tr>\n<tr>\n<td>GUI header shows \"LLM ready · cloud\" but <code>alveus-llm<\/code> is inactive<\/td>\n<td>expected: a cloud profile needs no local server, <code>alveus llm serve<\/code> exits at once (frees the GPU)<\/td>\n<td>nothing; switching back to a local profile restarts it<\/td>\n<\/tr>\n<tr>\n<td>DeepSeek: HTTP 400 about <code>reasoning_content<\/code><\/td>\n<td>the API requires earlier reasoning to be sent back once tools are used<\/td>\n<td>handled by the <code>deepseek<\/code> preset (<code>reasoning_replay: all<\/code>); a hand-made profile on <code>openai_compat<\/code> needs <code>reasoning_replay: all<\/code> too<\/td>\n<\/tr>\n<tr>\n<td>Claude: HTTP 400 \"Invalid <code>signature<\/code> in <code>thinking<\/code> block\"<\/td>\n<td>a replayed thinking block no longer matches the history before it (history edited in the middle)<\/td>\n<td>the agent only trims whole old turns and drops the bound thinking then; if it still happens, <code>/history/reset<\/code> (GUI: clear conversation) and report the steps<\/td>\n<\/tr>\n<tr>\n<td>Claude: HTTP 400 mentioning <code>thinking<\/code> on an older model<\/td>\n<td>model without adaptive thinking (e.g. Haiku 4.5)<\/td>\n<td>set <code>thinking: false<\/code> in that profile<\/td>\n<\/tr>\n<tr>\n<td>OpenAI: tools never called, or HTTP 400 on <code>/chat/completions<\/code><\/td>\n<td>current OpenAI models call tools only through the Responses API<\/td>\n<td>use <code>provider: openai<\/code> (Responses), not <code>openai_compat<\/code> pointed at api.openai.com<\/td>\n<\/tr>\n<tr>\n<td>The coder tool fails with \"model not found\" after switching to a cloud profile<\/td>\n<td><code>ALVEUS_OPENCODE_MODEL: auto<\/code> follows the profile, but opencode is not signed in to that provider<\/td>\n<td><code>opencode auth login<\/code>, or set the coding model explicitly in the GUI<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"python-environment\">Python environment<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>symptom<\/th>\n<th>cause<\/th>\n<th>fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>CUDAExecutionProvider is not in available provider names<\/code><\/td>\n<td>CPU <code>onnxruntime<\/code> shadows <code>onnxruntime-gpu<\/code><\/td>\n<td><code>pip uninstall -y onnxruntime &amp;&amp; pip install --force-reinstall --no-deps onnxruntime-gpu<\/code><\/td>\n<\/tr>\n<tr>\n<td>Qwen3-TTS: <code>cannot import name 'check_model_inputs' from 'transformers.utils.generic'<\/code><\/td>\n<td>qwen-tts imported in the main environment (transformers 5)<\/td>\n<td>it must run through its worker: <code>tts.qwen3.python<\/code> → <code>.venv-qwen3tts/bin/python<\/code> (<code>scripts/install_qwen3_tts.sh<\/code>); never <code>pip install qwen-tts<\/code> into the alveus env (it would downgrade transformers for everything)<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-TTS silent, <code>/health<\/code> shows a voice warning<\/td>\n<td>no recording chosen and the voices folder is empty, or the worker failed to start (the error names the cause: missing environment, out of memory)<\/td>\n<td>put a WAV in the voices folder and choose it; <code>alveus doctor<\/code> checks the environment; <code>journalctl --user -u alveus | grep -i qwen<\/code><\/td>\n<\/tr>\n<tr>\n<td>Qwen3-TTS voice sounds less like the recording in English<\/td>\n<td>expected across languages; it then copies the timbre only<\/td>\n<td>for the closest copy use a recording in the language it mostly speaks, with its words in <code>NAME.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>chatterbox-tts requires numpy&lt;2<\/code> / other pins broken<\/td>\n<td>another package upgraded numpy/torch<\/td>\n<td><code>pip install \"numpy&lt;2\"<\/code>; compare with <code>requirements-lock.txt<\/code>. Keep experimental tools (e.g. livekit-wakeword) in a separate env<\/td>\n<\/tr>\n<tr>\n<td><code>openwakeword requires tflite-runtime<\/code> in <code>pip check<\/code><\/td>\n<td>intentional (no py3.12 wheels)<\/td>\n<td>ignore; ONNX runtime is used<\/td>\n<\/tr>\n<tr>\n<td>faster-whisper <code>libcudnn<\/code> not found<\/td>\n<td>cuDNN from torch wheels not loaded<\/td>\n<td>the backend imports torch first; ensure torch is installed in the same env<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"disk-downloads\">Disk / downloads<\/h2>\n<ul>\n<li><code>hf download … --include \"*.gguf\"<\/code> on the Bonsai repos would fetch the 54 GB F16 files. Use the\n  exact filenames (as <code>scripts/download_models.sh<\/code> does).<\/li>\n<li>Hugging Face downloads are unauthenticated and rate-limited; set <code>HF_TOKEN<\/code> for speed.<\/li>\n<\/ul>\n<h2 id=\"getting-more-detail\">Getting more detail<\/h2>\n<pre><code class=\"language-bash\">alveus talk -v                         # debug logging incl. ignored transcripts and VAD\ntail -f ~/local/repo/alveus-ai/logs/alveus.log\npython -m mcp_servers.system            # run a tool server alone; it waits on stdin\ncurl -s localhost:8080/health; curl -s localhost:8765/health\ncurl -s localhost:8765/debug/tasks | python -m json.tool   # where every asyncio task is stuck\njournalctl --user -u alveus -o cat | grep &quot;speech:&quot;        # per-reply speech timing / stops\n<\/code><\/pre>\n<p>A reply that never finishes (GUI stays on \"thinking\"/\"speaking\", <code>/health<\/code> still answers) is an\nasyncio task waiting on something: <code>/debug/tasks<\/code> shows the file and line of each task. py-spy\ncannot attach to the service without ptrace rights, so this endpoint is the practical substitute.<\/p>", "headings": [{"id": "startup-services", "text": "Startup / services", "level": 2}, {"id": "audio", "text": "Audio", "level": 2}, {"id": "recognition", "text": "Recognition", "level": 2}, {"id": "model-tools", "text": "Model / tools", "level": 2}, {"id": "cloud-models", "text": "Cloud models", "level": 2}, {"id": "python-environment", "text": "Python environment", "level": 2}, {"id": "disk-downloads", "text": "Disk / downloads", "level": 2}, {"id": "getting-more-detail", "text": "Getting more detail", "level": 2}], "source": "docs/troubleshooting.md"}, {"slug": "development", "title": "Development", "group": "Maintain", "html": "<h1 id=\"development\">Development<\/h1>\n<h2 id=\"setup\">Setup<\/h2>\n<pre><code class=\"language-bash\">conda activate alveus\npip install -e &quot;.[dev]&quot;\npython -m pytest -q tests          # unit tests (config, LLM adapters with mocked streams, agent loop, …)\npython -m ruff check alveus mcp_servers\n<\/code><\/pre>\n<p>Integration checks that need the running stack: <code>alveus doctor --warm<\/code>, <code>alveus tools<\/code>,\n<code>alveus llm test<\/code>, <code>printf 'what is my gpu temperature?\\n/quit\\n' | alveus chat<\/code>.\nCloud profiles: <code>alveus llm test --profile claude<\/code> (one paid request; needs the key).<\/p>\n<p>LLM adapters are tested without network: httpx <code>MockTransport<\/code> for the two OpenAI protocols and the\n<code>anthropic<\/code> SDK with an <code>httpx2.MockTransport<\/code> (<code>tests/test_llm_adapters.py<\/code>); feed the SSE events a\nprovider sends and assert the <code>LLMEvent<\/code>s and the request body. New provider quirks belong in a\npreset in <code>alveus/llm/providers.py<\/code> plus a test, not in a new class.<\/p>\n<h2 id=\"conventions\">Conventions<\/h2>\n<ul>\n<li>Python ≥ 3.11, type hints, <code>from __future__ import annotations<\/code>.<\/li>\n<li>One backend per file; register in the package <code>__init__<\/code> factory (<code>make_llm<\/code>, <code>make_stt<\/code>,\n  <code>make_tts<\/code>). Backends load lazily (<code>load()<\/code>), so unused engines cost nothing.<\/li>\n<li>Heavy imports (torch, faster_whisper, kokoro, chatterbox, onnx_asr, openwakeword) happen\n  inside <code>load()<\/code>/<code>__init__<\/code> of the backend, never at module import.<\/li>\n<li>Everything user-facing reads configuration via <code>load_config()<\/code>; no hard-coded paths.<\/li>\n<li>MCP servers return JSON strings via <code>j()<\/code>; mark irreversible tools with <code>annot(destructive=True)<\/code>.<\/li>\n<li>Logging through <code>logging.getLogger(__name__)<\/code>; the CLI installs a Rich handler and a file handler.<\/li>\n<\/ul>\n<h2 id=\"repository-map\">Repository map<\/h2>\n<pre><code>alveus/            core package (see architecture.md)\nmcp_servers/       built-in MCP servers\nconfig/            alveus.yaml (defaults), instructions.md, personalities/ (shipped), local.yaml (git-ignored), comfy/ (exported ComfyUI workflows)\nscripts/           installer pieces: pip_install_env.sh, build_llama.sh, download_models.sh,\n                   install_services.sh, train_wakeword.sh\nsystemd/           *.service.in templates rendered by install_services.sh\ntests/             pytest unit tests\ndocs/              this documentation; handbook.html is generated by scripts/build_handbook.py\ninstall.sh         end-to-end installer for a new machine\nrequirements-lock.txt   versions verified together on 2026-09-04\n<\/code><\/pre>\n<h2 id=\"roadmap\">Roadmap<\/h2>\n<p>See <a href=\"#devlog\">devlog.md<\/a>: the Plans section is the roadmap, the dated entries are the history.<\/p>\n<h2 id=\"extension-points-and-ideas\">Extension points and ideas<\/h2>\n<ul>\n<li><strong>Streaming STT<\/strong> for lower latency (Whisper streaming, Parakeet streaming via sherpa-onnx).<\/li>\n<li><strong>Memory<\/strong> – a notes/vector store MCP server so the assistant remembers facts across sessions\n  (history is currently per process).<\/li>\n<li><strong>Timers/reminders<\/strong> – an MCP server with a scheduler and <code>/speak<\/code> callbacks.<\/li>\n<li><strong>Home Assistant<\/strong> – enable the example server block in <code>config/alveus.yaml<\/code>.<\/li>\n<li><strong>Vision<\/strong> – Bonsai ships an <code>mmproj<\/code> vision tower; llama-server can take images\n  (<code>--mmproj<\/code>), so a <code>screenshot → describe<\/code> tool is feasible.<\/li>\n<li><strong>Speaker identification<\/strong> – gate destructive actions on your voice.<\/li>\n<\/ul>\n<h2 id=\"documentation\">Documentation<\/h2>\n<p>Edit <code>docs/*.md<\/code>, then <code>python scripts/build_handbook.py<\/code> (needs the <code>markdown<\/code> package from the\n<code>dev<\/code> extra) to regenerate <code>docs/handbook.html<\/code>, a single self-contained page that works from\n<code>file://<\/code> and is served by the GUI at <code>/handbook<\/code>. Commit both.<\/p>\n<h2 id=\"release-checklist\">Release checklist<\/h2>\n<ol>\n<li><code>python -m pytest -q tests &amp;&amp; python -m ruff check alveus mcp_servers &amp;&amp; python scripts/build_handbook.py<\/code><\/li>\n<li><code>alveus doctor --warm<\/code> on a clean env created by <code>./install.sh --skip-models --skip-llama<\/code><\/li>\n<li>Update <code>requirements-lock.txt<\/code> (<code>pip freeze | grep …<\/code>) and the version in <code>pyproject.toml<\/code>/<code>alveus/__init__.py<\/code><\/li>\n<li>Tag and push.<\/li>\n<\/ol>", "headings": [{"id": "setup", "text": "Setup", "level": 2}, {"id": "conventions", "text": "Conventions", "level": 2}, {"id": "repository-map", "text": "Repository map", "level": 2}, {"id": "roadmap", "text": "Roadmap", "level": 2}, {"id": "extension-points-and-ideas", "text": "Extension points and ideas", "level": 2}, {"id": "documentation", "text": "Documentation", "level": 2}, {"id": "release-checklist", "text": "Release checklist", "level": 2}], "source": "docs/development.md"}, {"slug": "devlog", "title": "Dev log & plans", "group": "Maintain", "html": "<h1 id=\"development-log\">Development log<\/h1>\n<p>History and plans in one place. Newest entries first; each entry says what changed, why, and what was\nlearned. Commit hashes refer to <code>git log<\/code>. The <strong>Plans<\/strong> section at the top is the roadmap; AGENTS.md,\nREADME and development.md point here instead of keeping their own copies.<\/p>\n<h2 id=\"plans-in-priority-order-agreed-with-the-owner\">Plans (in priority order, agreed with the owner)<\/h2>\n<ol>\n<li><strong>Conversations and memory.<\/strong> Persist conversations (list, resume, search), summarize long ones,\n   and give the agent a memory store it can read and write across restarts (facts, preferences).\n   Likely an MCP server plus a sidebar in the GUI; today history lives only in <code>Agent.history<\/code>.<\/li>\n<li><strong>Image generation through ComfyUI.<\/strong> ComfyUI is installed and running (see 2026-09-10) but not\n   wired to Alveus. Design: <code>mcp_servers/comfy.py<\/code> exposes each exported workflow in <code>config/comfy/<\/code> as\n   one tool with a few parameters (prompt, size, seed, steps), driven by a manifest that maps\n   parameters to node inputs by node <em>title<\/em>. It POSTs <code>/prompt<\/code>, polls <code>/history/&lt;id&gt;<\/code>, fetches the\n   image via <code>/view<\/code> or copies it from ComfyUI's own output folder (<code>~/local/lib/ComfyUI/output<\/code>,\n   the default; the service no longer passes <code>--output-directory<\/code>) into Alveus's image folder\n   (<code>~/local/data/alveus-ai/images<\/code>) and opens it with the desktop tool. Both paths are settings\n   (<code>images.comfy_output<\/code> and <code>images.dir<\/code>, editable in the GUI) so the GUI's own renders stay in\n   ComfyUI's folder while Alveus-made images live with the other Alveus data. VRAM rule: Z-Image and SDXL fit next to the LLM; FLUX.1 dev and FLUX.2 klein 9B need\n   <code>alveus-llm<\/code> stopped for the render (then restarted) or a clear failure; free ComfyUI's memory\n   after every job (<code>POST /free<\/code>). Later: <code>scripts/install_comfy.sh<\/code>, image-to-image, showing the\n   image in the GUI.<\/li>\n<li><strong>Vision input and video.<\/strong> Bonsai's <code>mmproj<\/code> tower via llama-server <code>--mmproj<\/code> (screenshots,\n   camera), video understanding and generation, each a pluggable backend like STT/TTS.<\/li>\n<li><strong>Interrupt by speech.<\/strong> (1) PipeWire echo cancellation (<code>module-echo-cancel<\/code>) so the mic no\n   longer hears the assistant; select the cancelled source as <code>audio.input_device<\/code>; verify by\n   recording while it speaks. (2) Name-triggered barge-in while speaking (the custom wake-word models\n   already run during playback, so this is mostly tuning once echo cancellation works). (3) Optionally\n   any-speech interruption.<\/li>\n<li><strong>Wake-word tuning.<\/strong> The trained models score the owner's voice at only ~0.25 (threshold 0.5)\n   while the synthetic voices score 0.9. Options: retrain with a phonetic spelling that matches how the\n   owner says the names (<code>scripts/train_wakeword.sh \"al vay us\" alveus<\/code>), add \"hey Alveus\" variants,\n   or lower the threshold to ~0.25 and accept some false wakes. Sample clips of the trainer's\n   pronunciation are in <code>~/local/model/wakeword/samples/<\/code>.<\/li>\n<\/ol>\n<p>Smaller ideas: timers/reminders (<code>systemd-run --user --on-active<\/code> or an in-process timer that calls\n<code>/speak<\/code>), Home Assistant, speaker identification, a reasoning on/off toggle (<code>thinking:<\/code> per\nprofile is a one-line patch; <code>llm.effort<\/code> exists for cloud models, local ones only have\nllama-server's <code>--reasoning-budget<\/code>). LLM layer follow-ups (see 2026-11-07): a live run of each\ncloud profile once keys exist, switching profiles without a restart, a Gemini preset.<\/p>\n<h2 id=\"2026-11-07-late-afternoon-qwen3-tts-as-a-third-voice-engine-curated-female-voices\">2026-11-07 (late afternoon) — Qwen3-TTS as a third voice engine; curated female voices<\/h2>\n<ul>\n<li>\n<p>Follow-up: the owner listened and removed Xiaoyu and Wanqing (TTS-SCDuFSC): not good enough. They\n  were three short read sentences (cycling-forum lines, 2–5 s each) joined with pauses, so the\n  prosody was flat and choppy; better sources are single continuous 8–12 s utterances. Six voices\n  remain: Ayaka, Hina, Yuzu, Mio, Shiori, Feiyu.<\/p>\n<\/li>\n<li>\n<p>Owner: add Qwen3-TTS 1.7B as a TTS engine; download and curate female voice samples from 朱花\n  (aiseiyou.com), japanese-anime-speech, da-fei-yu-girl-voice-zh and TTS-SCDuFSC, and name them.<\/p>\n<\/li>\n<li><strong>Engine<\/strong> (<code>tts.backend: qwen3<\/code>): qwen-tts 0.1.1 pins transformers 4.57.3 and fails on Alveus's\n  5.2 (<code>check_model_inputs<\/code> was removed), so it runs in a worker process with its own venv\n  (<code>.venv-qwen3tts<\/code>, on top of the alveus Python, 139 MB; <code>scripts/install_qwen3_tts.sh<\/code>,\n  <code>install.sh --with-qwen3-tts<\/code>). JSON request per sentence over a pipe, float32 audio back; the\n  worker ends with Alveus (stdin closes) or when the engine is swapped (<code>live._engine<\/code> calls\n  <code>close()<\/code>). Weights in <code>/mnt/data/models/tts<\/code> (root disk at 94 %). Measured: ready in 3.4 s,\n  3.9 GB VRAM, ~2 s per sentence (sdpa, no flash-attn); live swap Kokoro → Qwen3 → Kokoro works and\n  frees the worker. Models <code>1_7b<\/code> (downloaded) and <code>0_6b<\/code> (downloads on first use); per-model voice,\n  gender, language, variation in the settings tree; <em>Its words<\/em> shows whether the recording has a\n  transcript and <em>Write it down<\/em> (<code>POST /voices/transcribe<\/code>) makes one with the running STT.<\/li>\n<li><strong>Cloning mode per sentence<\/strong> (measured, see backends.md): with the transcript, in-context\n  cloning is best in the recording's own language (0.88–0.94 speaker similarity) but drifts for\n  English from a Japanese/Chinese voice (as low as 0.70; Yuzu came out at 155 Hz against a 396 Hz\n  recording); the x-vector mode holds at 0.87–0.92 there. The engine sends the transcript only\n  for sentences in the recording's language.<\/li>\n<li><strong>Voices<\/strong> (<code>voices/<\/code>, <code>SOURCES.md<\/code> with sources and terms): Ayaka/朱花 (official 8 s sample from the\n  AI声優 YouTube channel; free use, credit \"AI声優-朱花\"; her creator calls her a cheeky tsundere, which\n  pairs with the Tsundere personality), Hina, Yuzu, Mio, Shiori (one line each from four characters\n  of japanese-anime-speech shard 0, CC0; file names carry character codes <code>0fem_aia<\/code> etc.; lines with\n  adult or awkward content skipped), Feiyu/大肥鱼 (ModelScope, CC-BY-NC), Xiaoyu and Wanqing\n  (TTS-SCDuFSC speakers F004/F003, three sentences joined, CC-BY-NC-ND; the speakers read different\n  scripts after the first lines, so sentences are matched by text). All trimmed, mono 24 kHz,\n  -20 LUFS, with <code>.txt<\/code> words; chosen by noise floor, pauses, pitch and Whisper agreement with the\n  given text (0–0.08 apart from 朱花's spelling), then cloned with Qwen3-TTS in their language and in\n  English: Whisper understood every output.<\/li>\n<li>Fixes on the way: a dead worker is retired at once (a race let the next sentence write to it);\n  with no voice chosen the gender (and name) follows the recording that is actually copied.<\/li>\n<\/ul>\n<h2 id=\"2026-11-07-afternoon-instructions-and-personalities-are-separate-four-personalities-ship\">2026-11-07 (afternoon) — instructions and personalities are separate; four personalities ship<\/h2>\n<ul>\n<li>Owner: separate personality from instructions (instructions = directions and boundaries,\n  personality = how it sounds), store several personalities and choose one; the calm, warm one is\n  the default, plus a sweet one (honest, intimate, a bit whimsical), a playful, slightly flirtatious\n  tsundere, and a genki one (proactive, attentive, optimistic).<\/li>\n<li><code>config/persona.md<\/code> became <code>config/instructions.md<\/code> (<code>assistant.instructions_file<\/code>; the old\n  <code>persona_file<\/code> key is still read) with a <code>{personality}<\/code> slot and a paragraph saying a personality\n  never changes what the assistant does or is a reason to refuse, delay or pad. The style lines that\n  were in it (\"direct, warm, and unhurried\", using the name now and then, everyday words) moved into\n  <code>config/personalities/calm.md<\/code>. One new direction for every personality: offer a further step\n  rather than taking it (genki's proactiveness stays an offer).<\/li>\n<li><code>alveus/personality.py<\/code>: shipped personalities in <code>config/personalities/<\/code> are read-only; the\n  owner's own and edited copies live in <code>assistant.personalities_dir<\/code> (<code>personalities/<\/code>, git-ignored)\n  and override by id; deleting a copy restores the original. Placeholders are filled by name only, so\n  a stray brace in hand-written text no longer breaks the prompt (<code>str.format<\/code> did).<\/li>\n<li>API <code>GET/PUT /instructions<\/code> (replaces <code>/persona<\/code>), <code>GET /personalities<\/code>, <code>PUT<\/code>/<code>DELETE\n  /personalities/{id}<\/code>; switching is an ordinary setting (<code>assistant.personality<\/code>, applied live;\n  the report says \"personality: Sweet\"). The instructions path no longer needs a restart.<\/li>\n<li>GUI: Assistant → Personality cards with an editor for the chosen one (name, description, words;\n  Save, Save as new…, Restore original, Delete); Advanced → Instructions. Settings search now also\n  matches the names on choice cards (\"tsundere\", \"kokoro\").<\/li>\n<li>Live check on DeepSeek Flash, same question under each (\"Long day. What is 15 percent of 80? And\n  should I bother finishing the analysis tonight?\"): all answered \"twelve\" first and kept to two or\n  three sentences; calm was even, sweet called them \"love\" and offered to help tomorrow, tsundere\n  covered its concern with \"don't get used to it\", genki offered to note where they left off.<\/li>\n<\/ul>\n<h2 id=\"2026-11-07-late-night-confirmations-follow-the-conversation-fewer-of-them\">2026-11-07 (late night) — confirmations follow the conversation; fewer of them<\/h2>\n<ul>\n<li>Owner: no chime before answering (keep the flow natural); silence was intentional; wait longer\n  after the question. The chime is gone; the wait is <code>activation.confirm_wait_s<\/code> (15 s, was a fixed\n  6 s); silence now ends the question (no automatic re-ask) and the model is told the user did not\n  answer and not to ask again; an unclear reply still gets one shorter question.<\/li>\n<li>Relaxed what asks: <code>close_window<\/code> is no longer marked destructive; <code>move_path<\/code> refuses to overwrite\n  and asks only with <code>overwrite=true<\/code>; <code>control_service<\/code> asks only for stop/disable or system scope\n  (<code>ASK_WHEN<\/code> in <code>agent/loop.py<\/code>); <code>rmdir<\/code> left the risky-shell pattern. Delete, kill, power and risky\n  shell commands still ask. The persona no longer tells the model to ask for confirmation itself\n  (the system does), so the model and the gate do not both ask.<\/li>\n<\/ul>\n<h2 id=\"2026-11-07-night-a-confirmation-that-never-heard-the-answer-settings-apply-without-a-restart-previews-on-the-speaker\">2026-11-07 (night) — a confirmation that never heard the answer; settings apply without a restart; previews on the speaker<\/h2>\n<ul>\n<li><strong>\"Close it\" was asked although the model chose not to ask, then counted as declined.<\/strong> From the saved\n  history (DeepSeek Flash): the model reasoned that closing a window it had just opened needs no\n  question and called <code>desktop__close_window<\/code>; the agent's destructive gate asked anyway (by design:\n  <code>close_window<\/code> is marked destructive, and the gate does not depend on the model). The spoken\n  question was six seconds of raw JSON (\"close window with {title_substring: Firefox}\"); listening\n  started at 03:25:22 and ended at 03:25:23 with no transcript: a sound shorter than <code>min_speech_ms<\/code>\n  (the tail of its own question or a clipped answer) started a \"speech\" that 0.7 s of silence then\n  ended, and <code>rec is None<\/code> was returned as <code>False<\/code>, so the model was told \"the user declined, do not\n  retry\". Fixes: plain-words descriptions (<code>describe_action<\/code>: \"close window: Firefox\"), a chime before\n  listening, a 0.15 s settle, <code>patient<\/code> recording (blips below <code>min_speech_ms<\/code> do not end the window),\n  yes/no/unclear parsing with one repeat, and silence reported as <code>no_answer<\/code> (the model may ask again)\n  instead of a refusal. GUI confirmations that time out are <code>no_answer<\/code> too. New <code>tools.no_confirm<\/code>\n  (GUI: Don't ask for these) for risky tools the owner trusts; shell commands and sudo always ask.\n  A unit test reproduces the old failure with a 64 ms click before the answer.<\/li>\n<li><strong>Previews could not be heard.<\/strong> The endpoint answered in 0.2–1.2 s and a simulated click in a clean\n  headless Chrome played; the owner's Chrome did not, cause unknown (tab or site sound, autoplay).\n  ▶ now plays on the assistant's own speaker (<code>POST /tts/preview<\/code> with <code>play<\/code>, <code>POST /voices/play<\/code> for\n  Chatterbox recordings), which is also what the voice will sound like; the browser is the fallback when\n  there is no speaker. Each preview is logged.<\/li>\n<li><strong>Restart-free settings.<\/strong> <code>alveus/live.py<\/code> applies a saved configuration to the running process\n  (GUI and YAML editor send <code>apply: true<\/code>): instant for names/persona/gender, model settings and\n  switching profiles (new adapter; the history is provider-neutral, so the conversation continues),\n  engine settings that <code>reconfigure()<\/code> takes in place (Kokoro voice/speed/accent on the loaded model,\n  Chatterbox sample/expressiveness/language, Whisper language), VAD, wake names and sensitivity,\n  the hotkey, log level; reload-and-swap for another engine or model (load the new one, swap, free the\n  old; nothing preloaded); tool servers, audio devices and the API address are reported as restart-only.\n  Persona saves rebuild the system prompt at once. Verified on an isolated instance: voice and speed\n  changed in the running process, a microphone change reported for the restart. 74 tests.<\/li>\n<\/ul>\n<h2 id=\"2026-11-07-evening-settings-page-redesigned-as-a-tree-a-model-choice-per-provider-per-model-settings\">2026-11-07 (evening) — settings page redesigned as a tree; a model choice per provider; per-model settings<\/h2>\n<ul>\n<li><strong>Review (owner asked for one, with UX in mind).<\/strong> Findings on the old page, worst first:\n  (1) dependent fields never hid: <code>.field{display:grid}<\/code> beat the <code>hidden<\/code> attribute, so all three\n  speech-to-text and all three voice engines' options showed at once (same bug hid nothing in the\n  save bar); (2) flat where the settings are nested: engine → model → that model's voice, folder,\n  gender and language, with gender and voices folder global although only one engine used each;\n  (3) no way to pick a model within a provider (DeepSeek Flash, Claude Sonnet, a new GGUF): only\n  predefined profiles; (4) typing where picking is possible: device names from <code>wpctl status<\/code>,\n  language codes, <code>af_bella<\/code>-style voice ids, pynput shortcut syntax; (5) a paragraph of hint under\n  every row (the page was 9,000 px); (6) no way to hear a voice before choosing it; (7) Kokoro's accent\n  was a separate setting that silently mismatched British voices; (8) save, then a separate restart\n  button, with nothing saying what a change restarts.<\/li>\n<li><strong>New structure.<\/strong> <code>SECTIONS<\/code> is a tree: choices render as cards with one line each, and the\n  chosen option's own settings open in a nested panel, recursively (Voice → Chatterbox → Multilingual\n  → voice to copy / gender / language). Model-specific values are stored under\n  <code>&lt;engine&gt;.models.&lt;model&gt;<\/code> and resolved by <code>config.engine_opts()<\/code> (engine block &lt; model block, with\n  <code>tts.voices_dir<\/code> / <code>tts.voice_gender<\/code> as fallbacks); every model keeps its own. Sections: Assistant,\n  Language model, Listening, Voice, Activation, Audio, Tools &amp; safety, System, Advanced.<\/li>\n<li><strong>Language model.<\/strong> Provider cards (this computer, Anthropic, OpenAI, DeepSeek, OpenRouter, vLLM,\n  Ollama, other server; key status on each), the API key in the provider's panel, then a model list\n  from <code>GET /llm/models<\/code> (GGUF files under <code>ALVEUS_MODELS<\/code>; the provider's live list with a key, else\n  suggestions; <em>another model id…<\/em>), then that model's settings, shown only where the provider\n  supports them (<code>PROVIDER_INFO<\/code>: effort levels, thinking switch, sampling; context length and top-k\n  for local files via <code>serve.context<\/code>). Picking an unknown model creates its profile on save; the\n  preflight checks unsaved profiles too (<code>definition<\/code>).<\/li>\n<li><strong>Pickers.<\/strong> PipeWire devices (<code>GET /audio/devices<\/code>), languages by name, Kokoro voices with accent\n  and gender, ▶ for a Kokoro sample (<code>POST /tts/preview<\/code>, any accent on the loaded model) and for\n  the Chatterbox recording (<code>GET /voices/file<\/code>), <em>Record<\/em> for the shortcut, the automatic gender shown\n  with its reason. Kokoro's accent now follows the voice (<code>lang_code: null<\/code>).<\/li>\n<li><strong>Saving.<\/strong> One <em>Save &amp; restart<\/em> (restarts the LLM server too when the model changes), <em>Save\n  without restart<\/em>, a warning when leaving with unsaved edits, <em>changed · reset<\/em> per row (reset =\n  use the inherited value). One-line hints with <em>More<\/em>; the page is ~6,500 px with everything open.<\/li>\n<li><strong>Verified<\/strong> on a text-only instance with its own <code>local.yaml<\/code> copy (<code>ALVEUS_LOCAL_CONFIG<\/code>, new) and\n  <code>INVOCATION_ID<\/code> unset, in headless Chrome over DevTools: no JS errors; engine/model switching shows\n  the right nested settings; a Chinese language set for Chatterbox Multilingual lands in\n  <code>tts.chatterbox.models.multilingual.language<\/code>; picking DeepSeek Flash with low effort saved a new\n  <code>deepseek-flash<\/code> profile after a passing preflight, and one real request with it succeeded; the\n  local list shows both GGUF files and the missing Qwen file; Kokoro preview of a British voice\n  while an American one was loaded (3.4 s WAV); path traversal on <code>/voices/file<\/code> refused; phone width\n  without horizontal scroll; light theme. 65 tests.<\/li>\n<\/ul>\n<h2 id=\"2026-11-07-later-first-live-cloud-runs-deepseek-the-local-server-follows-the-profile-key-hygiene\">2026-11-07 (later) — first live cloud runs (DeepSeek); the local server follows the profile; key hygiene<\/h2>\n<ul>\n<li><strong>Live DeepSeek.<\/strong> With the owner's disposable key (entered by them; never seen by the session):\n  <code>alveus llm test --profile deepseek<\/code> with thinking on (reasoning streamed to the GUI channel) and\n  <code>--no-thinking<\/code> (<code>thinking: {type: disabled}<\/code> accepted, no reasoning returned); a two-turn\n  <code>alveus chat --profile deepseek<\/code> with a tool call in each turn (the second turn carries the first\n  turn's <code>reasoning_content<\/code>, which DeepSeek demands); one turn through the running assistant.\n  Replies took 2–5 s per turn including the tool round. About a dozen requests in total; the\n  account showed $17.56 afterwards (<code>GET /user/balance<\/code>).<\/li>\n<li><strong>Gap found and closed.<\/strong> The owner had switched to DeepSeek and restarted only the assistant\n  (old code), so llama-server kept ~10 GB of VRAM. Now <code>alveus/llm/service.py<\/code> runs first in\n  <code>VoiceAssistant.start()<\/code>: a profile without <code>serve:<\/code> stops <code>alveus-llm<\/code>, a local profile starts it\n  if down and restarts it if it serves another model (<code>llm.manage_local_server<\/code>, default on;\n  skipped for <code>--profile<\/code> overrides because the unit serves the saved profile). Verified on the\n  real services: local → DeepSeek (restart both) and DeepSeek → local → DeepSeek with\n  assistant-only restarts; GPU memory 13.9 GB → 3.7 GB, and the profile survives restarts because\n  it is saved in <code>config/local.yaml<\/code>. <code>--no-block<\/code> systemctl calls, since the caller is itself a unit.<\/li>\n<li><strong>Key hygiene.<\/strong> AGENTS.md has a rule section for sessions (never read the key file or dump\n  environments, check keys only by source, warn before paid test series). The files/shell tools\n  refuse <code>~/.config/alveus/<\/code> (read, list, find, search, and shell commands naming it). The\n  <code>anthropic<\/code> and <code>httpx2<\/code> loggers are held at WARNING like <code>openai<\/code>/<code>httpx<\/code>, so DEBUG logs do not\n  copy whole conversations. Fixed <code>--show-thinking<\/code> and the tool lines in <code>alveus chat<\/code> / <code>llm\n  test<\/code> printing literal <code>[dim]<\/code> tags.<\/li>\n<\/ul>\n<h2 id=\"2026-11-07-swappable-language-model-providers-three-protocols-cloud-keys-branch-llm-providers\">2026-11-07 — swappable language model: providers, three protocols, cloud keys (branch <code>llm-providers<\/code>)<\/h2>\n<ul>\n<li><strong>Why.<\/strong> The owner wants the central model swappable: the local Bonsai server today, but also\n  cloud APIs (DeepSeek, ChatGPT, Claude) or another local model (Qwen 3.8 27B), without code changes.\n  The old layer was one OpenAI-compatible client, which cannot serve Claude, nor current OpenAI\n  models (they call tools only through the Responses API).<\/li>\n<li><strong>Design.<\/strong> A profile is now a <em>provider<\/em> plus a <em>model<\/em>. Providers are presets\n  (<code>alveus/llm/providers.py<\/code>: protocol, address, key variable, quirks, parameters the provider\n  rejects), not classes; resolution is preset &lt; llm-level defaults &lt; profile. One adapter per wire\n  protocol: <code>openai_chat<\/code> (llama-server, vLLM, Ollama, DeepSeek, OpenRouter, anything compatible;\n  the old client, extended), <code>openai_responses<\/code> (OpenAI, stateless <code>store: false<\/code>, encrypted\n  reasoning replayed), <code>anthropic_messages<\/code> (Claude via the official <code>anthropic<\/code> SDK, adaptive\n  thinking with summaries for the GUI, prompt caching, server-side refusal fallback). The agent's\n  history stays provider-neutral; whatever a provider needs back verbatim (Claude's signed thinking\n  blocks, OpenAI's reasoning items) is stored per message as <code>_replay<\/code> and only that provider's\n  adapter reads it. Old <code>backend: openai<\/code> profiles keep working.<\/li>\n<li><strong>Agent changes that every provider needed.<\/strong> Normalized finish reasons; a tool call cut off by\n  the output limit is never run, and both that case and the tool-round limit now answer every\n  pending call (a dangling <code>tool_use<\/code> is a hard error for Claude and OpenAI); a refusal without\n  text is reported; <code>LLMError<\/code> messages are short enough to be spoken.<\/li>\n<li><strong>Keys and privacy.<\/strong> Keys live in the environment or <code>~/.config/alveus/secrets.env<\/code> (mode 600,\n  outside the repo), set in the GUI (write-only fields right under the profile) or with\n  <code>alveus llm key<\/code>. They are read per request (no restart), never exported to <code>os.environ<\/code>, and\n  API-key variables are stripped from tool servers' environments except the coder's\n  (<code>inherit_api_keys<\/code>). Docs and the GUI hint state plainly that a cloud profile sends the\n  conversation, tool results included, to the provider.<\/li>\n<li><strong>Services.<\/strong> <code>alveus llm serve<\/code> exits 0 for a profile without <code>serve:<\/code>, so choosing a cloud\n  profile stops <code>alveus-llm<\/code> and frees the GPU; <code>/health<\/code> only reports the unit for local-server\n  profiles, and the GUI preflight checks key and model for cloud profiles instead of loading weights.\n  The coder's <code>auto<\/code> follows cloud profiles too (<code>anthropic/claude-opus-5-5<\/code> in opencode terms).<\/li>\n<li><strong>Learned.<\/strong> DeepSeek returns HTTP 400 unless earlier <code>reasoning_content<\/code> is sent back once tools\n  are involved (preset <code>reasoning_replay: all<\/code>), and its thinking switch is <code>thinking: {type}<\/code> plus\n  <code>reasoning_effort<\/code>. Claude's thinking signatures cover everything before them, so trimming old\n  turns invalidates them: the agent drops that replay data when it trims (<code>prefix_bound<\/code>) and the\n  messages are rebuilt without thinking. The current Anthropic API version rejects\n  <code>temperature<\/code>/<code>top_p<\/code>/<code>top_k<\/code> on every model, and Claude Opus 5.5 cannot turn thinking off\n  (only <code>effort<\/code>, default <code>medium<\/code>); its notes between tool calls arrive as thinking blocks, which\n  <code>display: summarized<\/code> makes visible in the GUI. OpenAI's flagship ids are now <code>gpt-6*<\/code>.<\/li>\n<li><strong>Verified.<\/strong> 51 tests (adapters against recorded-style streams, including the SDK through a mock\n  transport and an interrupted Claude stream closing its connection). Local end to end: <code>alveus chat<\/code>\n  with tools on Bonsai through the new adapter. A text-only API instance on port 8799: key storage\n  (file mode 600, values never returned), and the preflight against the real Anthropic, OpenAI and\n  DeepSeek endpoints with a deliberately invalid key (each answered 401 and produced a readable\n  message, which also confirms the URLs). GUI rendered in headless Chrome over the DevTools\n  protocol: no JS errors, labelled profiles, effort choices, key rows. <strong>Not verified:<\/strong> an actual\n  generation from any cloud model; no keys are stored on this machine yet.<\/li>\n<li><strong>Not done on purpose.<\/strong> The Qwen 3.8 27B weights were not downloaded (profile <code>qwen-local<\/code> points\n  at the expected path); opencode's <code>bonsai<\/code> provider would need that model id added for <code>auto<\/code>.<\/li>\n<\/ul>\n<h2 id=\"2026-09-11-reasoning-for-spoken-turns-and-across-reloads\">2026-09-11 — reasoning for spoken turns and across reloads<\/h2>\n<ul>\n<li>The GUI showed the model's reasoning only for turns typed into the page: <code>VoiceAssistant.respond<\/code>\n  (spoken turns, and <code>/chat<\/code> with <code>speak<\/code>) never published reasoning deltas, and <code>/history<\/code> had no\n  reasoning at all, so a reload dropped every reasoning block. Now the agent keeps each assistant\n  message's reasoning under a private <code>_reasoning<\/code> key in <code>Agent.history<\/code> (the LLM client strips\n  keys starting with <code>_<\/code> before sending, so the model never re-reads its own thoughts), <code>/history<\/code>\n  exposes it as <code>reasoning<\/code> per turn, the voice path publishes <code>assistant_reasoning<\/code> events, and the\n  page renders all three sources through one <code>thinkBlock()<\/code> helper. Tests cover the normalisation\n  and the payload stripping. Note for the record: llama-server itself always returned\n  <code>reasoning_content<\/code>, with and without tools; the drop was entirely in Alveus.<\/li>\n<\/ul>\n<h2 id=\"2026-09-10-evening-persona-against-false-refusals-gui-power-menu\">2026-09-10 (evening) — persona against false refusals; GUI power menu<\/h2>\n<ul>\n<li><code>config/persona.md<\/code> gained a paragraph stating the setting Bonsai (Qwen3.6 post-training) is\n  missing: a private machine, an adult owner and administrator as the only user, requests are their\n  own decisions; no refusals, hedging, disclaimers or moralizing; comply the first time. The owner's\n  earlier line (\"comply when asked repeatedly or with a strong tone\") was dropped because it implied\n  the first ask may be refused. Next levers if a hard refusal remains: prefill the assistant turn\n  in <code>Agent.run<\/code>, then abliterated weights. Persona edits apply after an assistant restart (383fe3b).<\/li>\n<li>GUI header: <strong>⏻ Power<\/strong> menu to stop the assistant, the LLM server, or both, via the new\n  <code>POST /services/stop<\/code> (<code>what: assistant | llm | both<\/code>, systemd only, detached <code>systemctl --user\n  stop<\/code>). Stopping the assistant shows an overlay with the start command and polls <code>/health<\/code> until\n  the service is back; other open tabs get the same overlay through the <code>stopping<\/code> SSE event.\n  The \"Stop LLM\" case exists for ComfyUI: the 24 GB card cannot hold Bonsai and a 20 GB image\n  model at once. Verified with headless Chrome (menu opens, Escape closes, screenshot).<\/li>\n<li>ComfyUI's service dropped <code>--output-directory<\/code>: renders from the ComfyUI GUI land in its default\n  <code>~/local/lib/ComfyUI/output<\/code> again. Decision: when Alveus generates images it copies the result\n  into its own folder; both paths become editable settings once the image tool exists (plan 2).<\/li>\n<li>Persona: the speaking-style paragraph now asks for conversational speech (everyday words,\n  contractions, answer first, varied openings, no filler, items strung into a sentence, numbers\n  said aloud, tool results described in plain terms, one short question when ambiguous). The\n  \"always introduce yourself\" wording became \"introduce yourself when asked\", which reads less\n  like a greeting on every turn.<\/li>\n<li><code>config/comfy/<\/code> now holds seven API-format workflows exported by the owner from the ComfyUI GUI,\n  all with plain node ids and every model file present on the Data drive: text-to-image for\n  Z-Image Turbo, Qwen-Image 2512, SDXL base, SDXL base + refiner (two variants); image-to-image\n  for SDXL and Z-Image Turbo with the Fun ControlNet Union (Canny). These are the candidates for the\n  image tool's manifest. ComfyUI's <code>extra_model_paths.yaml<\/code> gained <code>controlnet<\/code> and\n  <code>model_patches<\/code> (the Fun ControlNet loads through ModelPatchLoader, not ControlNetLoader).<\/li>\n<li>Answered for the record: ComfyUI's prompt queue and <code>/history<\/code> are in-memory and lost on restart\n  (images on disk survive); Alveus history is <code>Agent.history<\/code> only (plan item 1); Qwen-Image\n  instructions given (fp8 files from <code>Comfy-Org/Qwen-Image_ComfyUI<\/code>, 2512 refresh, no quantizing\n  needed; nvfp4 or GGUF via ComfyUI-GGUF if smaller is wanted).<\/li>\n<\/ul>\n<h2 id=\"2026-09-10-comfyui-installed-next-to-alveus\">2026-09-10 — ComfyUI installed next to Alveus<\/h2>\n<ul>\n<li>Windows C: shrunk from 735 GB to 500 GB (from Windows), the 1.8 TB NTFS \"Data\" drive mounted at\n  <code>/mnt/data<\/code> by label with <code>ntfs3<\/code> (<code>ntfsfix -d<\/code> was needed once because Windows left it dirty;\n  Fast Startup must stay off). Root partition is 195 GB with ~10 GB free, so models live on Data.<\/li>\n<li>ComfyUI 0.35 in conda env <code>comfy<\/code> (torch 2.14 + cu130) at <code>~/local/lib/ComfyUI<\/code>, user unit\n  <code>comfyui.service<\/code> on 127.0.0.1:8188 with <code>RequiresMountsFor=/mnt/data<\/code>, output folder\n  <code>~/local/data/alveus-ai/images<\/code>, models through <code>extra_model_paths.yaml<\/code> from\n  <code>/mnt/data/comfy/models<\/code>. Downloaded: SDXL base, FLUX.1 dev fp8 (Kijai repack + T5/CLIP encoders,\n  FLUX VAE from the Z-Image repack), Z-Image Turbo (bf16/int8/nvfp4 + Qwen3-4B encoders), FLUX.2 klein\n  9B (gated black-forest-labs repo, auto-approved; Comfy-Org repack only holds encoders and VAE).<\/li>\n<li>First workflow exported in API format: <code>config/comfy/z_image_turbo_demo.json<\/code>. Its node ids came\n  out as <code>57:27<\/code> (node 27 inside subgraph 57) because it was built inside a subgraph; renumbered to\n  plain ids and verified by submitting it to ComfyUI (6 s render, no node errors).<\/li>\n<li>Measured VRAM at idle: llama-server 9.8 GB, assistant 7 GB, ComfyUI 3.3 GB after a Z-Image render.<\/li>\n<li>Docs: AGENTS runtime layout and roadmap; this dev log created; roadmap moved here (9153e63).<\/li>\n<\/ul>\n<h2 id=\"2026-09-09-evening-reboot-fix-wake-words-chinese-gui-coder\">2026-09-09 (evening) — reboot fix, wake words, Chinese, GUI, coder<\/h2>\n<ul>\n<li><strong>Service did not start at login<\/strong> (b45f5b1): <code>alveus-llm.service<\/code> had <code>After=default.target<\/code>\n  while being <code>WantedBy=default.target<\/code> — an ordering cycle; systemd silently dropped\n  <code>alveus.service<\/code>'s start job. Removed the line in the template and the installed unit.<\/li>\n<li><strong>openWakeWord phrases never fired in <code>mode: both<\/code><\/strong> (a23ba42): VAD started recording on the first\n  speech frame and the recorder consumed every following frame without scoring it; the model only ever\n  saw 32 ms. The recorder now keeps scoring and a detection acts like the hotkey. <code>alveus\n  wakeword-test<\/code> also read a non-existent config key and always tested <code>hey_jarvis<\/code>.<\/li>\n<li><strong>Microphone silent after the reboot<\/strong>: the SC-GN01 mic delivered digital silence while <code>wpctl<\/code>\n  looked fine (hardware mute). Diagnosed by recording with <code>pw-record<\/code> and measuring the peak.<\/li>\n<li><strong>Chinese was translated to English<\/strong> (6ee3486): <code>stt.faster_whisper.language: en<\/code> makes Whisper\n  translate; set to <code>null<\/code> (auto-detect) in local.yaml. Verified with real Mandarin recordings.\n  Kokoro cannot speak CJK (reads characters as \"Chinese letter\"); Chatterbox multilingual can, and\n  the owner switched to it.<\/li>\n<li><strong>GUI chat scrolling<\/strong> (e328cb3, fb4705a): the log follows generation only while the reader is at\n  the bottom; a \"newer messages\" button resumes. Two subtleties: streamed deltas arrive faster than\n  scroll events, so a wheel movement was undone by the next delta — detected by comparing the position\n  with the last auto-scroll; and an author <code>display:flex<\/code> beat the <code>hidden<\/code> attribute, so the button\n  was always visible. Verified in headless Chrome via the DevTools protocol.<\/li>\n<li><strong>Custom wake words trained<\/strong> (161e395, f27c71d): <code>scripts/train_wakeword.sh alveus<\/code> / <code>aurea<\/code> with\n  livekit-wakeword in its own conda env. Obstacles: piper's phonemizer needs the <code>espeak-ng<\/code> binary\n  (no apt rights, no conda package) — compiled the small CLI against the system <code>libespeak-ng<\/code> and\n  taught the script to do so; the 19 GB dataset landed inside the repo — moved to\n  <code>$ALVEUS_MODELS/wakeword-train-data<\/code>; the GPU was 97 % full while the trainer shared it with the\n  services. Results: recall 99.2 % / 99.6 %, 0 false positives per hour on the synthetic validation\n  set; the assistant's Kokoro voice scores 0.90 / 0.66; the owner's own voice only ~0.25 (see Plans).\n  <code>oww_model<\/code> accepts a list, GUI shows models as checkboxes, both models are active in <code>mode: both<\/code>.<\/li>\n<li><strong>coder tool used <code>~<\/code> instead of the coding folder<\/strong> (d392f28): the model filled <code>directory<\/code> with\n  <code>\"~\"<\/code> or <code>\"repo\"<\/code>. The tools now resolve those against <code>ALVEUS_CODE_DIR<\/code>, quote the folder in their\n  descriptions and list its subfolders on an unknown name.<\/li>\n<li><strong>GUI<\/strong> (9edf26f): \"speak replies\" and \"show reasoning\" on by default; settings search box.<\/li>\n<li>Traps recorded in AGENTS.md: <code>pkill -f<\/code> killed the working shell again; loopback tests through the\n  SC-GN01 do not work; keep big downloads off the root partition.<\/li>\n<\/ul>\n<h2 id=\"2026-09-09-night-before-voice-ux-and-robustness\">2026-09-09 (night before) — voice UX and robustness<\/h2>\n<ul>\n<li>Coder tool follows the assistant's model by default; model and folder editable in Settings (a62f4bc).<\/li>\n<li>One <code>StreamSpeaker<\/code> for the voice loop and GUI; GUI speech honours <code>streaming_tts<\/code> (c82a65e).<\/li>\n<li>Listen beside Send, Stop beside Speak, Interrupt while replying; sudo \"allow once\" password card\n  (ff88629). Stop aborts the whole reply's speech; clean SIGTERM shutdown (<code>systemctl stop<\/code> used to\n  hang 90 s); <code>/debug/tasks<\/code> shows where asyncio tasks are stuck (7e018c0, 9216f02).<\/li>\n<li>Listen from any source interrupts a reply before listening (6129f37). Voice turns stream live into\n  the GUI, including spoken confirmation questions (df4ba9c). Tool cards show the command being run;\n  tools return real error text; persona told to read errors and not repeat calls (1797d0d, a9804f9).<\/li>\n<li>Code blocks: copy button, language tag, blank lines kept (3365687).<\/li>\n<\/ul>\n<h2 id=\"2026-09-08-multilingual-speech-settings-semantics\">2026-09-08 — multilingual speech, settings semantics<\/h2>\n<ul>\n<li>Settings: an empty text field saves an explicit <code>null<\/code> (e.g. STT language auto-detect) instead of\n  reverting to the default; clearer field explanations (b1f579b).<\/li>\n<li>Chatterbox Multilingual: 23 languages with per-sentence language detection and CJK splitting\n  (5997929, f9fe755). TTS strips emoji/symbols, skips unpronounceable fragments, survives a failing\n  sentence, reports speech errors in the GUI (90149a0).<\/li>\n<li><code>voice_gender: auto<\/code> infers from the cloned sample's <code>f_<\/code>/<code>m_<\/code> prefix, deciding Alveus vs Aurea\n  (4d3aa7e). Copy / speak again / retry under replies; voices folder (<code>tts.voices_dir<\/code>) with a live\n  sample picker and a visible warning when a sample is missing (fa089dd, d57dfa0). AGENTS.md written.<\/li>\n<\/ul>\n<h2 id=\"2026-09-04-05-first-version\">2026-09-04 / 05 — first version<\/h2>\n<ul>\n<li>Alveus created: Bonsai-27B via the PrismML llama.cpp fork (prism branch, PQ2_0 kernels),\n  faster-whisper / Parakeet STT, Kokoro / Chatterbox TTS, Silero VAD, openWakeWord, pynput hotkey,\n  MCP tool servers (files/shell, desktop, system, web, coder→opencode), Typer CLI, systemd units,\n  <code>install.sh<\/code> (f6ada82).<\/li>\n<li>Full documentation set and the offline handbook (<code>scripts/build_handbook.py<\/code>, <code>/handbook<\/code>), the\n  ultraviolet theme, browser GUI with streamed chat, tool cards, confirmations, settings editor and\n  restart (196aa5e, 12c3bf7, 1104264, eba7e27).<\/li>\n<li>Build traps: moved cmake build dirs break RPATH (<code>-DCMAKE_BUILD_RPATH_USE_ORIGIN=ON<\/code>); <code>master<\/code> of\n  the fork lacks the PQ2_0 kernels (196544f). Units inherit DISPLAY/XAUTHORITY from the session.<\/li>\n<\/ul>", "headings": [{"id": "plans-in-priority-order-agreed-with-the-owner", "text": "Plans (in priority order, agreed with the owner)", "level": 2}, {"id": "2026-11-07-late-afternoon-qwen3-tts-as-a-third-voice-engine-curated-female-voices", "text": "2026-11-07 (late afternoon) — Qwen3-TTS as a third voice engine; curated female voices", "level": 2}, {"id": "2026-11-07-afternoon-instructions-and-personalities-are-separate-four-personalities-ship", "text": "2026-11-07 (afternoon) — instructions and personalities are separate; four personalities ship", "level": 2}, {"id": "2026-11-07-late-night-confirmations-follow-the-conversation-fewer-of-them", "text": "2026-11-07 (late night) — confirmations follow the conversation; fewer of them", "level": 2}, {"id": "2026-11-07-night-a-confirmation-that-never-heard-the-answer-settings-apply-without-a-restart-previews-on-the-speaker", "text": "2026-11-07 (night) — a confirmation that never heard the answer; settings apply without a restart; previews on the speaker", "level": 2}, {"id": "2026-11-07-evening-settings-page-redesigned-as-a-tree-a-model-choice-per-provider-per-model-settings", "text": "2026-11-07 (evening) — settings page redesigned as a tree; a model choice per provider; per-model settings", "level": 2}, {"id": "2026-11-07-later-first-live-cloud-runs-deepseek-the-local-server-follows-the-profile-key-hygiene", "text": "2026-11-07 (later) — first live cloud runs (DeepSeek); the local server follows the profile; key hygiene", "level": 2}, {"id": "2026-11-07-swappable-language-model-providers-three-protocols-cloud-keys-branch-llm-providers", "text": "2026-11-07 — swappable language model: providers, three protocols, cloud keys (branch llm-providers)", "level": 2}, {"id": "2026-09-11-reasoning-for-spoken-turns-and-across-reloads", "text": "2026-09-11 — reasoning for spoken turns and across reloads", "level": 2}, {"id": "2026-09-10-evening-persona-against-false-refusals-gui-power-menu", "text": "2026-09-10 (evening) — persona against false refusals; GUI power menu", "level": 2}, {"id": "2026-09-10-comfyui-installed-next-to-alveus", "text": "2026-09-10 — ComfyUI installed next to Alveus", "level": 2}, {"id": "2026-09-09-evening-reboot-fix-wake-words-chinese-gui-coder", "text": "2026-09-09 (evening) — reboot fix, wake words, Chinese, GUI, coder", "level": 2}, {"id": "2026-09-09-night-before-voice-ux-and-robustness", "text": "2026-09-09 (night before) — voice UX and robustness", "level": 2}, {"id": "2026-09-08-multilingual-speech-settings-semantics", "text": "2026-09-08 — multilingual speech, settings semantics", "level": 2}, {"id": "2026-09-04-05-first-version", "text": "2026-09-04 / 05 — first version", "level": 2}], "source": "docs/devlog.md"}]</script>
<script>
(function(){
  const DOCS = JSON.parse(document.getElementById('docs-data').textContent);
  const GROUPS = [...new Set(DOCS.map(d=>d.group))].map(g => [g, DOCS.filter(d=>d.group===g).map(d=>d.slug)]);
  const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
  const $ = id => document.getElementById(id);
  const article=$('article'), toc=$('toc'), navlist=$('navlist'), crumb=$('crumb'), pager=$('pager'), source=$('source');
  const search=$('search'), nav=$('docnav'), menuBtn=$('menuBtn');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function buildNav(filter){
    const q=(filter||'').trim().toLowerCase(); let html='', any=false;
    for (const [g, slugs] of GROUPS){
      let items='';
      for (const s of slugs){
        const d=bySlug[s];
        const hits = q ? d.headings.filter(h=>h.text.toLowerCase().includes(q)) : [];
        if (q && !hits.length && !d.title.toLowerCase().includes(q)) continue;
        any=true;
        items += `<a href="#${s}" data-slug="${s}">${esc(d.title)}${hits.slice(0,6).map(h=>`<span class="hit"><a href="#${s}/${h.id}">${esc(h.text)}</a></span>`).join('')}</a>`;
      }
      if (items) html += `<div class="group">${esc(g)}</div>${items}`;
    }
    navlist.innerHTML = any ? html : '<div class="empty">No headings match.</div>';
    markActive();
  }
  function current(){ const slug=location.hash.replace(/^#/,'').split('/')[0]; return bySlug[slug] ? slug : 'readme'; }
  function markActive(){ const s=current(); navlist.querySelectorAll('a[data-slug]').forEach(a=>a.classList.toggle('active', a.dataset.slug===s)); }
  function show(){
    const slug=current(), idx=DOCS.findIndex(d=>d.slug===slug), d=DOCS[idx], sub=location.hash.split('/')[1];
    article.innerHTML = d.html;
    crumb.innerHTML = `<span class="n">${String(idx+1).padStart(2,'0')}</span> · ${esc(d.group)} · ${esc(d.title)}`;
    toc.innerHTML = d.headings.map(h=>`<a href="#${slug}/${h.id}" class="${h.level===3?'h3':''}" data-id="${h.id}">${esc(h.text)}</a>`).join('') || '<span style="color:var(--muted)">—</span>';
    const prev=DOCS[idx-1], next=DOCS[idx+1];
    pager.innerHTML = (prev?`<a class="prev" href="#${prev.slug}"><small>Previous</small><b>${esc(prev.title)}</b></a>`:'<span></span>') + (next?`<a class="next" href="#${next.slug}"><small>Next</small><b>${esc(next.title)}</b></a>`:'');
    source.innerHTML = `Source: <code>${esc(d.source)}</code> — regenerate with <code>python scripts/build_handbook.py</code>`;
    document.title = slug==='readme' ? 'Alveus Handbook' : d.title + ' · Alveus Handbook';
    markActive(); nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false');
    if (sub){ const el=document.getElementById(sub); if (el) el.scrollIntoView({block:'start'}); } else window.scrollTo(0,0);
    observe();
  }
  let io;
  function observe(){
    if (io) io.disconnect();
    const links=[...toc.querySelectorAll('a')]; if(!links.length) return;
    io = new IntersectionObserver(entries => {
      const vis = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
      if (vis) links.forEach(a=>a.classList.toggle('current', a.dataset.id===vis.target.id));
    }, {rootMargin:'-70px 0px -70% 0px'});
    article.querySelectorAll('h2,h3').forEach(h=>io.observe(h));
  }
  search.addEventListener('input', e=>buildNav(e.target.value));
  menuBtn.addEventListener('click', ()=>{ const open=nav.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(open)); });
  window.addEventListener('hashchange', show);
  buildNav(''); show();
})();
</script>
